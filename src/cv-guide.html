can absolutely do this.** This is a core UCS use case.\n\n**UCS:M approach:**\n```\n;Switch material based on cabinet width\nFor Each FS Part\nIf Cab.DX > 36 Then\n  ;Use thicker material for wide cabinets\n  MatID = MaterialID('3/4 Plywood')\nElse\n  MatID = MaterialID('5/8 Plywood')\nEnd If\n```\n\n**UCS:JS approach (more powerful):**\n```javascript\n// Auto-switch shelf material based on cabinet width\nvar width = _cab.DX;\nvar matId;\n\nif (width > 48) {\n  matId = _this.QueryID(ID_MATERIAL, '1\" Plywood');\n} else if (width > 36) {\n  matId = _this.QueryID(ID_MATERIAL, '3/4 Plywood');\n} else {\n  matId = _this.QueryID(ID_MATERIAL, '5/8 Plywood');\n}\n\n_this.SetParameter('MATID', matId);\n```\n\n**Additional UCS automation possibilities:**\n- Switch construction methods based on dimensions or cabinet type\n- Add/remove parts based on cabinet width (e.g., add mid-stile above 36\")\n- Change edgebanding based on material selection\n- Auto-add accessories based on cabinet class/type\n- Modify bore spacing based on shelf dimensions\n- Set Pre-Build ON for construction-affecting changes (BKTYPE, ESHAPL, etc.)\n- Use **JavaScript Libraries** for shared logic across multiple UCS (e.g., a \"MaterialRules\" library)\n- Chain UCS via **Catalog Editor Option Effects** — selecting an option triggers specific UCS\n\n**Performance tip (UCS:JS):** Store evaluated values in JS variables instead of re-evaluating parameters:\n```javascript\nvar dy = _this.GetParameterValue('DY');  // Evaluate once\nif (dy < 20) { /* short */ }\nelse if (dy > 50) { /* long */ }\nelse { /* medium */ }\n```\n\n### Issue 3: Database Structure — User-Specific vs. Shareable\n\n**SHARED across all users (in `Common 2024\\`):**\n- `CVData.mdf` — Construction Methods, Materials, Material Schedules, UCS, Intelli-Joints, Object Catalogs, Doors, Parts, CNC data\n- Object Catalogs\n- Door Catalogs\n\n**PER-USER / PER-INSTALLATION (in `CV 2024\\`):**\n- `Report.mdf` — Report Groups, Bid Rate Tables\n- `ManageIT.accdb` — xCRM data\n- `Default.dat` / `DefaultCLST.dat` — Layer Schedules, Dimension Styles\n- `.cfg` files — Job Property Schemes\n- System Parameters (Windows Registry)\n- `Prices.mdf` — Simple Price Table\n\n**PER-JOB:**\n- `BidData.accdb` — Embedded in `.cvj` file\n- All job-level settings (copied from System at creation)\n\n**Implication for EFSJ:**\n- Changing `CVData.mdf` on the network server affects ALL users\n- Each user has their own Report settings, Layer Schedules, and CRM data\n- Job files are independent — changing one job never affects another\n- The \"Common\" directory is the shared namespace; \"CV 2024\" is per-install\n\n### Issue 4: Server/Network Setup for Multi-User Shared Database\n\n**CV supports full multi-user networking with:**\n\n1. **Shared database on server** — `CVData.mdf` in the server's `Common 2024\\Database\\` folder\n2. **Network licensing** — Sentinel RMS License Server manages concurrent seats\n3. **User access control** — Network Administrator utility sets per-user rights (None/View/Edit per area)\n4. **Briefcase for offline** — Disconnect with database copy, sync back on reconnect\n5. **License commuting** — Check out license for up to 30 days of offline work\n6. **Job locking** — Prevents concurrent edits; admin can unlock stuck jobs via Network Administrator Status tab\n\n**Network setup checklist for EFSJ:**\n1. Install CV Network edition on server (installs Sentinel RMS automatically)\n2. Install network license on server via License Manager\n3. Install CV Workstation edition on each designer's PC\n4. Point each workstation to server via License Manager > Search Network > Change Active Server\n5. Create users in Network Administrator with appropriate rights\n6. Match CV usernames to Windows logins for auto-login\n7. Set up License Profiles for different user roles (e.g., \"Designer\" profile vs \"CNC Operator\" profile)\n8. Consider Briefcase for designers who work from job sites\n9. Use \"Lockout All Users\" during maintenance/updates\n\n**Key network behaviors:**\n- When one user changes materials/construction methods in CVData.mdf, ALL users see the change\n- Jobs on shared network paths show lock status — admin can force-unlock via Network Administrator\n- Briefcase mode creates a LOCAL copy of the database — changes sync back on reconnect\n- License Profiles let different workstations pre-select different module combinations\n\n---\n\n*Source: Cabinet Vision 2024 Help System — extracted 2026-04-14*\n"}, {"id": "bruce-chezem-session", "file": "SESSION_2026-04-14_Bruce_Chezem.md", "title": "Bruce Chezem Session", "blurb": "Consultant session notes — decisions, EFSJ issues, recommendations", "md": "# Cabinet Vision Session — Bruce Chezem (Craftsman Engineering)\n## April 14, 2026 | 2 hours | Zoom\n\n### Attendees\n- Eddie San Juan (Operations Manager)\n- Gabe Mitchell (CV Programmer)\n- Cody Watford (CV/CNC Programmer)\n- Kevin Snyder (IT)\n- Bruce Chezem (Craftsman Engineering — consultant)\n\n### Consultant Profile\n- **Bruce Chezem** — Craftsman Woodworks Engineering Services (founded 2018)\n- Career: software engineering + cabinet manufacturing\n- Creates \"A Cabinet Vision Minute\" video tutorials\n- Consulting for complex CV installations + drawing services\n- Patreon has door setup tutorial series\n- Calendly-based scheduling, charges by session\n- CV Sales Rep: **Greg Donaldson** (helpful for training referrals)\n\n### Current EFSJ CV Setup\n- **Version**: 2024.1 (planning upgrade to 2025.4)\n- **Licenses**: 6 total, 4 with CNC programming capability\n- **Current setup**: Standalone workstations (NOT networked)\n- **CNC**: Onsrud 148HD router + Mastercam\n- **Construction**: Custom double face frame flush inset (NOT Eurobox)\n- **Materials**: 1/2\" ply sides/back, 3/4\" shelves, 7/8\" face frames\n- **Files**: CVJ files on SharePoint with standardized naming\n- **Estimating**: Rate table approach (10-25% of traditional drawing-based time)\n\n### Key Decisions Made\n1. **Move to networked server** — shared CV database, VPN for remote users\n2. **Upgrade to CV 2025.4** — test on Becky's machine while she's out\n3. **Cloud hosting NOT supported** by CV — must be traditional server + VPN\n4. **Follow Hexagon's official server installation PDF exactly** — don't freelance\n\n### Issues Discussed & Status\n\n| Issue | Status | Solution/Next Step |\n|-------|--------|-------------------|\n| Server/network setup | PRIORITY #1 | Gabe downloads 2025.4, follows Hexagon PDF, Cody leads install |\n| 6th face misalignment | Needs testing | Rotate 6th Face Trim setting + hands-on test session |\n| Dado gaps | Answer found | Standard #10 + measure real ply thickness with calipers |\n| Double face frame | Discussed | Save nested cabinets to library for reuse; dedicated method possible |\n| Door catalog | Blocked on Brian Klein | Brian needs to prioritize drawing profiles |\n| Finishes | Answer found | Use Material Schedule Names, not Finish objects |\n| Overlay changes | Answer found | Overlay is hinge property, not door property |\n| Settings sync | Answer found | Setup Package with \"All Matches - Overwrite\", exclude Object Catalogs |\n| Reports/assembly sheets | Discussed | CAD Automatic Text, Setup Reports copy/rename, loose parts report groups |\n| Toe kick / EZ Level | Answer found | Standard #481 \"Both\" option + Leg Leveler material type |\n| Auto 10' ply | Requires UCS | Conditional logic + multiple Material Schedules — future session |\n| Parts list clutter | Discussed | \"Send loose reports\" group; Bruce to demo next session |\n\n### Bruce's Recommendations\n- Measure plywood with calipers, enter real thickness in Material Manager\n- Test one change at a time for CNC settings\n- Use Onsrud's engineering techs for machine-side calibration\n- Disable radial menus in Preferences to restore classic menus (Gabe should try)\n- Tool diameter and length mostly stable with fresh bits — focus on material data\n- Centerline vs offset tool compensation — offset preferred for EFSJ use case\n\n### Knowledge Base Built (same session)\nExtracted entire CV 2024 help system (2,721 HTML files) into 5 structured reference documents:\n- `KB_CONSTRUCTION.md` — 18 sections\n- `KB_DOORS_FINISHES.md` — 21 sections\n- `KB_REPORTS_DRAWINGS.md` — 11 sections\n- `KB_CNC_S2M.md` — 22 sections\n- `KB_SYSTEM_DATABASE.md` — 19 sections\n\n### Next Session Focus\n1. Network installation verification\n2. 6th face hands-on testing\n3. Door catalog / profile setup training\n4. Report group customization (loose parts)\n5. Double face frame efficiency\n"}]};

</script>
<script>
const DOCS = window.KB.files;
const main = document.getElementById('main');
const side = document.getElementById('side');
const qEl = document.getElementById('q');

/* ---- helpers ---- */
function slug(s){return s.toLowerCase().replace(/[`*_#]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---- parse sections for search + issues ---- */
const SECTIONS=[]; const ISSUES=[];
DOCS.forEach((d,di)=>{
  d.num = di+1;
  const lines=d.md.split('\n');
  let cur=null, inIssues=false, issueBuf=null;
  const push=()=>{ if(cur){cur.text=cur.body.join(' ').replace(/[#*`>|-]/g,' ').replace(/\s+/g,' ').trim(); SECTIONS.push(cur);} };
  for(const ln of lines){
    const m=ln.match(/^(#{1,4})\s+(.*)/);
    if(m){
      push();
      const level=m[1].length, heading=m[2].trim();
      cur={docId:d.id,docNum:d.num,docTitle:d.title,level,heading,slug:slug(heading),body:[]};
      // EFSJ issue detection
      if(/EFSJ Issue Mapping/i.test(heading)) inIssues=true;
      else if(level===2) inIssues=false;
      if(inIssues && level===3){
        if(issueBuf) ISSUES.push(issueBuf);
        const p0=/CRITICAL|P0|6th Face|misalign/i.test(heading);
        issueBuf={docId:d.id,docNum:d.num,docTitle:d.title,heading,slug:slug(heading),p0,body:[]};
      } else if(inIssues && level===2 && issueBuf){ ISSUES.push(issueBuf); issueBuf=null; }
    } else if(cur){
      cur.body.push(ln);
      if(issueBuf) issueBuf.body.push(ln);
    }
  }
  push(); if(issueBuf) ISSUES.push(issueBuf);
});
ISSUES.forEach(it=>{
  const txt=it.body.join(' ').replace(/\*\*/g,'').replace(/[#`>]/g,'').replace(/\s+/g,' ').trim();
  it.excerpt=txt.slice(0,180);
});

/* ---- sidebar ---- */
function buildSide(){
  let h=`<h3>Start Here</h3>
   <div class="navlink" data-home="1"><span class="n">◆</span><span>Home &amp; Common Fixes</span></div>
   <div class="divider"></div><h3>Knowledge Base</h3>`;
  DOCS.forEach(d=>{ h+=`<div class="navlink" data-doc="${d.id}"><span class="n">${String(d.num).padStart(2,'0')}</span><span>${d.title}</span></div>`; });
  h+=`<div class="divider"></div>
   <div class="navlink" data-home="1" style="color:var(--muted);font-size:13px"><span class="n">↺</span><span>${DOCS.length} guides · ${ISSUES.length} known fixes</span></div>`;
  side.innerHTML=h;
  side.querySelectorAll('[data-doc]').forEach(e=>e.onclick=()=>{openDoc(e.dataset.doc);closeSide();});
  side.querySelectorAll('[data-home]').forEach(e=>e.onclick=()=>{home();closeSide();});
}
function setActive(id){side.querySelectorAll('.navlink').forEach(e=>e.classList.toggle('active',e.dataset.doc===id));}

/* ---- home ---- */
function home(){
  qEl.value='';
  setActive(null);
  let h=`<div class="hero">
    <div class="eyebrow">Cabinet Vision 2024 · Shop Reference</div>
    <h2>Answers for the CV questions that slow you down.</h2>
    <p>Built from the full Cabinet Vision help system plus the Bruce Chezem consultant session. Search it, or jump straight to a <em>known EFSJ fix</em> below — each one names the exact setting and menu path.</p>
  </div>`;
  h+=`<div class="sec-label"><h3>Common EFSJ Fixes</h3><div class="line"></div><span class="cnt">${ISSUES.length} mapped</span></div><div class="cards" id="ic">`;
  ISSUES.forEach((it,i)=>{
    h+=`<div class="icard ${it.p0?'p0':''}" data-issue="${i}">
      <span class="tag">${it.p0?'⚠ Production P0':'Fix'}</span>
      <h4>${esc(it.heading.replace(/^(Issue \d+:|CRITICAL:)\s*/i,''))}</h4>
      <div class="ex">${esc(it.excerpt)}…</div>
      <div class="src">${String(it.docNum).padStart(2,'0')} · ${esc(it.docTitle)}</div>
    </div>`;
  });
  h+=`</div>`;
  h+=`<div class="sec-label"><h3>Browse the Knowledge Base</h3><div class="line"></div><span class="cnt">${DOCS.length} guides</span></div><div class="cards">`;
  DOCS.forEach(d=>{
    h+=`<div class="dcard" data-doc="${d.id}"><div class="h"><span class="n">${String(d.num).padStart(2,'0')}</span><h4>${esc(d.title)}</h4></div><p>${esc(d.blurb)}</p></div>`;
  });
  h+=`</div>`;
  main.innerHTML=h;
  main.querySelectorAll('[data-doc]').forEach(e=>e.onclick=()=>openDoc(e.dataset.doc));
  main.querySelectorAll('[data-issue]').forEach(e=>e.onclick=()=>{const it=ISSUES[e.dataset.issue];openDoc(it.docId,it.slug,it.heading);});
  window.scrollTo(0,0);
}

/* ---- doc reader ---- */
function openDoc(id,anchorSlug,anchorHeading){
  const d=DOCS.find(x=>x.id===id); if(!d)return;
  setActive(id);
  const body=marked.parse(d.md);
  main.innerHTML=`<div class="crumbs"><a id="crumbhome">Home</a> / ${esc(d.title)}</div>
    <div class="doc-head"><span class="n">${String(d.num).padStart(2,'0')}</span><div><h2>${esc(d.title)}</h2><div class="blurb">${esc(d.blurb)}</div></div></div>
    <div class="article" id="art">${body}</div>`;
  document.getElementById('crumbhome').onclick=home;
  const art=document.getElementById('art');
  art.querySelectorAll('h1,h2,h3,h4').forEach(hEl=>{ if(!hEl.id) hEl.id=slug(hEl.textContent); });
  window.scrollTo(0,0);
  if(anchorSlug||anchorHeading){
    setTimeout(()=>{
      let t=anchorSlug?art.querySelector('#'+CSS.escape(anchorSlug)):null;
      if(!t&&anchorHeading){t=[...art.querySelectorAll('h2,h3,h4')].find(x=>x.textContent.trim()===anchorHeading.trim());}
      if(t){t.scrollIntoView({behavior:'smooth',block:'start'});t.classList.add('flash');}
    },60);
  }
}

/* ---- search ---- */
function tokenize(s){return s.toLowerCase().split(/\s+/).filter(Boolean);}
function search(q){
  const toks=tokenize(q); if(!toks.length){home();return;}
  const res=[];
  for(const s of SECTIONS){
    const hay=(s.heading+' '+s.text).toLowerCase();
    if(!toks.every(t=>hay.includes(t)))continue;
    let score=0;
    for(const t of toks){ if(s.heading.toLowerCase().includes(t))score+=10; score+=(hay.split(t).length-1); }
    if(s.level<=2)score+=3;
    res.push({s,score});
  }
  res.sort((a,b)=>b.score-a.score);
  renderResults(q,res.slice(0,40));
}
function snippet(text,toks){
  const low=text.toLowerCase(); let idx=-1;
  for(const t of toks){const i=low.indexOf(t);if(i>=0&&(idx<0||i<idx))idx=i;}
  if(idx<0)idx=0;
  let start=Math.max(0,idx-70);
  let out=(start>0?'…':'')+text.slice(start,start+220)+'…';
  out=esc(out);
  toks.forEach(t=>{ out=out.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<span class="hl">$1</span>'); });
  return out;
}
function renderResults(q,res){
  setActive(null);
  const toks=tokenize(q);
  if(!res.length){ main.innerHTML=`<div class="empty"><div class="big">🪚</div><p>No matches for <strong>${esc(q)}</strong>.</p><p style="font-size:13px">Try fewer or different words — e.g. “dado”, “overlay”, “tool”, “title block”.</p></div>`; return; }
  let h=`<div class="rcount">${res.length} result${res.length>1?'s':''} for “${esc(q)}”</div><div class="results">`;
  res.forEach(({s})=>{
    h+=`<div class="ritem" data-doc="${s.docId}" data-slug="${s.slug}" data-head="${esc(s.heading).replace(/"/g,'&quot;')}">
      <div class="rt">${String(s.docNum).padStart(2,'0')} · ${esc(s.docTitle)}</div>
      <h4>${esc(s.heading)}</h4>
      <div class="snip">${snippet(s.text,toks)}</div>
    </div>`;
  });
  h+=`</div>`;
  main.innerHTML=h;
  main.querySelectorAll('.ritem').forEach(e=>e.onclick=()=>openDoc(e.dataset.doc,e.dataset.slug,e.dataset.head));
  window.scrollTo(0,0);
}

/* ---- events ---- */
let t=null;
qEl.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>search(qEl.value.trim()),140);});
qEl.addEventListener('keydown',e=>{if(e.key==='Escape'){qEl.value='';home();qEl.blur();}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==qEl){e.preventDefault();qEl.focus();}});
document.getElementById('brand').onclick=home;
const sideEl=document.getElementById('side'),scrim=document.getElementById('scrim'),menubtn=document.getElementById('menubtn');
function openSide(){sideEl.classList.add('open');scrim.classList.add('show');}
function closeSide(){sideEl.classList.remove('open');scrim.classList.remove('show');}
menubtn.onclick=openSide;scrim.onclick=closeSide;
const bt=document.getElementById('backtop');
window.addEventListener('scroll',()=>bt.classList.toggle('show',scrollY>500));
bt.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.getElementById('foot').innerHTML=`Cabinet Vision Field Guide · internal EFSJ reference · built from CV 2024 help + Bruce Chezem session · not affiliated with Hexagon/Cabinet Vision`;

buildSide();
home();
</script>
</body>
