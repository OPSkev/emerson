Birch Band\").\n\n### Applied Molding Parts\n\nAssigning an Applied Molding Material to the Applied Inside or Applied Outside Edge Molding parts will add that molding to the door. The positional Offset is controlled in the associated Door Profile.\n\n### Part Mapping\n\nThe Material Schedule maps specific materials to door parts. The key door parts you assign materials to include:\n\n- Stile Material\n- Rail Material\n- Raised Panel Material\n- Flat Panel Material\n- Glass Panel Material\n- Slab Material\n- H Slat / V Slat Material\n- Door Edge Banding Material\n- Applied Inside/Outside Edge Molding\n\nEach part inherits from its parent category unless overridden (indicated by different icons in the Parts List).\n\n---\n\n## 12. Cabinet-Level Door Selection (Job Properties)\n\n**Path:** Job Properties > Cabinet > Doors Tab\n\nThis is where you select Door Style, Material Schedule, and Profiles for your cabinets.\n\n### Hierarchy\n\nThe **All** branch sets the default for ALL doors. You can then override at specific levels:\n\n- **All** -- General default (most important; set this first)\n  - **Upper** -- Override for upper cabinet doors\n  - **Base** -- Override for base cabinet doors\n  - **Tall** -- Override for tall cabinet doors\n  - **Drawer Front** -- Override for drawer fronts\n  - **Base EP** (End Panel) -- Style used IF panelized ends are selected\n  - **Upper EP**\n  - **Tall EP**\n\nOverrides display in **italics** to visually distinguish them from the \"All\" default.\n\n### Settings Per Branch\n\n- Door Style\n- Material Schedule\n- Inside Edge Profile\n- Outside Edge Profile\n- Raised Panel Profile\n\n### End Panel Note\n\nSelecting a Door Style for Base EP, Upper EP, or Tall EP does NOT automatically apply panelized ends. It only determines WHICH door style is used IF panelized ends are enabled in the Assembly's Finished End settings.\n\n### Remove Overrides\n\nA \"Remove Overrides\" button clears all sub-item overrides, reverting everything to the \"All\" setting.\n\n### Texturize Preview\n\nDisplays the selected Material's Texture on the corresponding Door Style image in the Preview Pane.\n\n### Grain Match\n\nEnable to turn on grain matching for Doors and/or End Panels:\n- **Assembly** -- Matches grain of Doors and Drawers within each assembly\n- **Auto-Group** -- Attempts to automatically group assemblies together for grain matching across multiple assemblies\n\n---\n\n## 13. Drawer Fronts\n\n**CV treats Doors and Drawer Fronts identically.** Any Door can be used as a Drawer Front.\n\nKey points:\n- Drawer Fronts are created the same way as Doors\n- The \"Door or Drawer Front\" selection during creation only sets a realistic initial sample size\n- Some doors may give an error \"Unable to build Drawer Front at Requested Size\" -- this means the Top/Bottom Rails and Panel detail don't fit in the requested drawer front height\n- Drawer Fronts adopt the same Overlay as the Door (for Face Frame construction)\n- In Job Properties, Drawer Fronts have their own override branch under the Doors tab\n\n---\n\n## 14. Finishes System\n\n**Path:** Material Manager > Ribbonbar > Finish\n\nFinishes are color definitions used for visual rendering of materials and assemblies.\n\n### Finish Properties\n\n| Property | Description |\n|----------|-------------|\n| Name | Finish name |\n| Description | Finish description |\n| Color Picker | Visual palette to select starting color |\n| Red | Red tone value (0-255) |\n| Green | Green tone value (0-255) |\n| Blue | Blue tone value (0-255) |\n| Luminance | Light/dark adjustment |\n\n### Operations\n\n- **New** -- Create new Finish\n- **Copy** -- Duplicate existing Finish\n- **Delete** -- Remove Finish\n- **Search** -- Find specific Finish\n- **Finish Selector** -- Browse existing Finishes\n\n### How Finishes Work\n\nFinishes define a color (via RGB values and luminance). They are applied to Materials in the Material Manager. The combination of Finish + Texture + Finish Type determines how a material appears in rendered views.\n\nFinishes are NOT free-text fields -- they are structured objects with specific RGB color values and must be created in the Finish utility before they can be assigned.\n\n---\n\n## 15. Finish Types (Rendering Properties)\n\n**Path:** Material Manager > Ribbonbar > Finish Type\n\nFinish Types define how a material interacts with light in rendered views.\n\n### Properties\n\n| Property | Description |\n|----------|-------------|\n| Name | Finish Type name |\n| Description | Description |\n| ID | Database ID |\n| Shader | Simulation type: Glass, Gloss Metal, Gloss Plastic, Metal, Mirror, Plastic, Wood |\n| Ambient | Base color intensity (~50% typical). Defines ambient light's effect on material. Higher values help define folds and creases |\n| Diffuse | Shiny vs matte. >50% = shinier, <50% = more matte. How light reflects broadly from the surface |\n| Specular | Mirror-like reflection proportion. Glossy paint = high specular, matte paint = low specular |\n| Shininess | Surface smoothness/reflectivity. Higher = more reflective |\n| Transparency | How much texture shows through. Full right = tint (good for glass, too transparent for stain). Must be tuned to get realistic stain-on-wood appearance |\n\n### Preview\n\nThe Preview area lets you test the Finish Type with different Finishes, Textures, Light Types, and Brightness settings before applying.\n\n---\n\n## 16. Textures\n\n**Path:** Material Manager > Ribbonbar > Texture\n\nTextures are image patterns (wood grain, marble, etc.) applied to materials for realistic rendering.\n\n### Texture Properties\n\n| Property | Description |\n|----------|-------------|\n| ID | Database ID (not editable) |\n| Name | Texture name (editable) |\n| Description | Description (editable) |\n| Path | File path to texture image (not editable) |\n| World Width | Width the image represents in real-world dimensions |\n| World Height | Height the image represents in real-world dimensions |\n| Decal | If enabled, Finish color will NOT blend with the Texture (stands alone) |\n| Tile | If enabled, pattern repeats across the surface at the specified World Width/Height |\n\n### Creating Custom Textures\n\n1. Create or obtain an image (recommended: 200x200 pixels for patterns)\n2. Save as BMP or JPG to a location OUTSIDE the CV textures folder\n3. In the Texture utility, select the target category\n4. Click Import Image and browse to the file\n5. Set World Width/Height (start with 12x12, adjust after preview)\n6. Enable **Tile** for repeating patterns\n7. Enable **Decal** if the texture should NOT be tinted by the Room Finish\n\n### Texture + Finish Interaction\n\n- Textures are typically black and white, receiving color from the Finish at Room Level\n- A Texture CAN contain its own color (e.g., scanned marble)\n- The Finish's Transparency setting controls how much the texture shows through\n- \"Automatic\" Finish/Texture settings on Materials means they inherit from Room-level Finish settings\n\n---\n\n## 17. Room Finishes (Job Level)\n\n**Path:** Job Properties > Room > Finishes\n\nSelects the Finish and/or Texture for the Interior and Exterior of assemblies.\n\n**This is for VISUAL RENDERING PURPOSES ONLY.** These settings do not affect parts lists, CNC programming, or reports.\n\nThese settings work in conjunction with the \"Automatic\" setting on Material Finishes and Textures in the Material Manager. When a material's Finish is set to \"Automatic,\" it inherits the Room-level Finish.\n\n---\n\n## 18. Material Manager and Materials\n\n### Overview\n\nThe Material Manager is the master list of ALL materials that could be used in a CV Job.\n\n**Critical rules:**\n- ALL materials MUST be listed in Material Manager BEFORE they are available in a Job\n- No limit on number of materials (limited only by hard drive)\n- Every sheet good or board good MUST have a valid THICKNESS -- this is the most important material property\n- Do NOT use quotation marks (`\"`) or pound signs (`#`) in material names (causes errors in S2M Center)\n\n### Material Types Relevant to Doors\n\n#### Board Stock\n- For solid lumber (stiles, rails, raised panels)\n- Key properties: Thickness (finished), Rough Thickness (for board foot calculations)\n- Unit of Issue: can be BD FT (board feet) or sheet size\n- CNC properties: Optimize, Grain Dependent, Feed Rate %, Spindle Speed %, Minimize Face/Back Chip, Climb Cut, Max Depth Per Pass\n\n#### Panel Stock\n- For plywood and sheet goods (flat panels, slab doors)\n- Key properties: Width, Length, Thickness\n- CNC properties same as Board Stock\n\n#### Laminate\n- For laminate-wrapped doors\n- Key properties: Width, Length, Thickness, Oversize (trim allowance added to all edges)\n- Example: 1\" oversize on a 12\" x 29-1/4\" part = 14\" x 31-1/4\" laminate piece\n\n### Material Finish and Texture Assignment\n\nEach material in the Material Manager has Finish and Texture assignments:\n- **Specific Finish/Texture** -- uses the assigned Finish/Texture regardless of Room settings\n- **Automatic** -- inherits from Room-level Finish/Texture settings\n\n---\n\n## 19. Door Matrix Pricing\n\n**Purpose:** Size-based pricing for purchased doors (developed for UK/Australia, available globally).\n\n### Enabling\n\nAdd `MatrixPricing=1` to the Windows Registry at: `Cabinet Vision\\Solid_10_0\\Catalogs\\Door` branch.\n\n**WARNING:** Only edit the Registry if experienced. Always back up first.\n\n### How It Works\n\n1. **Build a Size Matrix** -- Define width columns and height rows with breakpoints (e.g., 15, 20, 25, 30, 35 for widths; 10, 20, 30, 40, 50 for heights)\n2. Each cell gets a size code (A, B, C, etc.)\n3. A door's size determines which cell it falls into (always rounds UP to the next breakpoint)\n4. **Set Prices per Material** -- Each size code gets a price that varies by material (e.g., Size F = $34 for Oak, $47 for Maple)\n5. Multiple Size Matrices can be created for different door manufacturers\n6. At the Door Material tab, select which Matrix price to use\n\n### Pricing Interaction\n\nMatrix pricing is ADDITIVE. If you have $/door or $/SqFt pricing elsewhere, it will be added ON TOP of the Matrix Price. Shops using Matrix pricing typically use ONLY the Matrix and zero out other pricing.\n\n---\n\n## 20. Sample Door Recipes\n\n### Square Raised Panel (Cope & Stick)\n1. Category: Raised Panel | Type: Multi Piece | Panel: Raised\n2. Prerequisite: Inside Edge Profile matching your door cutters\n\n### Square Flat Panel\n1. Category: Flat Panel | Type: Multi Piece | Panel: Flat\n2. Prerequisite: Inside Edge Profile matching your door cutters\n\n### Arched Raised Panel\n1. Category: Raised Panel | Type: Multi Piece | Panel: Raised\n2. After creation: Door Properties > Section > click Top Rail > set width for arch\n3. Right-click Top Rail > Arch or Edit Shape\n4. Check Part List to verify part sizes\n\n### Arched Flat Panel\n1. Category: Flat Panel | Type: Multi Piece | Panel: Flat\n2. Same arch process as Arched Raised Panel\n\n### Double Arched (Raised or Flat)\nSame as Arched but also shape the Bottom Rail (requires Mirror Top Shape in some template configurations).\n\n### Solid Wood Door\n1. Category: Slab | Type: Multi Piece | Panel: Raised\n2. Set Panel Inset to 0\n3. Set ALL Stile and Rail Widths to 0\n4. Use a Material Schedule where the Raised Panel part uses board stock\n\n### Plywood Door\n1. Category: Slab | Type: Slab\n2. Use a Material Schedule where the Slab part uses properly configured plywood material\n\n### Laminate Door\n1. Category: Slab | Type: Slab\n2. Use a Material Schedule where the Slab part uses properly configured laminate material\n\n### Glass Door\n1. Build like any multi-piece door but select **Glass** as the Panel Type\n2. Consider using thinner (narrower) Mid Rails/Stiles for glass doors\n3. Adjust Catalog Properties defaults before creating if needed\n\n### Double Panel Door\n1. Create any frame and panel door\n2. In the Section Editor, use Vertical Split or Horizontal Split to add a mid stile/rail\n\n### Multiple Panel Door\n1. Select the panel in the Section Editor\n2. Use Horizontal Multi Split or Vertical Multi Split\n3. Enter the number of equal panels needed\n\n### Frame and Panel (Butt Joint)\nSame as any multi-piece door but do NOT use an Inside Edge Profile.\n\n### Frame and Panel (Mortise & Tenon)\n1. Go to Catalog Properties and set Joint Adjustment to the mortise/tenon depth\n2. Create the multi-piece door normally\n3. Go back to Catalog Properties and set Joint Adjustment back to 0\n4. Do NOT use an Inside Edge Profile\n\n### Door with Finger Pull\n1. Type: Slab\n2. After creation: Door Properties > Edge Profiles > set Top to \"Finger Pull\" (for base doors)\n3. For upper doors: set Bottom to \"Finger Pull\"\n4. Must have Finger Pull Material defined in Material Manager and assigned in Pull Material Schedule\n\n### Solid Wood Door with Top/Bottom Braces\n1. Follow Solid Wood Door steps\n2. At step 8 (where you'd set Rail widths to 0), instead set Rails to the brace width needed\n\n---\n\n## 21. EFSJ Issue Mapping\n\n### Issue 1: Door Catalog -- Profiles and Center Panels for Accurate Parts List and CNC\n\n**Root Cause:** The Inside Edge Profile (IEP) is the critical link between the door design and accurate part sizing. If the IEP does not match the actual door cutter depth, the parts list will be wrong.\n\n**Exact Settings to Check:**\n\n1. **Material Manager > Ribbonbar > Profile** (or via Door Properties > Profile Filter)\n   - Verify each Inside Edge Profile has a width/depth matching your actual cope & stick cutters\n   - The **Applied** (or \"Extend Part\") property on the IEP controls whether it adds to stile/rail width\n\n2. **Door Manager > Select Door > Properties > Section** (Section Editor)\n   - Click each Stile and Rail to verify Width + Extra = correct finished width\n   - Width represents the stile/rail without the IEP; Extra is the IEP contribution\n   - For cope & stick: Frame Width = Finished Width - IEP Depth\n   - For Mid Stiles/Rails: Width = Finished Width - (2 x IEP Depth) since IEP applies on both sides\n\n3. **Door Manager > Select Door > Properties > Section > Part List**\n   - This is the verification tool. Select your Inside Edge Profile, enter a test door size, click Apply\n   - Compare output to what you would actually cut on the shop floor\n\n4. **Panel Configuration**\n   - Panel Type must be set correctly (Raised, Flat, Glass, Slab) to map to the right material in the Material Schedule\n   - Panel Inset must match your actual groove depth\n   - If panels are not appearing in the parts list, verify the Panel Type is not set to \"None\"\n\n5. **For CNC Programming of Panels**\n   - The panel type and material assignment determines whether the panel is sent to S2M Center for nesting/CNC\n   - Ensure the material assigned to the panel has correct CNC properties (Optimize, Grain Dependent, etc.)\n   - Slab and Flat panels using Panel Stock materials with Optimize enabled will be included in CNC nesting\n\n**Summary:** Parts list accuracy = correct IEP width + correct stile/rail dimensions + correct panel type + correct panel inset. CNC inclusion = correct material type with Optimize enabled.\n\n---\n\n### Issue 2: Finishes -- Free-Text Names vs. Finish Objects; Getting Finish on Reports\n\n**The Problem:** CV's Finish system is designed for RENDERING, not for production text output. Finishes are structured objects (RGB color + luminance + Finish Type shader) created in the Material Manager. They are NOT free-text fields.\n\n**Can you use free-text finish names instead of creating finish objects?**\n\n**No, not directly as \"Finishes.\"** However, there are workarounds:\n\n1. **Material Schedule Name as Finish Proxy**\n   - Name your Material Schedules descriptively: \"Cherry - Natural Stain\", \"Maple - White Paint\", etc.\n   - The Material Schedule Name appears on reports/assembly sheets\n   - This is the simplest way to get finish text on output without using the rendering Finish system\n\n2. **Material Name/Description**\n   - Material Names appear on cut lists and reports\n   - Use descriptive names that include finish info: \"Cherry 4/4 - Stain Grade\"\n\n3. **Finish Objects (for rendering)**\n   - Must be created in Material Manager > Finish with Name, RGB values, Luminance\n   - These are visual rendering tools, NOT text labels\n   - Finish names DO appear in some report fields but are primarily designed for rendering\n\n4. **Room Finishes (Job Properties > Room > Finishes)**\n   - \"For visual rendering purposes only\"\n   - Selects Finish/Texture for Interior and Exterior of assemblies\n   - Works with \"Automatic\" setting on material Finish/Texture\n\n**Getting finish text on ALL reports/assembly sheets:**\n\n- The most reliable approach is to encode finish information in the **Material Schedule Name** and/or **Material Name**\n- These fields are consistently available across reports, assembly sheets, and cut lists\n- The formal Finish system is rendering-focused and its text output is inconsistent across different report types\n- User Created Standards (UCS) can reference Material Schedule properties to pull finish info into custom reports\n\n**Bottom line:** For production environments that need finish TEXT (not rendered color), use Material Schedule names as the carrier. The formal Finish system is a rendering tool, not a production documentation tool.\n\n---\n\n### Issue 3: Door Overlay Changes When Modifying Doors/Drawer Fronts\n\n**Root Cause:** Overlay is NOT a property of the door. It is controlled by the CONSTRUCTION STYLE of the assembly.\n\n**For Face Frame Cabinets:**\n- Overlay is a property of the **HINGE** (Material Manager > Hinge tab)\n- Changing the door style does NOT change overlay\n- Changing the hinge WILL change overlay (and therefore door size)\n- Formula: Door Size = Clear Opening + Overlay\n- Drawer Fronts inherit the Door's overlay value\n\n**For Frameless/32mm/Frame Overlay:**\n- Overlay is NOT used at all\n- Door size is controlled by **REVEALS** (Assembly Wizard > Exterior Case > Reveals)\n- Formula: Door Size = Overall Assembly Dimension - Reveals\n- Changing reveals changes door size\n\n**Why overlays might APPEAR to change when modifying doors:**\n\n1. **Changing Construction Style** -- Switching between Face Frame and Frameless construction styles fundamentally changes how doors are sized. Overlay applies to Face Frame; Reveals apply to Frameless.\n\n2. **Changing Hinges** -- If a door change also triggers a hinge change (e.g., via Material Schedule association or construction method change), the overlay value changes because it lives on the hinge.\n\n3. **Assembly Wizard settings** -- If you modify the Assembly (construction method) rather than just the door, reveal values may change.\n\n**Settings That Lock Overlays:**\n\n- **Hinge Overlay** -- Material Manager > select Hinge material > Hinge tab > Overlay value. This is the master control for Face Frame overlay. Set it once, don't change the hinge, and the overlay stays fixed.\n\n- **Assembly Reveals** -- Assembly Manager > Assembly > Exterior Case > Reveals. For frameless construction, these values directly control door sizing. Set them and they stay unless the Assembly is changed.\n\n- **Job Properties > Doors Tab** -- Selecting a door here does NOT change overlay. Only the door style, material, and profiles are set here.\n\n**The fix:** If overlay is unexpectedly changing, check what ELSE changed -- specifically the Hinge assignment and/or the Construction Style. The door itself does not carry overlay information.\n\n---\n\n## Quick Reference: Where Things Live\n\n| What | Where |\n|------|-------|\n| Door construction (stiles, rails, panels) | Door Manager > Section Editor |\n| Door-to-material mapping | Material Schedule Manager > Doors |\n| All raw materials | Material Manager |\n| Overlay (Face Frame) | Material Manager > Hinge > Overlay property |\n| Reveals (Frameless) | Assembly Manager > Exterior Case > Reveals |\n| Door selection for a job | Job Properties > Cabinet > Doors tab |\n| Finish colors (rendering) | Material Manager > Finish |\n| Finish behavior (rendering) | Material Manager > Finish Type |\n| Textures (rendering) | Material Manager > Texture |\n| Room-level finish override | Job Properties > Room > Finishes |\n| Inside Edge Profile setup | Material Manager > Profile (or Door > Profile Filter) |\n| Door pricing (catalog) | Door Properties > Unit Cost / Cost per SqFt |\n| Door pricing (matrix) | Registry-enabled, per Material Schedule |\n| Size-based door switching | Door Properties > Associations |\n| Batch material/profile assignment | Door Manager > Utilities tab |\n"}, {"id": "how-to-new-door-style", "file": "KB_HOWTO_NEW_DOOR_STYLE.md", "title": "How-To: New Door Style", "blurb": "Step-by-step: enter a new cope & stick door style — profile (IEP) entry, catalog defaults, section editor width math, material schedule, verify", "md": "# How-To: Enter a New Door Style (Cope & Stick)\n\n> Step-by-step procedure for entering a new door style in Cabinet Vision 2024, including entering the cope & stick profile as a sub-step. Distilled from KB_DOORS_FINISHES §1,3,4,6,8,10,11,20,21 and the Door Profiles help topic (DC_Profiles.htm).\n\n**Golden rule:** Build or confirm the cope & stick profile (Inside Edge Profile) BEFORE creating the door. CV uses the IEP **width** to size stiles and rails. Wrong profile = wrong parts list.\n\n> **The Inside Edge Profile is the STICKING — the cut made into the frame. It is NOT the applied moulding.** An applied moulding is a separate **Applied Inside Edge Profile** stuck on after coping; it does not size parts. Cope & stick is one kind of sticking; **square sticking is another** — both are the IEP. EFSJ prefixes: **SS/OS/OV → Inside Edge Profile; PM/HF/LV → Applied.**\n\n---\n\n## Phase 1 — Enter the Cope & Stick Profile (Inside Edge Profile / IEP)\n\n**Path:** Door Catalog (Door Manager) > Setup menu > Profiles — *or* System Level > Material Manager > Ribbonbar > Profile — *or* Door Properties > Profile Filter. All three open the same door-profile list.\n\n> 🛑 **NOT the standalone \"Profile Manager.\"** That tool makes only **Bead** (beaded inset face frame) and **Top Edging** (countertop edge) profiles — neither sizes a door frame. The two editors look identical (same Insert DXF / Reference / Check ribbon), so watch the title bar: if it says `Edit: 'New Bead'`, back out — you want the Door Catalog profile list, where the profile carries the **Width / Extended** properties that size stiles and rails.\n\nIn CV the \"cope and stick\" profile is the **Inside Edge Profile (IEP)** — listed as *\"Inside Edge Profile (Edge Detail)\"*.\n\n1. Click **New** in the toolbar.\n2. In the **Add New Profile** dialog, select profile type **Inside Edge Profile (Edge Detail)**, then **OK**. It appears in the list as \"New ???????\".\n3. Select it and set the **Properties** on the right:\n   - **Name** — match your real cutter (e.g. \"Ovolo 3/8 C&S\").\n   - **Width** — ⚠️ CRITICAL. Set to your actual cope & stick cutter depth (e.g. 3/8\"). This value is added to stile/rail widths.\n   - **Extended / Extend Part** — MUST be **Yes** for cope & stick. This is what tells CV to add the sticking to the parts. `No` = butt joint, rails won't cope.\n   - **Cost Per Door / Cost Per SqFt** — optional.\n4. Click the **Shape** tab. Draw the profile with the Shape Editor tools — or **Insert DXF** to bring in a knife-catalog profile.\n   - 🩸 **The Reference point is NOT cosmetic — it drives the cope.** CV treats it as the frame's inner-edge line. Click **Reference** and pick the corner where the **inside (grooved) edge meets the door face** — the groove **mouth**. **Do NOT pick the groove root** — put it there and the cope reads as ZERO, rails won't extend even with Width and Extend Part set right. (This cost ~2 hrs on the SS7097 build, 2026-07-13.)\n   - The drawn *shape* is cosmetic (render only); the **depth/Width + reference point + Extend Part** are what size parts.\n5. Return to the **Profiles** tab and click **Yes** to save.\n\n> 🩸 **After Extend Part is on, CV ADDS the sticking depth on top of your base widths.** So set the stile/rail base = **Finished − IEP depth** (2¾ finished, 3/8 IEP → enter **2⅜**). Do it once in Catalog Construction Defaults (Phase 2), not per part. Forget it and every part runs 3/8 fat (2¾ becomes 3⅛). Verify at Part List: rails should be `opening + 3/8 each end`.\n\n*For raised panel doors, also create a **Raised Panel Detail** and an **Outside Edge Profile** the same way — neither affects part sizes.*\n\n## Phase 2 — Set Catalog Construction Defaults (before creating the door)\n\n**Path:** Door Manager > Catalog Properties (applies to NEW doors only)\n\n- Frame Stile Width / Mid Stile Width / Frame Rail Width / Mid Rail Width\n- Panel Type + Panel Inset (match your groove depth)\n- Mitered Frame (if applicable)\n- **Joint Adjustment = 0** for cope & stick. (Only set this for Mortise & Tenon, then reset to 0 afterward.)\n\n## Phase 3 — Create the Door Style\n\n**Path:** System Level > Ribbonbar > Main > Catalogs > Door Manager\n\n1. Select the Category/group where it should live.\n2. Click **New**.\n3. Enter **Name** and **Description**.\n4. Set **Type** to **Multi Piece** (the frame-and-panel / cope & stick type).\n5. Add **Tags** for search.\n6. Choose **Door** or **Drawer Front** (sets sample size only).\n7. Click **Next**.\n8. Set **Panel Type** (Raised / Flat / Glass / None) and **Panel Inset**.\n9. Click **Finish**.\n\n## Phase 4 — Design the Door in the Section Editor\n\n**Path:** Door Manager > select door > Properties > Section\n\n1. Work in **Section View**. Click each **Stile** and **Rail** to set dimensions.\n2. Enter **FINISHED** sizes, not rough-cut (unless a part has an \"Extra\" field for allowance).\n3. ⚠️ Cope & stick width math — the Width you enter is the portion WITHOUT the profile; CV adds the IEP width on top:\n   - **Frame stile/rail:** Width = Finished Width − IEP depth  *(want 2-1/2\" finished with a 3/8\" IEP → enter 2-1/8\")*\n   - **Mid stile/rail:** Width = Finished Width − (2 × IEP depth), because the profile hits both sides  *(2-1/2\" − 3/4\" → enter 1-3/4\")*\n4. Order matters for joinery: parts added first run long (Rails before Stiles = rails run through).\n5. Splits: use **Horizontal/Vertical Split** or **Multi Split** to add mid rails/stiles for multi-panel doors.\n\n## Phase 5 — Assign Material Schedule + Profile Filters\n\n1. **Door Properties > Defaults** — assign the default Material Schedule, Inside Edge Profile (from Phase 1), Outside Edge Profile, Raised Panel Profile.\n2. **Door Properties > Profile Filter** — limit which profiles appear at job selection (Inside Edge, Outside Edge, Raised Panel, Route).\n3. **Door Properties > Material Filter** — (optional) limit species/schedules for this door.\n4. Confirm the Material Schedule maps every part (Stile, Rail, Panel type) to real materials, and set Banding as desired.\n\n## Phase 6 — Verify Before You Trust It\n\n**Path:** Door Properties > Section > Part List\n\n1. Select your Inside Edge Profile.\n2. Enter a **test door size** and click **Apply**.\n3. Compare the output part sizes to what you'd actually cut on the floor. If they're off, the IEP width is wrong — go back to Phase 1.\n4. Confirm the panel appears (Panel Type ≠ \"None\") and Panel Inset matches your groove.\n\n---\n\n## Gotchas\n\n- **Overlay / door size is NOT set here** — it comes from the **hinge** (face frame) or **reveals** (frameless) at the job level. See KB_DOORS_FINISHES §8 and Issue 3.\n- **Butt joint door** = same steps but use NO Inside Edge Profile.\n- **Mortise & Tenon door** = set Joint Adjustment to the M&T depth first, use NO IEP, then reset Joint Adjustment to 0 after creating.\n- **Gap between panel and frame?** First check **Panel Type** matches the assigned profile — a **Flat** panel ignores a Raised Panel Profile and renders recessed (switch Type → Raised). A residual bright/white corner void = the raised-panel bit tongue not aligning with the sticking groove. **That's usually fine:** the panel bit and sticking don't have to be a matched set in CV — EFSJ dials in the tongue/groove fit **at the machine** when running doors, so the render gap is cosmetic. Don't chase it with Panel Inset. For a clean render (shop drawings), use a tongue-shifted panel DXF matched to the sticking groove.\n\n---\n\n## Troubleshooting: panel tongue not seated in the groove (sticking reference point)\n\nIf the panel looks like it's **floating outside the groove** with a gap — and the panel type/inset are right — the cause is usually the **sticking's reference point on the wrong spot.**\n\n**Why:** the panel groove *depth* is set by a number (**Panel Inset**), but the groove you *see* in the render comes from the sticking shape, positioned by its **reference point**. The panel is placed by CV from Panel Inset + the frame. If those two don't share the same datum, the drawn groove and the panel don't line up → gap. (The real cut parts are fine — this is a render-datum mismatch.)\n\n**The reference point must sit where the grooved (inner) edge meets the show face.** Fix:\n\n1. **System Level → Profile Manager** (or Door Catalog → Profiles) → select the sticking (e.g. **SS7097 Sq Sticking**) → **Edit**.\n2. Identify: **inner edge** = the side with the groove notch (faces the panel); **show face** = the long edge with the *wider* solid land (SS7097: 0.376\" face land vs 0.127\" back land).\n3. Target = the **corner where the grooved inner edge meets the show face** (outermost front corner on the grooved side).\n4. Click **Reference** → click that corner → the ⊕ marker jumps there.\n5. **Check** (green) → **Return** to save.\n6. Open the door → **3D** to confirm the tongue now seats in the groove.\n\n**Verify both:** the panel gap should close **and** the Part List rails should still read the coped length (e.g. 19¼ on a 24×30). The inner-edge/face corner is the one point that gives a correct **cope** *and* a **seated panel** — if the rails drop back to the bare opening, you're on the wrong corner (don't leave it on the groove root).\n"}, {"id": "reports-drawings", "file": "KB_REPORTS_DRAWINGS.md", "title": "Reports & Drawings", "blurb": "Report Center, assembly/part sheets, wall elevations, Bid Center, CAD, dimensions & layers", "md": "# Cabinet Vision 2024 -- Reports, Drawings & Output Knowledge Base\n\n> Extracted from the CV 2024 online help (cv-main, cv-cr modules).\n> Covers Report Center, Assembly Sheets, Part Sheets, Wall Elevations, Bid Center, CAD, Dimensions, Layers, and the Custom Reports (xRender) module.\n\n---\n\n## Table of Contents\n\n1. [Report Center](#1-report-center)\n   - 1.1 [Overview](#11-overview)\n   - 1.2 [Report Groups](#12-report-groups)\n   - 1.3 [Setup Reports](#13-setup-reports)\n   - 1.4 [Creating / Copying / Editing Reports](#14-creating--copying--editing-reports)\n   - 1.5 [New Report Advanced Properties](#15-new-report-advanced-properties)\n   - 1.6 [Report Filtering](#16-report-filtering)\n   - 1.7 [Export Report](#17-export-report)\n   - 1.8 [System Report Catalog (Complete List)](#18-system-report-catalog)\n2. [Assembly Sheets](#2-assembly-sheets)\n   - 2.1 [Overview](#21-overview-1)\n   - 2.2 [Layout Sections](#22-layout-sections)\n   - 2.3 [Assembly Sheet Layers](#23-assembly-sheet-layers)\n   - 2.4 [Custom Templates](#24-custom-templates)\n   - 2.5 [Printing Options](#25-printing-options)\n3. [Part Sheets](#3-part-sheets)\n   - 3.1 [Overview](#31-overview-2)\n   - 3.2 [Layout Sections](#32-layout-sections-1)\n   - 3.3 [Printing Options](#33-printing-options-1)\n4. [Wall Elevations / Plan & Elevation Sheets](#4-wall-elevations--plan--elevation-sheets)\n   - 4.1 [Overview](#41-overview-3)\n   - 4.2 [Layout Sections](#42-layout-sections-2)\n   - 4.3 [Layers](#43-layers)\n5. [Bid Center](#5-bid-center)\n   - 5.1 [Overview](#51-overview-4)\n   - 5.2 [View Modes](#52-view-modes)\n   - 5.3 [Rate Tables & Bid Methods](#53-rate-tables--bid-methods)\n   - 5.4 [Options](#54-options)\n   - 5.5 [Add-Ons](#55-add-ons)\n   - 5.6 [Advanced Reports in Bid Center](#56-advanced-reports-in-bid-center)\n6. [CAD Module](#6-cad-module)\n   - 6.1 [Overview](#61-overview-5)\n   - 6.2 [CAD Layers](#62-cad-layers)\n   - 6.3 [CAD Table Tool](#63-cad-table-tool)\n   - 6.4 [Automatic Text (Title Blocks)](#64-automatic-text-title-blocks)\n7. [Dimensions & Layers System](#7-dimensions--layers-system)\n   - 7.1 [Layer Schedules](#71-layer-schedules)\n   - 7.2 [Dimension Styles](#72-dimension-styles)\n   - 7.3 [Dimension Lines (Auto-Dimensions)](#73-dimension-lines-auto-dimensions)\n   - 7.4 [Annotations](#74-annotations)\n   - 7.5 [Shop Annotations](#75-shop-annotations)\n8. [Assembly-Level Orthographic Editing](#8-assembly-level-orthographic-editing)\n9. [xRender Module (cv-cr)](#9-xrender-module-cv-cr)\n10. [Tips & Tricks](#10-tips--tricks)\n    - 10.1 [Adding a List to a Label](#101-adding-a-list-to-a-label)\n11. [EFSJ Issue Mapping](#11-efsj-issue-mapping)\n\n---\n\n## 1. Report Center\n\n### 1.1 Overview\n\n**Path:** Room Level > Sidebar > Reports > Report Center\n\nThe Report Center is where you print job information. Reports are organized into **Report Groups** -- named collections that can be batch-printed with one click. CV ships with sample Report Groups but they need customization. The printer memory feature remembers which printer each individual report last printed to when printing as part of a group.\n\n### 1.2 Report Groups\n\nA Report Group is a named collection of reports. The drop-down lists all available groups; selecting one shows its member reports for preview.\n\n- Select a group from the dropdown\n- Click **Print Reports In Group** to batch-print all reports in that group\n- Each report remembers its last-used printer when printed within a group\n\n### 1.3 Setup Reports\n\n**Path:** Report Center > Sidebar > Setup Reports\n\nThis is where you create and manage Report Groups and assign reports to them.\n\n**Creating a Report Group:**\n1. Click **Setup Reports**\n2. Click **Add** in the sidebar Groups area\n3. Enter a name and click OK\n4. Assign reports to the group by selecting each report and checking the box next to the desired group name\n\n**Report icons:**\n- Green CV icon = Report is assigned to at least one group (active)\n- Gray icon = Report is not assigned to any group (inactive)\n- Reports can belong to multiple groups\n\n**Recommended setup:** Create construction-style-specific groups (e.g., \"Frameless Reports\", \"Face Frame Reports\") so you can batch-print the right set for each job type.\n\n**Right-click options on reports:**\n- **Copy** -- Duplicates the report with a new title/description\n- **Delete** -- Removes user reports only (system reports cannot be deleted)\n- **Edit** -- Opens in Report Designer (system reports are copied first)\n- **Properties** -- Opens Advanced Properties\n\n### 1.4 Creating / Copying / Editing Reports\n\n**Best practice for creating a new report:**\n1. Find an existing report that already has the data you need\n2. **Copy** it (Report Center > Setup Reports > right-click > Copy, or use ribbonbar Copy button)\n3. Edit the **Properties** (datasets) via right-click > Properties\n4. Open in **Report Designer** to modify the layout\n\n**Editing:**\n- Only **User Reports** can be edited directly\n- Attempting to edit a **System Report** automatically creates a copy first\n- The Report Designer has its own help file (separate from main CV help)\n\n**Copying a report:**\n1. In Setup Reports, select the report\n2. Click Copy Report (ribbonbar) or right-click > Copy\n3. Edit the Title in the properties dialog\n4. Click OK -- the copy appears in the report list\n\n### 1.5 New Report Advanced Properties\n\n**Path:** Setup Reports > Ribbonbar > New Report (or right-click > Properties)\n\nThe Advanced Properties dialog has a toolbar and a **Create Table Wizard** with 9 tabs:\n\n**Toolbar Tools:**\n\n1. **Import/Link Data For Report** -- Import tables from external databases (Door.ddb, BidData.mdb, or custom databases)\n   - **Import type**: Creates a new table in report.mdb from an external source\n     - Name: table name in report.mdb (avoid reserved names like \"Parts\"; use only letters and underscores)\n     - Source: path to external database\n     - Table: which table from the source database\n     - Fields: select which fields to import\n   - **Link type**: Creates a SQL view within report.mdb\n     - Name: view name\n     - SQL: valid SQL SELECT statement\n\n2. **Create Table Wizard** -- 9-tab wizard for defining report tables:\n   - **Source tab**: Name, Source database path, Specify Provider (for non-Access databases)\n   - **Select tab**: Choose table, add columns; use Ctrl+Click or Shift+Click for multi-select. When adding multiple tables, define Joins (SQL JOIN types)\n   - **Group tab**: Group Fields checkbox enables SQL GROUP BY with Sum, Average, Min, Max, Count, First, Last operations\n   - **Where tab**: SQL WHERE filtering criteria per column\n   - **Sort tab**: Simple Sort (ascending checkboxes) or full ascending/descending sort per column. **Very important** -- controls data display order\n   - **Filter tab**: Maps columns to CV's built-in filter system\n     - Filter by Cabinet ID Field\n     - Filter by Top ID Field\n     - Filter by Room ID Field\n     - Filter Splash by Part ID Field\n     - Filter By xCRM Account ID Field\n   - **Cabinet (QTY) tab**: Creates cabinet quantity lists like \"1 (2), 2, 3 (2)\". Only available when Group Fields is enabled. Options: Parts, Doors, Drawers, Rollouts, Custom\n   - **Comment List tab**: Creates comment lists for grouped items. Uses variable format like `Cab# {Cabinet} - {Comment}` where curly braces denote field variables\n\n### 1.6 Report Filtering\n\n**Path:** Report Center > Ribbonbar > Filter\n\nFilter controls which objects appear in reports. Can filter by:\n- Room\n- Molding\n- Accessories\n- Cabinets\n- Any combination\n\nUse arrow keys + spacebar for quick toggling. The filter is **stored within the Job** and persists across Report Center and Bid Center sessions. Select All / Select None / Invert Selection buttons available.\n\n### 1.7 Export Report\n\n**Path:** Report Center > Ribbonbar > Export Report\n\nExport the currently active report to external formats. Two categories:\n- **Page-based formats** (preserve layout/formatting): PDF, XHTML/CSS, MHTML, XPS, TIFF, PNG, JPEG, BMP, EMF\n- **Record-based formats** (emphasis on data): Excel XLSX, Word DOCX, RTF, CSV, XML, HTML\n\nFull export format list:\n- Adobe PDF Format\n- XHTML/CSS\n- Multi-Mime HTML Format\n- Microsoft Excel (XLSX)\n- Microsoft Word Format (DOCX)\n- Rich Text Format (RTF)\n- Microsoft XPS Format\n- Multi-Page TIFF Picture\n- TIFF / PNG / JPEG / Bitmap / Metafile (EMF) Pictures\n- HTML / HTML jQuery Mobile Format\n- Text (CSV) Format / Text (Layout) Format\n- XML Format\n- Pinwriter (TTY)\n\nExcel exports can reduce columns/rows with \"Only data from table object(s)\" option. Image exports support auto-cropping.\n\n### 1.8 System Report Catalog\n\nCV ships with a comprehensive library of system reports. Report codes follow a naming convention indicating their category and variant:\n\n**Assembly Sheets:** ASM001, ASM002 -- Cabinet specifications with cut list sorted by length/width\n\n**Cut Lists (by material type):**\n| Category | Code Prefix | Variants |\n|----------|-------------|----------|\n| Banding | CLB | CLB001-CLB010 |\n| Board Stock | CLBS | CLBS01-CLBS10 |\n| Door | CLDO | CLDO01-CLDO12 |\n| Door Panel | CLDP | CLDP01-CLDP11 |\n| Door Stile & Rail | CLDS | CLDS01-CLDS10 |\n| Drawer | CLDR | CLDR01-CLDR11 |\n| Face Frame | CLFF | CLFF01-CLFF09 |\n| Laminate | CLLA | CLLA01-CLLA11 |\n| Miscellaneous | CLMI | CLMI01-CLMI10 |\n| Panel Stock | CLPS | CLPS01-CLPS13 |\n| Roll Out | CLRO | CLRO01-CLRO11 |\n| Standard (all) | CLSC | CLSC01+ |\n| Simple | SIM | SIM001 |\n\n**Common cut list variant suffixes:**\n- Base = no extras\n- \"Displays part operations\" = machining info\n- \"Includes banding code\" = edge banding codes\n- \"Parts sorted by length then width\" = alternate sort\n- \"Prints multiple materials per page\" = condensed layout\n- \"Rips summary in feet/meters\" = linear summary\n- \"Show Buyout Parts\" = includes purchased parts\n- \"Includes composite sub-materials\" = laminate stack details\n\n**Door/Drawer Front Lists:**\n| Category | Code Prefix |\n|----------|-------------|\n| Door List | DL0001-DL0006 |\n| Door List w/ Profiles | DLP001-DLP009 |\n| Door List w/ Notes | DLN001-DLN002 |\n| Door List w/ Opening Locations | DLLOC1 |\n| Door Check List | DCL001-DCL010 |\n| Applied Door & Panelized End List | DLAP01-DLAP05 |\n| Applied Door Check List | DCL005-DCL006 |\n| Drawer Front & False Front List | DLFR01-DLFR04 |\n| Drawer Front w/ Profiles | DLFRP1-DLFRP4 |\n| Drawer Front w/ Notes | DLFRN1 |\n| Drawer Front Check List | DCL007-DCL008 |\n| Single & Pair Door List | DLSP01-DLSP04 |\n| Single & Pair w/ Profiles | DLSPP1-DLSPP4 |\n| Single & Pair w/ Notes | DLSPN1 |\n\n**Other Reports:**\n| Category | Code |\n|----------|------|\n| Cabinet Labels (Avery 5161) | CLAB01-CLAB04 |\n| Cabinet Labels (Avery 4013) | CLAB05-CLAB08 |\n| Cabinet List | CAB001-CAB003 |\n| Composite Materials | COMP01 |\n| Counter Top List | TOPS01 |\n| Door Styles | CATDRS |\n| Drawer List | DRL001-DRL013 |\n| Drawer/Rollout List | DWRO01 |\n| Drawer Check List | DWCH01-DWCH02 |\n| Drawer Guide Mounting Locations | DGL001-DGL002 |\n| Hinge Mounting/Boring Locations | HNGL01 |\n| Intelli-Joint List | IJ0001 |\n| Line Pricing | CATLPR |\n| Material Catalog List | MCL001-MCL002 |\n| Material Summary | MTOT01-MTOT08 |\n| Material Vendor List | MLST01 |\n| Molding Report | MOLD01 |\n| Options | CATOPT |\n| Roll Out Check List | CLIST1 |\n| Roll Out List | ROLL01-ROLL12 |\n| Room List | ROOM01 |\n\n---\n\n## 2. Assembly Sheets\n\n### 2.1 Overview\n\n**Path:** Room Level > Sidebar > Reports > Assembly Sheet\n\nAssembly Sheets are specialized reports designed for assemblers. Each sheet shows one cabinet with:\n- A picture of the assembly\n- Parts list (cut list)\n- Assembly specifications\n- Hardware list\n- Any comments added to the assembly\n\n### 2.2 Layout Sections\n\nThe default CV Assembly Sheet template has four sections:\n\n1. **Cut List Data Table** (Red zone) -- Parts cut list for the assembly, includes hardware and any cabinet comments\n2. **Container** (Green zone) -- Graphic of the primary face view. Shows assembly number, name, size, and quantity at top\n3. **Assembly Properties** (Blue zone) -- General assembly properties. Interior scribe values shown in parentheses\n4. **Information Area** (Magenta zone) -- Job and room information\n\n### 2.3 Assembly Sheet Layers\n\n**Path:** Right-click on open area in Assembly Sheet view > Properties\n\nEditable layers on Assembly Sheets:\n- **Molding** -- Crown, light rail, etc.\n- **Hardware** -- Hinges, pulls, slides\n- **Shop Annotations** -- Opening dimensions, door/drawer sizes, shelf outlines\n- **Annotations** -- End type labels, door/drawer position numbers (column letters A-Z, row numbers)\n- **Dimensions** -- Auto-dimension lines\n\nEach layer has:\n- **Printer icon** -- Toggle visibility on printed page (lit = prints, dark = hidden)\n- **Color block** -- Set display color\n- **Line type selector** -- Choose line style\n- **Edit button** -- Active for Shop Annotations, Annotations, and Dimensions\n\n**Door/Drawer Front Position Labels:** Numbered in columns left-to-right, lettered in rows. Retrievable via `_LABEL` parameter in Object Tree and available in report.mdb at `Doors|Label`.\n\n### 2.4 Custom Templates\n\nCustom Assembly Sheet templates are stored in the **Drawings Library** and can be loaded via the **Change...** button. Requires 2D CAD multiplier.\n\n### 2.5 Printing Options\n\n- **Single assembly**: Select it, click Print or To Drawing\n- **Multiple assemblies**: Ctrl+Click to multi-select, then Print or To Drawing\n- **Entire Job**: Select \"Entire Job\" option\n- **Current Room**: Select \"Current Room\" option\n- **Separate Subassembly**: Print subassembly parts separately\n- **To Drawing**: Sends to the Drawings page (2D CAD multiplier required)\n\n---\n\n## 3. Part Sheets\n\n### 3.1 Overview\n\n**Path:** Room Level > Sidebar > Reports > Part Sheet\n\nPart Sheets are specialized reports for machinists. Each sheet shows:\n- Front and back views of an individual part\n- General part information\n- Machining operations\n\n### 3.2 Layout Sections\n\nThe default Part Sheet template has three sections:\n\n1. **Part Properties** (Blue zone) -- General part properties\n2. **Container** (Green zone) -- Graphic of front and back of the part\n3. **Information Area** (Magenta zone) -- Cabinet/room information\n\n### 3.3 Printing Options\n\nSame selection options as Assembly Sheets, plus:\n- **Separate Subassembly** -- Print parts for subassemblies\n- **Door Parts** -- Print actual door component parts vs. whole door\n- **Machined only** -- Only print parts that have CNC machining operations\n\n**Layer control:** Right-click > Properties to access Part Sheet Layers (same editing as Assembly Sheets -- printer icon, color, line type, Annotations and Dimensions editable).\n\n---\n\n## 4. Wall Elevations / Plan & Elevation Sheets\n\n### 4.1 Overview\n\n**Path:** Room Level > Sidebar > Reports > Wall Elevations\n\nPlan & Elevation Sheets are designed for installers. They show:\n- Wall elevation or floor plan view with dimensions\n- List of assemblies on that wall\n- Job/Room/Wall information\n\nCan print **Plan** views, **Elevation** views, or both. When both selected, Plan prints first followed by Elevation(s) for each room before proceeding to the next room.\n\n### 4.2 Layout Sections\n\nThree sections:\n\n1. **Container** (Red zone) -- Dimensioned elevation or plan view\n2. **Assembly List Data Table** (Blue zone) -- All assemblies on the elevation with properties. Interior scribe values in parentheses\n3. **Information Area** (Magenta zone) -- Job/Room/Elevation information\n\nPlan Sheets are similar but lack the Assembly List.\n\n### 4.3 Layers\n\nSame layer editing as Assembly Sheets (right-click > Properties):\n- Molding, Hardware, Shop Annotations, Primary Operations, Annotations, Dimensions\n- **Include Empty Walls** option available for printing all walls even without objects\n\n---\n\n## 5. Bid Center\n\n### 5.1 Overview\n\n**Path:** Room Level > Sidebar > Bid Center\n\nThe Bid Center calculates job pricing using Rate Tables (Bid Methods), material costs, door catalog pricing, and labor calculations. Password-protected Internal Mode shows full cost breakdowns (legacy default password: \"solid\"; CV 2021+ has no default).\n\n### 5.2 View Modes\n\nFive view modes:\n1. **Bid Breakdown** -- Default view showing pricing breakdown\n2. **Cabinet Prices** -- Fixed catalog pricing per cabinet\n3. **Accessory Prices** -- Fixed catalog pricing per accessory\n4. **Vendors** -- Material vendor selection (default vendor pre-selected, can override per material)\n5. **Summary** -- Design summary for the job\n6. **Labor** -- Labor summary/calculation using part and assembly-based bid methods. Labor Schemes use the same line items as Rate Tables but with minutes instead of currency\n\n### 5.3 Rate Tables & Bid Methods\n\nRate Tables are collections of Bid Methods (pricing formulas). You can create unlimited Rate Tables and combine them.\n\n**Rate Table Management:**\n- Rate Table Selector, Create New, Copy, Rename, Delete\n- **Build A Sample Rate Table** -- Creates a pre-populated starter table\n- **Set As Default Rate Table** button sets current selection as default for new jobs\n- **Item Groups** -- Organize bid methods (e.g., \"Installation > Cabs\", \"Installation > Tops\")\n- **Filter Out Custom Methods** -- Hides custom methods (useful for stock pricing)\n\n**Line Item fields:** Icon, Name, Value, Method (Bid Method), Markup %, Tax %\n\n### 5.4 Options\n\n**Totals Tab:**\n- Default Deposit % and Default Markup %\n- Include Drawer Fronts / False Fronts in Door Count (for Per Door bid method)\n- Price Fillers As Cabinets (includes in lineal foot calculations)\n- Price Detached Toe Kicks As Cabinets\n- Lineal Total For Corner Cabinets = Width + Depth (or width only)\n- Include Doors, Drawers & Hardware in Part Count (for Per Part bid method)\n- **Estimate Sheets of Material** -- Uses built-in generic optimizer (1/4\" trim, 1/8\" kerf, block nesting; buyout parts excluded; honors grain property)\n\n**Rounding Tab:**\n- Line Item: Nearest Penny / Nearest Dollar / Round Up to Dollar\n- Totals: Actual Total / Rounded Display Total\n\n**Show/Hide Tab:**\n- Show $0.00 Price Lines (useful for Rate Table setup)\n- Show Hidden Lines In Internal Mode\n- Show Stock Cabinet Options\n- Show Legacy Line Items & Variables\n\n**Grouping Tab:**\n- Assembly Prices grouped by: Catalog, Room, Door Style (any order)\n- Breakout Rate Tables and/or Add-Ons Per Room\n\n**Password Tab:** Change Internal Mode password\n\n### 5.5 Add-Ons\n\nJob-specific bid method overrides. Not a replacement for Rate Tables -- only for one-off charges. Temporary to the current job unless you click \"Set as System Defaults.\"\n\n### 5.6 Advanced Reports in Bid Center\n\nThe Bid Center has its own Advanced Reports section in the sidebar, separate from the main Report Center. These operate similarly (Report Groups, Setup Reports, etc.) but are specific to bid/pricing data.\n\n---\n\n## 6. CAD Module\n\n### 6.1 Overview\n\n**Path:** Any Level > Sidebar > CAD (or F7)\n\nAvailable at Room Level, Assembly Level, Part Level, and Drawings View. In 3D View, requires a Saved Camera View first. In Cross Section View, requires a Saved Section View.\n\n### 6.2 CAD Layers\n\nThree default layers when entering CAD:\n- **Walls** -- Wall geometry\n- **Dimensions** -- Dimension objects\n- **Annotations** -- Annotation objects\n\nEach layer can be:\n- **Hidden** (toggle lightbulb to grey) -- elements invisible until re-shown\n- **Locked** (toggle lock icon) -- prevents editing/deletion\n- **Custom layers** can be created via New... in the Layer Selector\n\n### 6.3 CAD Table Tool\n\n**Path:** CAD Ribbonbar > Table Tool (requires 2D CAD multiplier)\n\nCreates data lookup tables within CAD views. Data availability depends on the current level:\n\n| Level/Area | Available Filters |\n|------------|-------------------|\n| Room Level | All Cabinets, Catalogs |\n| Elevations/Wall Elevations | Wall-specific filters |\n| Assembly Level/Assembly Sheets | All Parts, Options, Overrides |\n| Part Level | Part-specific data |\n| Paper/Title Block | Job/Customer/Room data |\n\n**Table editing properties (40 total):** Color, Layer, Line Type/Width, Position (Left/Right/Top/Bottom/Center X/Center Y), Width, Height, Frame On/Off, Grid On/Off, Allow Duplicates (consolidates like parts with qty), plus Group/Header/Data font and formatting controls.\n\nAt Assembly Level: can show all Options or only Overridden Options. At Room Level with Catalogs filter: shows catalog name with all selected options.\n\n### 6.4 Automatic Text (Title Blocks)\n\nThe CAD Automatic Text feature (under the CAD ribbonbar) inserts auto-updating text variables into drawings and title blocks. Variables pull from job/room/assembly/part properties depending on context. This is the mechanism for adding custom fields like PM names to title blocks -- by creating CAD text with lookup variables bound to Job Properties fields.\n\n---\n\n## 7. Dimensions & Layers System\n\n### 7.1 Layer Schedules\n\n**Path:** Room Level > Ribbonbar > Main Tab > View Group > Layers\n\nLayer Schedules control what is visible and how it appears in each view. Operations: New, Edit, Copy, Rename, Remove.\n\n**Advanced Layer Options (Edit > Advanced button):**\n\n**To Drawings settings:**\n- **Template** -- Select a Scene Template for \"To Drawing\" output\n- **Force drawing to Black** -- All lines black (for non-color printers)\n- **Include Wall Hatching** -- Cross-hatch inside walls\n- **Check for overlapped lines** -- Remove stacked 2D lines (slower processing)\n- **Check for intersecting surfaces** -- Add intersection lines\n- **Hide Concealed Lines** -- Remove hidden lines\n- **Assembly Outlines Only** -- Show only cabinet outlines\n- **Door Swings** -- None / Outline / Annotation\n- **Top Outlines Only** -- Counter top outlines only\n- **Show Simple Doors** -- Simple door outlines vs. full detail\n- **Show Simple Drawer Box** -- Simple dashed drawer box outline\n- **Show Curve Tessellation** -- Frequency controlled in Preferences > Detail Tab\n- **Show Axis Indicator** -- XYZ axis indicator\n- **Background Color** -- View background\n- **Show Sections Outline** -- Section highlighting\n- **Hatch Case Parts** -- Cross-hatching for case parts\n- **Hatch Internal Parts** -- Cross-hatching for internal parts\n\n### 7.2 Dimension Styles\n\n**Path:** Room Level > Ribbonbar > View Group > Dimension Styles\n\nControl the visual appearance of dimensions. Operations: New, Edit, Copy, Rename, Remove, Close.\n\n**Edit Dimension Styles -- 4 sections:**\n\n**General:**\n- **Line** (Yes/No) -- Extension lines on or off\n- **Fixed Scale** (Yes/No) -- When Yes, dimension properties ignore drawing scale factors\n\n**Lines and Arrows:**\n- Line Width -- Thickness of dimension lines\n- Ticks Height -- Extension past dimension line\n- Lines Extension -- Dimension line past extension lines\n- Tail Offset -- Gap between object and extension line start\n- Left/Right Arrow -- 15 types: None, Closed, Close Blank, Open 30, Open 90, Dot, Dot Blank, Dot Small, Dot Small Blank, Origin, Origin 2, Architectural Tick, Oblique, Box, Box Blank\n- Center Mark -- None, Cross, Target (for radius/diameter dims)\n- Arrow/Mark Size\n\n**Text:**\n- Alignment -- Aligned (with dim line) or Horizontal\n- V Placement -- Centered, Above, Outside, Below\n- H Placement -- Centered, At Ext Line 1/2, Over Ext Line 1/2\n- Offset -- Distance from dim line (works with V Placement)\n- Clearance -- Gap around text on dim line\n- Frame -- Box around dimension text (size = Clearance)\n- Font -- Any Windows font\n- Bold -- Yes/No\n- Height -- Text height\n\n**Fit:**\n- Hide Text -- Hide text if it doesn't fit the dimension space\n- Hide Arrow -- Hide arrow(s) if they don't fit\n\n### 7.3 Dimension Lines (Auto-Dimensions)\n\n**Path:** Layer Schedule > Dimensions > Lines\n\nControls which automatic dimension lines appear. Each line in the list = a separate dimension line in the drawing.\n\nOperations: New, Edit, Copy, Rename, Remove, Move Up, Move Dn\n\nThe **order** of lines in the list determines the order they appear in the drawing (first = closest to object). Use Move Up/Dn to reorder.\n\n**Dimension settings:**\n- **Style** -- Which Dimension Style to use\n- **Horizontal/Vertical Line Offset** -- Distance of first dimension from the object\n- **Horizontal/Vertical Line Increment** -- Spacing between subsequent dimension lines\n- **Tail Dimensions** -- Display dimensions with extension tails\n- **Show Object Depth** -- Show depth value in elevation view\n\n### 7.4 Annotations\n\n**Path:** Layer Schedule > Editable Layers > Annotations\n\nControls text labels in views:\n- **Show Wall Labels** -- Wall numbers\n- **Show Object Names** -- Cabinet/assembly names\n- **Show Object Numbers** -- Cabinet numbers\n- **Stagger Object Names/Numbers** -- Stagger labels for adjacent objects\n- **Show End Types** -- Finished end labels\n  - Sub-option: **Show Unfinished Ends**\n- **Show Object Drawers** -- Lines representing drawer count in plan view (with Offset and Increment settings)\n- **Font** button -- Change annotation font\n- **Label Style** selector -- Choose label format for each object\n\n### 7.5 Shop Annotations\n\n**Path:** Layer Schedule > Editable Layers > Shop Annotations\n\nShop-specific dimension and annotation controls:\n\n**Draw section:**\n- **Architectural Hinges** -- On/Off with Reverse option\n- **Roll Out Tray Outlines** -- On/Off\n- **Shelves** -- Single Line or Outline display\n\n**Dimension section:**\n- **Opening Width / Opening Height** -- Display opening sizes (mutually exclusive with Door/Drawer Size)\n- **Doors and Drawer Size** -- Display door/drawer dimensions (mutually exclusive with Opening sizes)\n- **Rails/Stiles** -- Face frame member dimensions\n- **Adjustable Shelf Opening Height** -- Enable/disable\n- **Frame Overlay** -- Dimension Frame Openings or Case Openings (Frame Overlay construction only)\n- **Closet Rods Center-Top Clearance** -- Closet module only\n- **Font** button -- Change shop annotation font, Bold, Fixed Height in Drawing Views\n\n---\n\n## 8. Assembly-Level Orthographic Editing\n\nThree orthographic views for editing assemblies (the \"Smiley Face Views\"):\n- **Face Ortho** -- Front view\n- **Top Ortho** -- Top-down view\n- **End Ortho** -- Side/profile view\n\nChanges made in any view are reflected in other applicable views. Use for adding unique parts, part shaping, and part overrides.\n\n**Adding Objects:** While in an ortho view, click Objects in the sidebar to access the Object Catalog. Drag objects into the view and use position/placement fields to locate them.\n\n**Library Parts:** Save custom parts to the Part Library (right-click > Save to Library) and retrieve them later. When importing, specify size, orientation, and finish.\n\n---\n\n## 9. xRender Module (cv-cr)\n\nThe xRender module handles photorealistic rendering from CV scenes.\n\n**File Menu:** Open (.cvr files), Close, Save, Save As, Export PNG, Exit\n\n**Render Modes:**\n- **Realtime** -- Quick render with realistic textures, no shadows, rotatable\n- **+Tour** -- Realtime walkthrough of saved camera views\n- **Advanced** -- Full render with textures and shadows (Preview / Full / Save)\n- **Architectural** -- Advanced + realistic reflections (Preview / Full / Save)\n\n**Settings (xRender tab):**\n- Anti-Aliasing quality, Light Sampling, Reflection Detail\n- Post Process: Image Editing, Tone Mapping (Clamp/Photographic/Neutral/Exposure/Exponential), Exposure, Gamma, White Balance, Brightness, Contrast, Burn, Sharpen, Glow, Blur\n- Background: Plain/Graduated/Image with color and image selection\n- Image: Resolution presets or Custom W x H\n\n---\n\n## 10. Tips & Tricks\n\n### 10.1 Adding a List to a Label\n\nUse CV's built-in **concat** (concatenation) functionality to combine multiple records into a single label field.\n\n**Example -- Door Labels on Cabinet Labels:**\n\n1. Create a new report in CV\n2. Right-click > Properties\n3. Create a **Link** type Import:\n   - Name: `DoorLabels`\n   - Type: Link\n   - SQL: `SELECT Doors.[Cabinet ID], Doors.[Label] + ' - ' + Doors.[Type] as DoorLabel FROM Doors`\n4. Create a new Cabinets table\n5. On the Comment List tab, configure:\n   - Primary Field: `Cabinet ID`\n   - Foreign Table: `DoorLabels`\n   - Foreign Field: `Cabinet ID`\n   - Display Field: `DoorLabels`\n\nThis concatenates all door labels for each cabinet into a single string that can be placed on a label.\n\n---\n\n## 11. EFSJ Issue Mapping\n\n### Issue 1: Frame Assembly Sheets -- Auto Pre-Dimensioned Frames\n\n**CV Mechanism:** Assembly Sheet dimensions are controlled via **Layers > Shop Annotations**:\n- **Opening Width / Opening Height** -- Shows face frame opening sizes\n- **Rails/Stiles** -- Shows face frame member dimensions\n- **Frame Overlay** -- Separate option to dimension Frame Openings vs. Case Openings\n\n**Path:** Right-click on Assembly Sheet view > Properties > Shop Annotations > Dimension section\n\n**To get frames pre-dimensioned automatically:**\n1. Edit the Assembly Sheet Layer Schedule\n2. Under Shop Annotations, enable **Opening Width** and **Opening Height** (or **Doors and Drawer Size** for door/drawer dims)\n3. Enable **Rails/Stiles** for member sizes\n4. Set the **Font** (button at bottom) for dimension text appearance and fixed height\n5. These settings persist in the Layer Schedule and auto-apply to every Assembly Sheet\n\n### Issue 2: Cabinet Assembly Sheets -- More Automated Dimensions, Parts Lists, Notes\n\n**Dimensions:** Controlled via Assembly Sheet > Layers > **Dimensions** section:\n- Create/edit auto-dimension lines via the **Lines** editor\n- Each line in the list = one dimension line on the sheet\n- Control offset (distance from object) and increment (spacing between lines)\n- Order lines via Move Up/Dn\n- Select **Dimension Style** for visual appearance\n- Enable **Tail Dimensions** for extension tails\n- Enable **Show Object Depth** for depth values\n\n**Parts Lists:** The Cut List Data Table area on the Assembly Sheet shows parts. For more data:\n- Use the **CAD Table Tool** at Assembly Level to create custom data tables\n- Filter options at Assembly Level: All Parts, Options, Overridden Options\n\n**Notes:** Two mechanisms for per-cabinet notes:\n- **Comments** (see Issue 4 below) -- displayed in Cut List Data Table\n- **Annotations layer** -- controls end type annotations and door/drawer position labels\n\n### Issue 3: Sink Cabinet False Front -- Phantom Drawer with 0 Dimension in Parts List\n\n**Root cause:** CV creates a false front entry in the parts/doors tables even when it has no meaningful dimension. The Drawer Front & False Front reports (DCL007-DCL008, DLFR01-DLFR04) specifically list these items.\n\n**Relevant reports:**\n- Drawer Front & False Front Check List (DCL007/DCL008) -- Shows overall front size and associated parts\n- Drawer Front & False Front List w/Notes (DLFRN1) -- Includes notes per front\n\n**To investigate:** Check the parts data in report.mdb for the false front entry. If the dimension is truly 0, this may be a catalog/construction method configuration issue where the false front part is generated but has no physical size. Look at the assembly's door setup in the catalog.\n\n**Possible fix approaches:**\n1. Edit the report to add a WHERE clause filtering out zero-dimension fronts\n2. Modify the catalog/construction method to not generate the false front part\n3. Copy the relevant report and add SQL filtering in the Create Table Wizard > Where tab\n\n### Issue 4: Cabinet-Level Notes on Assembly Sheets\n\n**Path:** Room Level > Right-click on Assembly > Properties > **Comment Tab**\n\nThe Comment Tab allows adding text comments to individual assemblies. These comments:\n- Display on Assembly Sheets (in the Cut List Data Table area)\n- Display in selected Reports\n- Are stored per-assembly in the job\n\nThere is also a separate **Notes Tab** (appears only if enabled in catalog configuration) that allows modifying Assembly Notes.\n\n**In reports:** Comments are available in report.mdb and can be included in custom reports via the Comment field in the appropriate table. The Comment List feature in the Create Table Wizard can format these.\n\n### Issue 5: Rename Board Stock Cutlist to S4S List\n\n**How to rename a report:**\n1. Go to Report Center > **Setup Reports**\n2. System reports CANNOT be renamed directly\n3. **Copy** the Board Stock Cut List report (right-click > Copy, or ribbonbar Copy button)\n4. In the Properties dialog, change the **Title** to \"S4S List\" (or desired name)\n5. Click OK\n6. Assign the renamed copy to your Report Groups\n7. Optionally remove the original from your groups\n\n**Board Stock reports available:** CLBS01-CLBS10 (10 variants with different sort/display options)\n\n### Issue 6: Add Room Name to Pattern Sheets\n\n**How to add fields to reports:**\n\n**Method 1 -- CAD Table (for drawing-based outputs):**\n1. Enter CAD mode on the Pattern Sheet / Drawing\n2. Use the **CAD Table Tool** to insert a data table\n3. At Paper/Title Block level, the filter gives access to Job/Customer/Room properties\n4. Select \"Room Name\" from the available fields\n\n**Method 2 -- Report Designer (for Report Center reports):**\n1. Copy the target report\n2. Open in **Report Designer** (Design Report button)\n3. The Room name should be available in the report.mdb data tables\n4. Add the Room Name field to the report layout\n\n**Method 3 -- Automatic Text in CAD:**\n1. Enter CAD on the drawing\n2. Use CAD > Automatic Text to insert auto-populating field variables\n3. Room name variables pull from the current context\n\n### Issue 7: Mitered S4S Width -- Showing Wider on Report Than in CV File\n\nThis is a data/calculation issue rather than a report formatting issue. When S4S parts are mitered, CV may calculate the \"rough\" (pre-miter) width for the cut list rather than the \"finished\" (post-miter) width.\n\n**Investigation steps:**\n1. Check the part's actual dimensions at the Part Level (Assembly > Part ortho views)\n2. Compare against the report.mdb Parts table values\n3. The report shows whatever is in the database -- if the width is wider, CV is reporting the pre-cut dimension\n4. Check if the miter angle creates a wider \"blank\" dimension for the S4S stock\n\n**If the report value is wrong:** This is likely a CV calculation/data issue, not a report customization issue. Contact Hexagon/Planit support if the part dimensions don't match expectations.\n\n### Issue 8: PM Name in Title Block\n\n**How to add custom fields to title blocks:**\n\nTitle blocks are CAD-based elements on the Drawings page. Two approaches:\n\n**Approach A -- CAD Automatic Text:**\n1. Go to Drawings page\n2. Enter CAD mode (F7)\n3. Use **CAD > Automatic Text** tool\n4. At Paper/Title Block level, job property fields are available\n5. The PM name would need to be stored in a Job Property field (e.g., a custom field or the Estimator/Contact field under Job Properties)\n6. Insert the Automatic Text variable that maps to that Job Property\n\n**Approach B -- CAD Table Tool:**\n1. In CAD on the Drawings page\n2. Insert a **CAD Table** with Paper/Title Block filter\n3. Select the Job Property field that contains the PM name\n4. Style the table to match the title block formatting (turn off Frame/Grid, set font)\n\n**Prerequisite:** The PM name must be entered into a Job Property field at the Job Level first. CV's Job Properties (Job Level > Job Properties) include various contact/project fields that can store this data.\n\n**Setting up the template:**\n1. Create or edit a Drawings Library template\n2. Add the CAD element to the title block area\n3. Save the template -- it will auto-populate for each job\n\n---\n\n*Source: Cabinet Vision 2024 Help System (cv-main, cv-cr modules)*\n*Generated: 2026-04-14*\n"}, {"id": "cnc-s2m", "file": "KB_CNC_S2M.md", "title": "CNC / S2M", "blurb": "Solid2Machine, machine catalog, NC links, tool comp, nesting, 6th-face, optimizer, +Label", "md": "# Cabinet Vision CNC & S2M Center Knowledge Base\n\n> Extracted from Cabinet Vision 2024 S2M Center, S2M Cabinetmaker, S2M Optimizer, and CV Main help systems.\n\n---\n\n## Table of Contents\n\n1. [S2M Center Overview](#1-s2m-center-overview)\n2. [Machine Catalog & Setup](#2-machine-catalog--setup)\n3. [Machine Types](#3-machine-types)\n4. [NC Links](#4-nc-links)\n5. [CNC Output Path & Tool Compensation](#5-cnc-output-path--tool-compensation)\n6. [Nesting (TrueShape & Block)](#6-nesting-trueshape--block)\n7. [6th Face Programming (CRITICAL)](#7-6th-face-programming-critical)\n8. [Optimization (Saw)](#8-optimization-saw)\n9. [Tool Catalog & Tool Sets](#9-tool-catalog--tool-sets)\n10. [Small Parts Handling](#10-small-parts-handling)\n11. [Label System (+Label / Label-IT)](#11-label-system-label--label-it)\n12. [Part Filtering](#12-part-filtering)\n13. [Machining Simulation](#13-machining-simulation)\n14. [Reports & NC Code Output](#14-reports--nc-code-output)\n15. [CNCRun.txt File Format](#15-cncrun-txt-file-format)\n16. [PNX/SNX Database Schema](#16-pnxsnx-database-schema)\n17. [Output Data File (3rd Party)](#17-output-data-file-3rd-party)\n18. [Databases & File Structure](#18-databases--file-structure)\n19. [Preferences & Global Settings](#19-preferences--global-settings)\n20. [CNC FAQs & Troubleshooting](#20-cnc-faqs--troubleshooting)\n21. [Version History (CNC-Relevant Features)](#21-version-history-cnc-relevant-features)\n22. [EFSJ Issue Mapping](#22-efsj-issue-mapping)\n\n---\n\n## 1. S2M Center Overview\n\nThe **S2M Center** (Screen to Machine) is Cabinet Vision's CNC output engine. It takes the 3D model/job data from Cabinet Vision and produces optimized nesting patterns, G-code, labels, and reports for shop floor production.\n\n### Product Tiers\n- **S2M Center** -- Full nesting and optimization for sheet routers and saws\n- **S2M Center Cabinetmaker** -- Simplified version for smaller shops\n- **S2M Center Optimizer** -- Optimization-only (no Intelli-CAM G-code generation)\n- **S2M for ALPHACAM** -- Integration with Hexagon's ALPHACAM CAM system\n\n### Key Components\n- **Machine Catalog** -- Define and configure all CNC machines\n- **Tool Catalog** -- Define all cutting tools, drill bits, and tool sets\n- **Material Catalog** -- Sheet sizes, grain, banding, costs\n- **Intelli-CAM** -- Built-in G-code generation engine (based on ALPHACAM)\n- **+Label (Label-IT)** -- Barcode and label generation system\n- **Part Filter** -- Powerful filtering to include/exclude parts from processing\n\n### S2M Center Views\n- **Part List View** -- Tabular list of all parts with properties\n- **Pattern View** -- Visual nesting/optimization result showing parts on sheets\n\n---\n\n## 2. Machine Catalog & Setup\n\nThe Machine Catalog is accessed from the Main Tab ribbon. It defines all CNC machines and their configuration.\n\n### Machine Catalog Toolbar\n- **Setup Name** -- Name of the currently selected machine setup\n- **Create New Machine** -- Creates a new machine of a specified type\n- **Copy Selected Machine** -- Duplicates a machine setup\n- **Change Machine Name** -- Renames a machine setup\n- **Delete Selected Machine** -- Removes a machine setup\n\n### Machine Tab Properties\n- **Manufacturer** -- Machine manufacturer (if not using Intelli-CAM)\n- **NC Link** -- The NC Link assigned to this machine (determines output format)\n- **Tag** -- Short identifier shown on labels to identify which barcode goes to which machine\n- **Output Metric (mm)** -- Force metric output\n- **Output Summary** -- Whether CNCRun.txt is generated for this machine\n- **Available** -- Whether the machine is available for output\n- **Output Directory** -- Where G-code files are written (supports UNC paths)\n\n### Limitations Tab\n- **Point of Origin** -- Controls where the machine's origin point is located\n- **Nest Pack** -- Controls how parts are packed (placed) on nested sheets\n- **Material Length is X** -- When disabled, material length runs along Y-axis\n- **X Positive from Origin** -- When deselected, X is calculated as negative from origin\n- **Y Positive from Origin** -- When deselected, Y is calculated as negative from origin\n\n> **Warning:** X/Y Positive from Origin options do NOT change G-code output -- the post processor must be modified separately.\n\n### Multi-Drill Tab\nConfigures multi-drill heads for Intelli-CAM G-code generation.\n- Assign tools to individual spindle positions\n- Set X/Y offsets from master spindle (X=0/Y=0)\n- **Override Tool Properties** -- When enabled, ignores individual drill feed/speed settings\n- **Format** button for ALPHACAM posts: Prefix, Delimiter, Tool Number Offset, Format\n- **Speed up by checking one axis only**\n- **Hide ALPHACAM legacy multi-drill attributes**\n\n---\n\n## 3. Machine Types\n\n### Sheet Machines (Primary)\nUsed as the **Primary Machine** in S2M Center. Must be one of:\n\n#### Sheet Router (Nested-Based Router)\nThe most complex and feature-rich machine type. Used for CNC routers that nest parts on full sheets.\n\n**Intelli-CAM Post Group:**\n- **Post Processor** -- Path to the Postability post file (.pst)\n\n**Intelli-CAM Rapid Group:**\n- **Safe Rapid Level** -- Height above material for rapid moves between operations\n- **Rapid Down To** -- Height where rapid transitions to machining speed for drilling\n- **Apply Comp on Rapid** -- Perform cutter compensation during safe rapid move (machine-specific)\n- **Drill traverse at safe rapid** -- Drilling traversal at safe rapid height\n\n> **Critical:** Safe Rapid and Rapid Down To values must be different (even slightly). Same values cause errors or undesirable results.\n\n**Intelli-CAM File Info:**\n- **File Extension** -- G-code file extension for this machine\n- **Save Drawing File** -- Creates .ARD (ALPHACAM Router Drawing) files alongside G-code\n- **Output Comment Characters** -- Characters used for G-code comments\n\n**Intelli-CAM Tool Movement:**\n- **Compensation Type** -- Three options:\n  - *Tool Center No G41/G42* -- Comp handled strictly through tool path offset (no machine comp registers)\n  - *Tool Center G41/G42* -- Same offset path but triggers machine control comp registers for tool wear adjustment\n  - *Tool Radius* -- Path follows exact part outline; ALL compensation at machine control\n- **Force Centerline on Open Interior Paths** -- Forces open interior routes to centerline\n- **Roll Around Corners** -- Breaks 90-degree corners into tiny radius (hints controller to decelerate)\n- **Limit Output to 3 Axis** -- Do NOT set to No unless machine has C-axis capability\n- **Y Axis Horizontal on Workplane** -- Sets Y-axis orientation on machining workplane\n- **5 Axis Tilt Clockwise** -- Sets 5-axis tilt direction\n- **Optimize Drill Selection** -- Minimizes gang drill head spindle configuration changes\n- **Mix Hole Diameters** -- Allows mixing drill diameters in a single spindle drop if spacing permits\n- **Slope Arc Lead Spiral Pocket** -- Spiral lead-in for pockets\n- **Hover Tool Comp on Arc** -- For controllers that restrict tool comp during arcs; adds compensation line above material prior to arc\n- **Adjust Open Tool Path for Climb vs Conventional** -- Adjusts open tool paths for cut direction\n\n**Intelli-CAM Sheet Reference Group:**\n- **Material Length is X** -- If machine's longer dimension runs along X, set TRUE; FALSE rotates material from normal X-axis\n- **Mic at Spoil Board** -- YES = tools touched off at top of spoil board; NO = touched off at top of material\n\n**Intelli-CAM Offset Group:**\n- **Approach Offset** -- Controls approach offset away from part edge on sloping leads\n- **Offset from Material Bottom** -- Controls tool offset from bottom of part edge on lead-in (reduces bottom-side chipping)\n- **Add Finish Pass to Pockets** -- Adds compensated finish pass to spiral pockets\n\n**Margin Settings:**\n- **Part Spacing Type**: Fixed | Tool Width + Pad | Tool Width + Offset + Pad\n- **Part Spacing** -- Value for spacing between parts\n- **Part Spacing Pad** -- Additional pad value\n- **Sheet Margins** -- Individual margins for 4 edges (removes raw edge for clean part edges)\n- **Offcut Margins** -- Individual margins for 4 edges of offcuts\n\n**Nesting - Complexity:**\n- **Nest Type** -- Block or True Shape\n- **Nest Quality** -- Fastest / Fast / Good / Better / Best (speed vs. yield tradeoff)\n\n**Nesting - Outline:**\n- **Outline Start Point**: Center (standard mid-edge) | Perimeter (outside-in, best vacuum hold) | Corner (reduces witness marks)\n- **Outline Sort Type**: Size (smallest first, best vacuum) | Position (logical sequence) | S Pattern\n- **Decelerate At End Of Outline** -- Distance before end of outline to begin deceleration (minimizes part shift on release)\n- **Percent of Feed Rate** -- Deceleration percentage\n- **Large Part Area** -- Parts above this area are cut last (sufficient hold-down by themselves)\n- **Auto-Skin Center Parts** -- Center-of-sheet small parts get automatic return onion skin\n- **Link Part Outlines** -- Part bridging (single lead-in/out for entire sheet, reduces cycle time)\n\n**Nesting - Rotation:**\n- **Restrict Rotation to 90 Degrees** -- Restricts TrueShape rotation to 90-degree increments\n- **Rotate Mirrored Parts 180** -- Helps operator visually identify left/right ends\n\n**Nesting - Misc:**\n- **Pack Vertical/Horizontal** -- Controls packing direction\n- **Force Pack Direction** -- Favors direction over optimization quality\n- **Offcuts**: None | Square Off Sheet | Outline Offcuts (largest to smallest)\n\n**Nesting - Common Line:**\n- **Common Line Cutting** -- Single tool pass cuts two adjacent parts. Better yield and tool life BUT: only one clean edge per common cut, no compensation, and requires sharp tools. Recommended for non-essential parts and non-premium materials. Settings are per-machine AND per-material.\n- **Maximum Retrace** -- Allows outline path to move alongside already-cut paths (fewer rapids)\n- **Retrace by Small Parts** -- Avoids retracing near small/very-small parts (may have shifted)\n\n**Pocket Waste:**\n- **Pocket Waste Tool** -- Tool to pocket out waste material in the nest\n- **Area/Dim for Pocket Waste** -- Minimum area/dimension triggers\n- **Skin Thickness** -- Maintains vacuum clamping pressure\n\n**Restrictions:**\n- **Max Sheet Width/Length** -- Maximum sheet size for this machine\n- **Spoil Board Z-Breach** -- Threshold for Z-level checking (prevents spoil board damage)\n\n**Scrap Cuts:**\n- **Create Scrap Cuts** -- Cuts up scrap into smaller pieces for disposal\n- Settings for tool, min cut length, max gap dimensions, skin thickness\n\n#### Sheet Saw\nUsed with panel saws. Requires Optimization (not Nesting). Setup includes blade kerf, booking height, phase count, and saw-specific parameters.\n\n### Part Machines (Secondary)\nUsed as the **Secondary Machine** in S2M Center. Must be one of:\n\n#### Part Router\nFor secondary router operations (after nesting/saw).\n- Most settings reference Sheet Router\n- **Offset by 1/2 EDX/EDY** -- Compensates for oversized parts routed to full outline\n- **Banding Tool** -- Tool representing the banding operation\n- **Label Format / Match Programs** -- Groups identical parts into single program (uses \"g\" designator)\n- **Zone Sizes** -- Front/Rear zones, Dimensions A/B/C, Alternate Zones (ping-pong loading)\n\n#### Part P2P (Point-to-Point)\nFor point-to-point machining centers.\n- Most settings reference Sheet Router and Part Router\n- Has zone support like Part Router\n\n**Secondary Machine Pre-Band option:** When set to Yes, tells S2M Center that parts are edge-banded BEFORE secondary machining, so banding thickness is factored into secondary operations.\n\n### Specialized Machines\n\n#### Drill and Dowel\nFor CNC drill and dowel inserters.\n- **Face Up** -- Forces program face up/down regardless of nest orientation. Can be overridden per-part with DNDFLIP parameter.\n- **Silent Mirrored Programs** -- Outputs additional mirrored program for shaped parts (allows running on opposite fence). Only X-position is mirrored, not Z. Program naming: `R01P00BL` (Primary) / `R01M00BL` (Mirrored), using Base-36 for Part ID (supports up to 46,655 IDs).\n\n#### Chop Saw\nFor automated cut-to-length saws. NC Links include TigerStop, RazorGage, Koch Maxi 5, etc.\n\n#### Other\nFor specialized machines like Hoffmann/RazorGage Haunching System.\n\n### Machine Set\nA Machine Set groups multiple machines that operate together. Allows same barcode or different barcodes to route to multiple machines.\n\n### Material Handling\nFor automated material handling systems (e.g., robotic panel feeders).\n\n---\n\n## 4. NC Links\n\nNC Links define the output format for each machine type. They determine what file format the G-code or data is written in.\n\n### Sheet Router Links\n- **IntelliCAM - Nest** -- Native Intelli-CAM G-code (most common)\n- **CimTech** -- CimTech nesting format\n\n### Parts Router/P2P Links (selected list)\n- **IntelliCAM** variants (Mirror, No Mirror, Full Outline, All Parts)\n- **AlphaCAM** (Nest, P2P)\n- **Biesse Rover** -- Biesse BiesseWorks format\
