<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabinet Vision Field Guide · EFSJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1ead9; --paper2:#eae1cc; --card:#fbf8ef; --card2:#f6f1e3;
  --ink:#221e17; --muted:#736852; --faint:#a99a7c;
  --line:#d7cbb0; --line2:#e6dcc4;
  --amber:#b04a10; --amber2:#d98a2b; --amber-wash:#f4e7cf;
  --blue:#1c567f; --blue-wash:#dfe9f0;
  --danger:#a81f19; --danger-wash:#f2ddd6;
  --ok:#3c6640;
  --shadow:0 1px 0 #fff inset, 0 2px 8px rgba(60,45,20,.08);
  --shadow-lg:0 1px 0 #fff inset, 0 10px 30px rgba(60,45,20,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Public Sans",system-ui,sans-serif;
  font-size:16px; line-height:1.6;
  background-image:
    linear-gradient(rgba(120,95,50,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,95,50,.05) 1px,transparent 1px);
  background-size:26px 26px;
  background-attachment:fixed;
}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- Header ---------- */
header.top{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,#efe6d0,#eadfc6);
  border-bottom:1.5px solid var(--line);
  box-shadow:0 2px 0 rgba(120,95,50,.06);
}
.top-inner{max-width:1180px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;flex-shrink:0}
.brand .mark{
  width:38px;height:38px;border-radius:8px;flex-shrink:0;
  background:radial-gradient(circle at 50% 42%,#fff 0 3px,transparent 3px),
             conic-gradient(from 0deg,var(--amber),#8a3a0c 25%,var(--amber) 50%,#8a3a0c 75%,var(--amber));
  border:2px solid #7d340a;
  box-shadow:0 2px 6px rgba(120,60,10,.35), 0 0 0 3px #eadfc6;
  position:relative;
}
.brand .mark::after{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.55)}
.brand .txt h1{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:19px;line-height:1;margin:0;letter-spacing:-.01em;
}
.brand .txt .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:600;margin-top:3px}
.searchwrap{flex:1;position:relative;max-width:560px;margin-left:auto}
#q{
  width:100%;padding:11px 40px 11px 40px;
  font-family:"Public Sans",sans-serif;font-size:15px;color:var(--ink);
  background:var(--card);border:1.5px solid var(--line);border-radius:9px;
  box-shadow:var(--shadow);outline:none;transition:border-color .15s,box-shadow .15s;
}
#q:focus{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-wash)}
.searchwrap .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.searchwrap .kbd{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--paper2)}
.ruler{height:9px;background:
   repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 13px);
   opacity:.7;border-bottom:1px solid var(--line2)}

/* ---------- Layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 80px;display:grid;grid-template-columns:236px 1fr;gap:34px}
nav.side{position:sticky;top:96px;align-self:start;height:max-content}
.side h3{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 10px;font-weight:600}
.side .navlink{
  display:flex;align-items:baseline;gap:9px;padding:8px 11px;border-radius:8px;cursor:pointer;
  color:var(--ink);font-weight:500;font-size:14.5px;border:1.5px solid transparent;margin-bottom:2px;transition:background .12s,border-color .12s;
}
.side .navlink:hover{background:var(--card2)}
.side .navlink.active{background:var(--card);border-color:var(--line);box-shadow:var(--shadow)}
.side .navlink .n{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--amber);width:16px;flex-shrink:0}
.side .divider{height:1px;background:var(--line2);margin:16px 4px}
main{min-width:0}

/* ---------- Home ---------- */
.hero{margin-bottom:30px}
.hero .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);font-weight:600}
.hero h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:33px;line-height:1.08;letter-spacing:-.02em;margin:8px 0 10px;max-width:20ch}
.hero p{color:var(--muted);font-size:16px;max-width:60ch;margin:0}
.hero p em{font-family:"Public Sans";font-style:italic;color:var(--ink)}

.sec-label{display:flex;align-items:center;gap:12px;margin:34px 0 16px}
.sec-label h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px;margin:0;letter-spacing:-.01em}
.sec-label .line{flex:1;height:1px;background:var(--line)}
.sec-label .cnt{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--faint)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.icard{
  position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:11px;
  padding:15px 16px 15px 19px;cursor:pointer;overflow:hidden;
  box-shadow:var(--shadow);transition:transform .13s,box-shadow .13s,border-color .13s;
}
.icard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--blue)}
.icard.p0::before{background:var(--danger)}
.icard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--amber)}
.icard .tag{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--blue-wash);color:var(--blue);margin-bottom:9px}
.icard.p0 .tag{background:var(--danger-wash);color:var(--danger)}
.icard h4{font-family:"Public Sans";font-weight:600;font-size:15.5px;margin:0 0 6px;line-height:1.25}
.icard .ex{font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.icard .src{margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint)}

.dcard{background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:17px 18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .13s,box-shadow .13s,border-color .13s;display:flex;flex-direction:column;gap:7px}
.dcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--amber)}
.dcard .h{display:flex;align-items:center;gap:10px}
.dcard .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:#fff;background:var(--amber);width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.dcard h4{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:16.5px;margin:0}
.dcard p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}

/* ---------- Doc reader ---------- */
.doc-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
.doc-head .n{font-family:"IBM Plex Mono",monospace;font-size:13px;color:#fff;background:var(--amber);min-width:30px;height:30px;padding:0 8px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:600;margin-top:5px}
.doc-head h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:29px;letter-spacing:-.02em;margin:0}
.doc-head .blurb{color:var(--muted);font-size:14px;margin-top:3px}
.crumbs{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--faint);margin-bottom:18px}
.crumbs a{color:var(--amber);cursor:pointer}

.article{background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:30px 34px;box-shadow:var(--shadow);max-width:100%;overflow-wrap:break-word}
.article h1{display:none}
.article h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:23px;letter-spacing:-.01em;margin:34px 0 12px;padding-top:16px;border-top:2px solid var(--line2);scroll-margin-top:110px}
.article h2:first-of-type{border-top:none;padding-top:0;margin-top:4px}
.article h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px;margin:26px 0 8px;color:var(--ink);scroll-margin-top:110px}
.article h4{font-family:"Public Sans";font-weight:600;font-size:15px;margin:18px 0 6px;color:var(--amber);scroll-margin-top:110px}
.article p{margin:10px 0}
.article ul,.article ol{margin:10px 0;padding-left:22px}
.article li{margin:5px 0}
.article strong{font-weight:600;color:var(--ink)}
.article em{color:var(--muted)}
.article hr{border:none;border-top:1px dashed var(--line);margin:22px 0}
.article code{font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--paper2);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;color:#8a3a0c}
.article pre{background:#2a2418;color:#f0e6cf;border-radius:9px;padding:14px 16px;overflow-x:auto;border:1px solid #1a160e}
.article pre code{background:none;border:none;color:inherit;padding:0;font-size:12.5px}
.article table{border-collapse:collapse;width:100%;margin:16px 0;font-size:13.5px;display:block;overflow-x:auto}
.article th{background:var(--card2);font-family:"Public Sans";font-weight:600;text-align:left;padding:9px 12px;border:1px solid var(--line);white-space:nowrap}
.article td{padding:9px 12px;border:1px solid var(--line2);vertical-align:top}
.article tr:nth-child(even) td{background:var(--card2)}
.article blockquote{margin:16px 0;padding:12px 18px;background:var(--amber-wash);border-left:4px solid var(--amber);border-radius:0 8px 8px 0;color:#5c3410}
.article blockquote p{margin:4px 0}
.article a{border-bottom:1px solid transparent}
.hl{background:#ffe08a;border-radius:3px;padding:0 2px;box-shadow:0 0 0 1px #e6b800 inset}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,20%{background:#fff0c2}100%{background:transparent}}

/* ---------- Search results ---------- */
.results{display:flex;flex-direction:column;gap:10px}
.rcount{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);margin-bottom:6px}
.ritem{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s,transform .12s}
.ritem:hover{border-color:var(--amber);transform:translateX(2px)}
.ritem .rt{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.ritem h4{margin:0 0 5px;font-size:15.5px;font-weight:600}
.ritem .snip{font-size:13px;color:var(--muted);line-height:1.5}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.4}

/* ---------- misc ---------- */
.footer{max-width:1180px;margin:0 auto;padding:0 22px 50px;color:var(--faint);font-size:12.5px;font-family:"IBM Plex Mono",monospace;text-align:center}
.menubtn{display:none;background:var(--card);border:1.5px solid var(--line);border-radius:8px;width:40px;height:40px;font-size:18px;cursor:pointer;flex-shrink:0}
.backtop{position:fixed;right:22px;bottom:22px;background:var(--amber);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;box-shadow:0 6px 16px rgba(120,60,10,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.backtop.show{opacity:1;pointer-events:auto}

@media(max-width:860px){
  .wrap{grid-template-columns:1fr;gap:0}
  nav.side{position:fixed;top:0;left:0;bottom:0;width:270px;background:var(--paper2);z-index:60;padding:20px;transform:translateX(-100%);transition:transform .22s;box-shadow:6px 0 24px rgba(0,0,0,.15);overflow-y:auto}
  nav.side.open{transform:none}
  .menubtn{display:block}
  .searchwrap .kbd{display:none}
  .brand .txt .sub{display:none}
  .top-inner{gap:10px;padding:10px 14px}
  .article{padding:20px 17px}
  .hero h2{font-size:26px}
  .scrim{position:fixed;inset:0;background:rgba(30,20,5,.4);z-index:55;display:none}
  .scrim.show{display:block}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <button class="menubtn" id="menubtn" aria-label="Menu">☰</button>
    <div class="brand" id="brand">
      <div class="mark"></div>
      <div class="txt"><h1>Cabinet Vision Field Guide</h1><div class="sub">E.F. San Juan · Engineering & PM</div></div>
    </div>
    <div class="searchwrap">
      <span class="ico">🔍</span>
      <input id="q" type="search" placeholder="Search settings, errors, how-tos…  (e.g. “dado gap”, “6th face”, “overlay”)" autocomplete="off">
      <span class="kbd">/</span>
    </div>
  </div>
  <div class="ruler"></div>
</header>

<div class="scrim" id="scrim"></div>
<div class="wrap">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<div class="footer" id="foot"></div>
<button class="backtop" id="backtop" aria-label="Back to top">↑</button>

window.KB = {"files": [{"id": "construction", "file": "KB_CONSTRUCTION.md", "title": "Construction", "blurb": "Assemblies, joinery, connection manager, face frame, reveals, drawer boxes, line boring, material schedules", "md": "# Cabinet Vision 2024 -- Construction Knowledge Base\n\n> Extracted from Cabinet Vision 2024 Help System (cv-main). Covers Assembly Manager,\n> Connection Manager, Job-Level Properties, Assembly-Level Properties, and Tips & Tricks.\n\n---\n\n## Table of Contents\n\n1. [Assembly Manager Overview](#1-assembly-manager-overview)\n2. [Construction Styles](#2-construction-styles)\n3. [Interior Case Branch](#3-interior-case-branch)\n4. [Exterior Case Branch](#4-exterior-case-branch)\n5. [Face Frame Branch](#5-face-frame-branch)\n6. [Connections Branch](#6-connections-branch)\n7. [Connection Manager (Joinery Types)](#7-connection-manager-joinery-types)\n8. [Toe Kick & Legs Configuration](#8-toe-kick--legs-configuration)\n9. [Reveals & Door Sizing](#9-reveals--door-sizing)\n10. [Drawer Box & Roll Out Construction](#10-drawer-box--roll-out-construction)\n11. [Operations Branch (Line Boring)](#11-operations-branch-line-boring)\n12. [Shadowline (Handle-less) Construction](#12-shadowline-handle-less-construction)\n13. [Job-Level Properties](#13-job-level-properties)\n14. [Assembly-Level Properties (Overrides)](#14-assembly-level-properties-overrides)\n15. [Overrides System](#15-overrides-system)\n16. [Break Outs & Conditions](#16-break-outs--conditions)\n17. [Material Schedules & Part Thickness](#17-material-schedules--part-thickness)\n18. [EFSJ Issue Mapping](#18-efsj-issue-mapping)\n\n---\n\n## 1. Assembly Manager Overview\n\n**Path:** System Level > Ribbonbar > Main Tab > Construction Group > Assembly Manager\n\nThe Assembly Manager is the utility that \"teaches\" Cabinet Vision how you build assemblies.\nIt creates a **set of rules** that assemblies follow during construction. If a specific Job,\nRoom, or Assembly needs different rules, overrides can be applied at those levels.\n\n### Assembly Types Configurable\n- **Assembly** -- Includes Cabinets and Closets\n- **Drawer - Roll Out** -- Includes Drawer Boxes and Roll Outs\n- **Counter Top** -- Counter Top construction\n\n### Key Principle\nThe Construction Method set here should reflect the **normal** manner assemblies are built.\nYou are not limited in the number of methods -- create as many as needed.\n\n### Ribbonbar Actions\n| Button | Function |\n|--------|----------|\n| **Return** | Close Assembly Manager |\n| **New** | Create a new Construction Method |\n| **Copy** | Duplicate existing method |\n| **Rename** | Rename current method |\n| **Delete** | Delete current method |\n| **Parameters** | Add UCS-queryable parameters to method (use `_CS:ParameterName`) |\n| **Conditions** | Add up to 20 custom breakout conditions per method |\n| **Modify** | Edit selected Part/Branch |\n\n---\n\n## 2. Construction Styles\n\nThe Construction Style determines which Parts are available in the method and how door sizing works. **This is the most critical first choice.**\n\n| Style | Products | Face Frame Branch | Door Sizing Control | Notes |\n|-------|----------|-------------------|---------------------|-------|\n| **Face Frame** | Cabinets | ON | Hinge Overlays (Material Manager) | Traditional American style |\n| **Frameless** | Cabinets | OFF | Reveals (Exterior Case Branch) | European modular; no Machining options |\n| **32 Millimeter** | Cabinets | OFF | Reveals (Exterior Case Branch) | Same as Frameless visually; Machining ON |\n| **Frame Overlay** | Cabinets | ON | Reveals (Exterior Case Branch) | European look + face frame strength |\n| **Closet 32mm** | Closets | OFF | Reveals (Exterior Case Branch) | 32mm + closet-specific parts |\n\n### Naming Convention\nName methods descriptively: \"Face Frame Dado Back\", \"Face Frame No Back\", \"32mm Standard\".\n\n### Assembly Construction Method Branches\n1. **Face Frame** (Face Frame / Frame Overlay styles only)\n2. **Interior Case**\n3. **Exterior Case**\n4. **Operations**\n5. **Connection**\n\n---\n\n## 3. Interior Case Branch\n\n**Path:** Assembly Manager > Assembly > Interior Case\n\nContains all internal assembly parts. Parts are only placed if the cabinet catalog entry includes them.\n\n### Interior Case Parts\n\n| Part | Branch File | Key Standards |\n|------|-------------|---------------|\n| **Adjustable Shelf** | `AW_Adjustable_Shelf.htm` | #650 Banding, #669 Bull Nose Banding, #607 Grain Alignment, #197 Shelf Minus, #295 Corner Grain, #593 Shelf Nosing, #552 Nosing Options |\n| **Divider** | `AW_Divider.htm` | #661 Banding, #610 Grain, #581 Machining Face |\n| **Drawer Stretcher** | `AW_Drawer_Stretcher.htm` | -- |\n| **Fixed Shelf** | `AW_Fixed_Shelf.htm` | -- |\n| **Hanging Section** | `AW_Hanging_Section.htm` | Closet-specific |\n| **Nailer** | `AW_Nailer.htm` | -- |\n| **Partition** | `AW_Partition_Branch.htm` | #660 Banding, #535 Grain, #3 Double Drawer Partition, #577 Machining Face |\n| **Shelf** | `AW_Shelf.htm` | -- |\n| **Shelf Nailer** | `AW_Shelf_Nailer.htm` | -- |\n| **Shoe Section** | `AW_Shoe_Section.htm` | Closet-specific |\n| **Shoe Shelf** | `AW_Shoe_Shelf.htm` | Closet-specific |\n| **Sub End** | `AW_Sub_End.htm` | Used behind Applied Ends |\n| **Unfinished Back** | `AW_Unfinished_Back.htm` | -- |\n| **Unfinished End** | `AW_Unfinished_End.htm` | #657 Banding, #525 Grain, #55 Scribe Reference, #57-60 Scribe by context, #374 Return End Method, #375 Extended Blank Panel Reveal, #376 Return End Clearance, #377 Extended End Wall Clearance, #617 Face Orientation, #061 Bottom Type, #578 Machining Face |\n\n### Adjustable Shelf Key Settings\n- **Standard #197 (Shelf Minus):** Controls the amount subtracted from the full opening width. This is a sizing deduction for clearance.\n- **Standard #607 (Grain Alignment):** Sets grain direction relative to opening\n- **Standard #593 (Shelf Nosing):** Whether to use a separate nosing piece\n- **Standard #552 (Nosing Options):** Configuration for nosing pieces\n\n### Partition Key Settings\n- **Standard #660 (Banding Definition):** Controls which edges are banded\n- **Standard #535 (Grain):** Vertical or horizontal grain\n- **Standard #3 (Double Drawer Partition):** Whether to use a double partition for drawers\n- **Standard #577 (Machining Face):** Which face gets machining\n\n### Unfinished End Key Settings\n- **Standard #55 (Scribe Reference):** Interior vs Exterior reference for scribes\n- **Standard #57-60:** Scribe values by context (by cabinet, appliance, tall, wall)\n- **Standard #374 (Return End Method):** How return ends are constructed\n- **Standard #061 (Bottom Type):** Notched (for toe kick) vs runs straight to floor\n\n---\n\n## 4. Exterior Case Branch\n\n**Path:** Assembly Manager > Assembly > Exterior Case\n\nTypically visible parts. Use Break Outs for different cabinet classes (Base vs Upper vs Tall).\n\n### Exterior Case Parts\n\n| Part | Key Standards |\n|------|---------------|\n| **Deck** | #676 Banding, #549 Grain, #135 Placement to Bottom Rail, #586 Placement to Case, #9 Notch for Sub-Frame, #012 Delete on Drawer Bank, #136 Finished Side Orientation, #137 Grain Alignment (corner), #574 Machining Face |\n| **Finished Back** | -- |\n| **Finished End** | #658 Banding, #534 Grain, #372 Default Type, #460 Applied End Face Positions, #079/#080 Scribes, #119 Bottom Type, #104 Applied End Placement, #579 Machining Face, #40 Applied End Machining Face |\n| **Front Skirt** | -- |\n| **Reveals** | See [Section 9](#9-reveals--door-sizing) |\n| **Shadowline** | See [Section 12](#12-shadowline-handle-less-construction) |\n| **Sink Skirt** | -- |\n| **Toe Kick** | See [Section 8](#8-toe-kick--legs-configuration) |\n| **Top** | #672 Banding, #127 Grain, #673/#684 Stretcher Banding (Front/Back), #674 Web Frame Banding, #124 Top Type, #125 Finished Side Orientation, #126 Grain Alignment, #146 Front Stretcher Width, #147 Back Stretcher Width, #148 Web Frame Width, #149 Gusset Size, #152 Placement to Top Rail, #585 Placement to Case, #573 Machining Face |\n\n### Deck/Bottom\n- **\"Deck\"** = bottom of a Base Cabinet; **\"Bottom\"** = bottom of an Upper/Wall Cabinet\n- **Standard #9 (Notch for Sub-Frame):** When a section has a sub-frame applied, this controls whether the deck is notched around it\n- **Standard #012 (Delete on Drawer Bank):** Option to remove deck from drawer-bank cabinets\n\n### Top Type Options (Standard #124)\n1. **Full Top** -- Solid panel across the top\n2. **Stretchers** -- Front and back stretcher bars (common for base cabinets)\n3. **Web Frame** -- Frame structure\n4. **Gussets** -- Triangular corner blocks (less material, adds rigidity)\n5. **No Top** -- No top at all\n\n**Classic Break Out example:** Base Cabinets use Stretchers; Upper and Tall Cabinets use Full Top.\n\n### Finished End Types\n| Type | Structure | Construction Method Response |\n|------|-----------|------------------------------|\n| **Standard** | Single finished panel | Follows Finished End settings |\n| **Panelized** | Single panelized end | Follows Finished End settings |\n| **Applied End** | Sub End + separate Finished End | Sub End follows Sub End settings; Applied part follows Finished End settings |\n| **Applied Door** | Sub End + Door part | Sub End follows Sub End settings; Door follows Finished End settings |\n| **Skinned** | Unfinished End + Skin (SLF/SRF) | Treated as Finished End by Construction Method |\n| **Laminated** | Unfinished End + Laminate (LAMV) | Treated as Finished End by Construction Method |\n\n> **Note:** Skins are NOT plastic laminate or sheet veneer -- those are handled in Material Schedules as Horizontal/Vertical Laminate.\n\n### Finished End Bottom Type (Standard #119)\n- **Choice 1:** Notched based on Toe Kick Height, Recess, and Joinery options\n- **Choice 2:** Runs straight to the floor\n\n---\n\n## 5. Face Frame Branch\n\n**Path:** Assembly Manager > Assembly > Face Frame\n**Available in:** Face Frame and Frame Overlay Construction Styles only\n\n### Face Frame Parts\n\n| Part | Key Standards |\n|------|---------------|\n| **Bottom Rail** | Width settings |\n| **End Stile** | #21 Width, #22 Width@Wall, #23 Width@Cabinet, #24 Width@Appliance, #25 Width@Tall, #26 Frame Over Blind End, #27 Additional Width, #44 Extended Width, #28 Extended Position, #34 Return Width, #275 Joint@45, #279 Width@45, #29 Full End Type |\n| **Frame** | #622 Frame Placement (included in overall dimension or not), #85 Connections as Part Adjustment |\n| **Mid Rail** | Width settings + placement settings (affects drawer opening sizes) |\n| **Mid Stile** | #35 Width, #36 Width@One Hinge, #37 Width@Two Hinges |\n| **Top Rail** | Width settings |\n\n### Frame Placement (Standard #622)\nDetermines whether the frame thickness is included in the overall dimension of the assembly. Critical for accurate sizing.\n\n### Frame Connections as Part Adjustment (Standard #85)\nControls how frame connection joinery affects part dimensions.\n\n### Frame Joints\nAt the Assembly Level, you can set each corner joint as **Short** or **Long**:\n- **Top Left** joint\n- **Top Right** joint\n- **Bottom Left** joint\n- **Bottom Right** joint\n\n\"Short\" = stile runs past the rail (rail is the short piece)\n\"Long\" = rail runs past the stile (rail is the long piece)\n\n### End Stile Context Widths\nThe End Stile width changes based on what is next to the cabinet:\n- **Default Width** (Standard #21)\n- **At Wall** (Standard #22)\n- **At Cabinet** (Standard #23)\n- **At Appliance** (Standard #24)\n- **At Tall** (Standard #25)\n- **At 45-degree** (Standard #279)\n\n### Mid Stile Widths\n- **Standard Width** (Standard #35)\n- **One Hinge Side** (Standard #36) -- wider to accommodate single hinge mounting\n- **Two Hinges** (Standard #37) -- widest, both sides have hinges\n\n---\n\n## 6. Connections Branch\n\n**Path:** Assembly Manager > Assembly > Connection\n\nDefines how parts connect together. Available connections depend on Construction Style.\n\n### Connection Parts\n| Part | Key Connection Standards |\n|------|------------------------|\n| Adjustable Shelf | Shelf-to-End, Shelf-to-Partition, etc. |\n| Bottom Rail | -- |\n| Deck | -- |\n| Divider | -- |\n| Drawer Stretcher | -- |\n| End Stile | -- |\n| Finished Back | -- |\n| Finished End | -- |\n| Fixed Shelf | -- |\n| Front Skirt | -- |\n| Mid Rail | -- |\n| Mid Stile | -- |\n| Nailer | -- |\n| **Partition** | #769 Partition-Mid Stile, #701 Partition-Top, #704 Partition-Deck, #713 Partition-Unfinished Back, #876 Partition-Front Toe, #877 Partition-Back Toe, #745 Partition-Shelf, #747 Partition-Fixed Shelf, #813 Partition-Drawer Stretcher |\n| **Shelf** | #737 Shelf-Finished End, #893 Shelf-Skin End, #721 Shelf-Unfinished End, #817 Shelf-No End, #736 Shelf-Sub End, #868 Shelf-Finished Back, #867 Shelf-Unfinished Back, #869 Shelf-Clipped Back, #725 Shelf-Partition, #724 Shelf-Divider, #901 Shelf-Bull Nose |\n| Shelf Nailer | -- |\n| Shoe Section | -- |\n| Sink Skirt | -- |\n| Skin End | -- |\n| **Toe Kick** | #772 Front Toe-Side Toe, #773 Front Toe-Full Finished End, #889 Front Toe-Skin End, #775 Front Toe-Sleeper, #776 Front Toe-Full Unfinished End, #788/#774 Front Toe-Applied End, #777 Front Toe-Sub End, #778 Front Toe-Full Sub End, #860 Front Toe-No End, #780 Back Toe-Side Toe, #781 Back Toe-Sleeper, #805 Sleeper-Back Toe, #779 Back Toe-Applied End, #798 Back Toe-Sub End, #861 Back Toe-No End, #900 Back Toe-Full Sub End |\n| Top | -- |\n| Top Rail | -- |\n| Unfinished Back | -- |\n| Unfinished End | -- |\n\n---\n\n## 7. Connection Manager (Joinery Types)\n\n**Path:** System Level > Ribbonbar > Main Tab > Construction Group > Connections\n\nThe Connection Manager configures connection machining used in assemblies and drawer boxes.\n\n### Connection Types\n\n| Type | Description |\n|------|-------------|\n| **Boring** | Dowel/pin boring patterns |\n| **Connector** | Hardware connectors (cam locks, RTA, etc.) |\n| **Dado** | Blind, Stop, and Through dados |\n| **Dovetail** | Dovetail joints |\n| **I-Joint** | Simple butt joints |\n| **Line Bore** | System hole patterns |\n| **Mortise & Tenon** | Traditional M&T joints |\n\n### Connection Sets\nMultiple connections can be tied together into a **Connection Set** -- e.g., combine dowel boring + pre-drills into a single set.\n\n### Dado Connection (Critical for EFSJ)\n\n**Standards for Dado Configuration:**\n\n| Standard | Setting | Description |\n|----------|---------|-------------|\n| **#2** | Dado Type | Blind, Stop, or Through |\n| **#1** | Dado Depth | How deep the dado is cut |\n| **#3** | Qualify Blind Dado | When to use blind dado |\n| **#4** | Blind Dado Tenon Width | Width of tenon portion in blind dado |\n| **#5** | Blind Dado Pocket Width | Width of pocket for blind dado |\n| **#6** | Suppress S2M Extend Dado | Whether S2M extends the dado cut |\n| **#7** | Blind Dado Front Notch Length | Length of front notch |\n| **#8** | Rear Notch | Whether to include rear notch |\n| **#9** | Blind Dado Rear Notch Length | Length of rear notch |\n| **#10** | **Dado Width Adjustment** | **Adjusts dado width relative to part thickness** |\n| **#11** | Dado Length Adjustment | Adjusts dado length |\n| **#12** | Dado Depth Adjustment | Adjusts dado depth |\n\n---\n\n## 8. Toe Kick & Legs Configuration\n\n### Toe Kick Branch (Exterior Case)\n\n**Path:** Assembly Manager > Assembly > Exterior Case > Toe Kick\n\nThe Toe Kick branch establishes the Assembly's **Toe Type**: Toe Kick, Legs, or Both.\n\n### Toe Kick Settings\n\n| Standard | Setting | Description |\n|----------|---------|-------------|\n| **#677** | Side Toe Banding | Edge banding for side toe pieces |\n| **#678** | Front Toe Banding | Edge banding for front toe kick |\n| **#679** | Back Toe Banding | Edge banding for back toe kick |\n| **#238** | Toe Kick Height | Height of toe kick area |\n| **#481** | **Toe Kick or Legs** | **Choose: Toe Kick Only, Legs Only, or Both** |\n| **#495** | Leg/Toe Kick Relationship | None / Toes relative to legs / Legs relative to toes |\n| **#498** | Leg/Toe Offset | Offset between leg and toe positions |\n| **#240** | Toe Kick Recess | Front recess of toe kick from cabinet face |\n| **#239** | Side Toe Recess | Side recess of toe from cabinet side |\n| **#255** | End Sleeper Recess | Recess of end sleepers |\n| **#257** | Back Toe Recess | Recess of back toe from wall |\n| **#254** | Maximum Sleeper Spacing | Max distance between sleepers |\n| **#580** | Front Toe Machining Face | Which face gets machined |\n\n### Leg Settings\n\n| Standard | Setting | Description |\n|----------|---------|-------------|\n| **#482** | Leg Front Recess | Position from front (center of model reference) |\n| **#483** | Use Legs on Back | Whether to place legs on back of cabinet |\n| **#484** | Leg Back Recess | Position from back |\n| **#485** | Use Legs on Finished End | Whether to place legs at finished ends |\n| **#486** | Leg Finished End Recess | Position at finished ends |\n| **#487** | Share Legs Between Cabinets | Whether adjacent cabinets share legs |\n| **#488** | Leg Unfinished End Recess | Position at unfinished ends |\n| **#545** | Leg Sub End Recess | Position at sub ends |\n| **#489** | Maximum Span Between Legs | Maximum distance before adding middle legs |\n\n### Assembly-Level Toe Properties\nAt the Assembly Level (Section Editor > Properties > Toe):\n- **Toe Height** -- override for this assembly\n- **Front Recess** -- override front toe recess\n- **Back Recess** -- override back toe recess\n- **Number of Sleepers** -- quantity or delete\n- **Left/Right Recess** -- for separate toe assemblies\n- **Left/Right Side Toe** options: Unfinished, Finished, Notched End Toe, Full End\n- **Back Toe** options: None, Unfinished, Finished\n- **Left/Right Sub End Toe** options: Notched End, Full End\n\n### Assembly-Level Legs Properties\nAt Assembly Level > Properties > Legs:\n- Select from Materials defined as Caster, Leg, or Leg Leveler types\n- **Prerequisite:** Toe Kick branch must be configured for proper leg placement\n\n---\n\n## 9. Reveals & Door Sizing\n\n### How Door Sizing Works by Construction Style\n\n| Construction Style | Door Sizing Controlled By | Location |\n|---|---|---|\n| **Face Frame** | Hinge Overlays | Material Manager > Hinge Properties |\n| **Face Frame (Inset Doors)** | Reveals (Inset Gaps) | Exterior Case > Reveals |\n| **Face Frame (Pair Door Gap)** | Vertical Reveal (#350) | Exterior Case > Reveals |\n| **Frameless** | Reveals | Exterior Case > Reveals |\n| **32 Millimeter** | Reveals | Exterior Case > Reveals |\n| **Frame Overlay** | Reveals | Exterior Case > Reveals |\n| **Closet 32mm** | Reveals | Exterior Case > Reveals |\n\n### Reveals Branch Settings\n\nReveals are the gaps between face members on frameless-style cabinets (typically 1/8\" or multiples).\n\n| Standard | Setting | Description |\n|----------|---------|-------------|\n| **#346** | Top Reveal | Gap at top of cabinet face |\n| **#347** | Horizontal Reveals | Gap between horizontal face members |\n| **#348** | Bottom Reveal | Gap at bottom of cabinet face |\n| **#349** | Finished End Reveal | Gap at finished end side |\n| **#350** | Vertical Reveal | Gap between pair doors (ALL styles); vertical gaps in frameless |\n| **#351** | Unfinished End Reveal - By Cabinet | Reveal when next to another cabinet |\n| **#299** | Assembly Next to Taller Assembly | Reveal behavior when height differs |\n| **#454** | Assembly Next to Deeper Assembly | Reveal behavior when depth differs |\n| **#298** | Assembly Next to Shared Panel | Closets only |\n| **#352** | Unfinished End Reveal - By Filler | Reveal when next to a filler |\n| **#353** | Unfinished End Reveal - By Appliance | Reveal when next to an appliance |\n| **#355** | Unfinished End Reveal - By Wall | Reveal when next to a wall |\n| **#618** | Sliding Door Quantity | Number of sliding doors |\n| **#619** | Sliding Door Overlapping | Overlap amount for sliding doors |\n| **#620** | Is Left Door on Front | Which sliding door is in front |\n| **#165** | Frameless Top Drawer Front Height | Minimum height for top drawer front |\n| **#590** | Drawer Box Position | Positioning of drawer box within opening |\n\n### Assembly-Level Reveal Overrides\nAt Assembly Level > Properties > Reveals:\n- **Top, Bottom, Left, Right** -- individual reveal values\n- **Horizontal, Vertical** -- gap values\n- **Equalize Door Widths and Drawer Heights** -- force equal sizing\n\n### Inset Doors (Face Frame)\nTo create inset doors in Face Frame construction:\n1. Go to Material Manager > select your Hinge\n2. On the Hinge Tab, set the **Inset value** to your face frame thickness (e.g., 3/4\")\n3. Create a Material Schedule using the inset hinge\n4. Apply that schedule at Job or Assembly level\n\n---\n\n## 10. Drawer Box & Roll Out Construction\n\n**Path:** Assembly Manager > Drawer Box - Roll Out\n\n### Drawer Box Construction Styles\n\n| Style | Parts Included |\n|-------|---------------|\n| **Five Piece Drawer** | 2 Sides, Back, Sub-Front, Bottom |\n| **Four Piece Drawer** | 2 Sides, Back, Bottom (front IS the drawer front) |\n| **Roll Out** | 2 Sides, Back, Roll Out Front, Bottom |\n| **System Drawer** | Back, Bottom, Drawer System Guides |\n| **System Roll Out** | Back, Bottom, Roll Out Front, Drawer System Guides |\n\n### Drawer Box Sizing Formula\n\n**Width:** `Opening - (Side Clearance x 2) = Drawer Box Width`\n- Side Clearance is set in Material Manager > Drawer Guide > Clearance Tab\n\n**Height:** `Face Height - Top Overlay - Bottom Overlay - Min Above Box - Min Below Box = Drawer Box Height`\n- Min Above Box / Min Below Box: set in Material Manager > Drawer Guide > Clearance Tab\n- Standard Heights option (Standard #1): forces specific height increments (enter largest to smallest)\n\n**Depth:** `Cabinet Depth - Back Clearance = Drawer Box Depth`\n- Standard Depths option (Standard #7): forces specific depth increments (enter longest to shortest)\n- Depth Clearance (Standard #5): distance between drawer box back and unfinished back\n\n### Object Tree Parameters\nUnder `DWR_OPEN`:\n- **BOXW** = Width of Drawer Box\n- **BOXH** = Height of Drawer Box\n- **BOXD** = Depth of Drawer Box\n\n### Key Principle\n**Part thickness is controlled by Material Schedules, NOT the Construction Method.** The Construction Method controls sizing and joinery; the Material Schedule controls what material each part is made from and its thickness.\n\n---\n\n## 11. Operations Branch (Line Boring)\n\n**Path:** Assembly Manager > Assembly > Operations > Line Boring\n\nLine Boring is used for adjustable shelf pins, hardware mounting (hinges, drawer guides, wire baskets, hanging sections).\n\n### Line Boring Settings\n\n| Standard | Setting | Description |\n|----------|---------|-------------|\n| **#356** | Line Boring Style | Bore All Holes / Bore Required Holes / Bore By Opening |\n| **#456** | Position Guides on System Holes | Restrict to system holes or bore additional holes |\n| **#470** | Position Hinge/Baseplates on System Holes | Same restriction for hinges |\n| **#359** | Line Boring Reference | Top or Bottom reference |\n| **#360** | 1st Hole Location | Distance from reference to first hole |\n| **#361** | Minimum Distance of Last Hole | Min distance from opposite end |\n| **#364** | Balance Panel | Equal spacing from top and bottom |\n| **#365** | Align Horizontal Reveals to System Holes | Face heights snap to system holes |\n| **#366** | Alignment for Adjustable Shelf | Shelf positions align to system holes |\n| **#358** | Hole Diameter | Boring hole diameter |\n| **#407** | Hole Depth | Boring hole depth |\n| **#362** | Front Holes Setback | Distance from front edge |\n| **#363** | Back Holes Setback | Distance from back edge |\n| **#623** | Line Bore Spacing | Distance between holes (typically 32mm) |\n| **#367-370** | By Opening variants | Same settings but referenced by opening |\n| **#624-632** | Mid Holes | Mid holes for backs and clipped backs |\n\n### Assembly-Level Boring Overrides\n- **Boring Style:** No Boring, Bore All, Bore Required, Bore By Opening\n- **Balanced Panels / Balanced Openings:** Equal spacing control\n- **Align Reveals / Align Shelves to System Holes**\n- **Top/Bottom Construction Holes:** Toggle on/off\n- **First Hole Location, Hole Depth, Hole Diameter, Front/Rear Setback**\n\n### Impact on Drawer Sizing\nIf **Position Guides on System Holes** is set to \"Restrict Guides to System Holes\":\n- Clearance settings become minimums\n- Drawer Box will be made smaller until guide holes align with system holes\n- Can result in shorter-than-desired drawer heights\n\nIf **Align Horizontal Reveals to System Holes** is restricted:\n- Top Drawer Face Height (Standard #165) becomes a minimum\n- Drawer front is enlarged until it aligns with system holes\n\n---\n\n## 12. Shadowline (Handle-less) Construction\n\n**Path:** Assembly Manager > Assembly > Exterior Case > Shadowline\n\nFor handle-less (grip-profile) cabinet construction.\n\n### Key Standards\n\n| Standard | Setting |\n|----------|---------|\n| **#41** | Shadowline Type |\n| **#5** | Rail Banding |\n| **#45** | Edge Banding |\n| **#52** | Drawer Type |\n| **#62/#70/#71** | Drawer Horizontal (Top/Middle/Bottom) |\n| **#63/#76** | Drawer Vertical (Edge/Middle) |\n| **#64** | Door Type |\n| **#65/#72/#73** | Door Horizontal (Top/Middle/Bottom) |\n| **#66/#77** | Door Vertical (Edge/Middle) |\n| **#67** | Pair Doors Vertical |\n| **#46/#47/#78/#88** | C-shape: Depth, Height, Vertical Offset, Edge Adjustment |\n| **#48/#49/#75/#92** | L-shape: Depth, Height, Vertical Offset, Edge Adjustment |\n| **#42/#50/#51** | Hardware Drawer Horizontal (Top/Middle/Bottom) |\n| **#93/#94** | Hardware Drawer Vertical (Edge/Middle) |\n| **#95/#96/#97** | Hardware Door Horizontal (Top/Middle/Bottom) |\n| **#105/#106** | Hardware Door Vertical (Edge/Middle) |\n| **#107** | Hardware Pair Doors Vertical |\n| **#131** | Hardware Vertical Offset |\n| **#89** | Hardware Door/Drawer Vertical Edge Adjustment |\n| **#108** | Hardware Horizontal Offset |\n| **#129/#130** | Hardware Bottom/Top Adjustment |\n\n---\n\n## 13. Job-Level Properties\n\n**Path:** Job Level > Job Properties > Cabinet\n\n### Construction Tab\n- Select Construction Method for Cabinets, Drawer Boxes, Roll Outs\n- **Modify for this Job** button: changes apply ONLY to this job\n- **Save As System** option: save job modifications as a new system-level method\n\n### Materials Tab\n- Select Material Schedules for Base, Upper, Drawer Boxes, Roll Outs\n- Separate schedules for Standard vs Exposed Interior\n- **Modify for this Job** for one-time Material Schedule changes\n- To use Exposed Interior schedule: right-click cabinet > Properties > enable Exposed Interior\n\n### Doors Tab\n- Select Door Style and Material for Doors, Drawer Fronts, End Panels\n- **All** branch sets defaults; override per Upper, Base, Tall, Drawer Front, EP\n- Italicized text = differs from \"All\" selection\n- **Grain Match** options: Assembly (per cabinet) or Auto-Group (across cabinets)\n- **Remove Overrides** button: clear all sub-item differences\n\n### Hardware Tab\n- Select Material Schedules for Pulls, Hinges, Slides, Drawer Guides\n- **Beaded Frames:** If hinge has inset value, select a Bead Profile for face frame openings\n\n### Flutes Tab\n- Flute configuration for doors and drawer fronts\n\n### Layout Tab\n- Job-level layout settings\n\n---\n\n## 14. Assembly-Level Properties (Overrides)\n\n**Path:** Assembly Level (Section Editor) > Properties\n\nChanges here ONLY affect the current Assembly. They persist as overrides, including when saving to catalogs.\n\n### Available Property Tabs\n\n| Tab | Controls |\n|-----|----------|\n| **General** | Basic assembly info |\n| **Construction** | Switch Construction Method for this assembly (cabinets, drawer boxes, roll outs) |\n| **Material** | Switch Material Schedules (upper standard, upper exposed, base standard, base exposed, drawer box, roll out) |\n| **Doors/Drawers** | Door style, material, profiles per cabinet class; grain matching |\n| **Frame** | Top/Bottom Rail widths, Left/Right Stile widths, Frame Joint corners (Short/Long) |\n| **Case** | Top type (No Top, Full, Stretchers, Web Frame, Gussets), Bottom (No Bottom, Standard), Scribes (7 values), Exposed Interior toggle |\n| **Toe** | Height, Front/Back/Left/Right Recess, Sleeper count, Side Toe type, Back Toe type, Sub End Toe type |\n| **Boring** | Boring Style, Balanced, Align settings, Hole parameters |\n| **Reveals** | Top/Bottom/Left/Right/Horizontal/Vertical reveals, Equalize widths/heights |\n| **Legs** | Select Caster/Leg/Leg Leveler material |\n| **Hardware** | Per-assembly hardware selection |\n| **Finish** | Finish settings |\n| **Flutes** | Flute settings |\n\n---\n\n## 15. Overrides System\n\n**Overrides** are changes that differ from the Material Schedule or Construction Method.\n\n### How Overrides Work\n1. CV rebuilds assemblies and looks to Schedules/Methods for values\n2. If it finds a value that differs from expected, it assumes intentional change\n3. The override is **permanent** (unless manually removed)\n4. The part will **never** revert to the standard value automatically\n\n### Dangers of Overrides\n- If saved to a Catalog, the override travels with the assembly forever\n- Future Construction Method changes will NOT affect overridden parts\n- Can cause unexpected behavior when pulling assemblies from catalogs\n\n### Removing Overrides\n**Method 1 (Nuclear):** Assembly Level > Modifications > Default Assembly\n- Rebuilds as a bare box (no doors, drawers, shelves, interior members)\n- Must re-add all interior parts and re-save to library\n\n**Method 2 (Surgical):** Right-click part in Ortho view > Properties > Overrides Tab\n- View specific overrides on the part\n- Click to select, then Remove\n- Part returns to pre-override behavior\n\n### Best Practice\n- **Never save to Catalog with unintended overrides**\n- Use overrides for one-time per-assembly changes only\n- Before saving to library, verify no accidental overrides exist\n\n---\n\n## 16. Break Outs & Conditions\n\n### Break Outs\nAllow different configurations for different Cabinet Classes (Base, Upper, Tall, Vanity, Corner) within the same Construction Method.\n\n**Classic example:** Top type differs:\n- Base Cabinets: Stretchers\n- Upper/Tall Cabinets: Full Top\n\n**How to create:** Click the \"+\" tab next to \"Default\" in any Assembly Manager question, then select the Class to define differently.\n\n### Conditions\nCustom breakout criteria added via the **Conditions** button in the Assembly Manager ribbonbar.\n\n- Assembly Level (CAB) and Drawer Box conditions available\n- **Limit:** 20 conditions per Construction Method\n- Creates custom breakouts based on specified criteria\n- Useful for automating construction variations based on cabinet properties\n\n---\n\n## 17. Material Schedules & Part Thickness\n\n### Critical Principle\n**Part thickness is controlled by Material Schedules, NOT the Construction Method.**\n\nThe Construction Method controls:\n- Part sizing (width, depth deductions)\n- Joinery/connections\n- Part placement\n- Part inclusion/exclusion\n\nThe Material Schedule controls:\n- What material each part is made from\n- Part thickness\n- Edge banding material\n- Laminate materials\n- Hardware assignments\n\n### Schedule Hierarchy\n1. **System Level** -- Default schedules for all jobs\n2. **Job Level** -- Override for specific job (\"Modify for this Job\")\n3. **Assembly Level** -- Override for specific cabinet\n\n### Material Schedule Types\n- **Assembly Parts** -- Case materials (ends, shelves, backs, etc.)\n- **Doors** -- Door and drawer front materials\n- **Drawer Box** -- Drawer box part materials\n- **Hinges** -- Hinge type and overlay settings\n- **Hardware** -- Pulls, slides, guides\n\n---\n\n## 18. EFSJ Issue Mapping\n\n### Issue 1: Dado Gaps (3/4\" dados + plywood 1/32\" thin = visible gaps)\n\n**Root Cause:** Standard 3/4\" dado is cut but actual plywood measures ~23/32\" (0.71875\"), leaving a 1/32\" gap.\n\n**CV Solutions Found:**\n\n1. **Dado Width Adjustment (Connection Manager > Dado > Standard #10)**\n   - This is the PRIMARY setting for addressing dado-to-material thickness mismatches\n   - Enter a **negative value** (e.g., -0.03125 or -1/32\") to undersize the dado width\n   - The dado will be cut narrower than the nominal material thickness\n   - Path: System Level > Construction Group > Connections > Dado > Standard #10\n\n2. **Material Manager Actual Thickness**\n   - In the Material Manager, each material has a **Thickness** property\n   - Set the plywood thickness to the **actual measured thickness** (e.g., 0.71875\" instead of 0.75\")\n   - CV will then size dados to match the actual material\n   - This affects ALL sizing calculations, not just dados\n\n3. **Dado Depth Adjustment (Standard #12)**\n   - Fine-tune depth if the narrower dado also needs depth compensation\n\n4. **Connection Sets**\n   - Create a custom Connection Set that combines an undersized dado with boring/connectors for additional holding strength\n\n**Recommended Approach for EFSJ:**\n- Set material thickness to actual measured values in Material Manager\n- Use Dado Width Adjustment (#10) as a **secondary** safety margin (e.g., -1/64\" additional)\n- Test with a single cabinet before applying globally\n\n---\n\n### Issue 2: Double Face Frame (Time-Consuming)\n\n**What CV Provides:**\n\n1. **Frame Over Blind End (End Stile Standard #26)**\n   - Configures Extended and Return Corner conditions\n   - Controls how the face frame handles blind corners where a second frame layer may be needed\n\n2. **Additional End Stile Width (Standard #27)**\n   - Allows adding extra width to the end stile without manual editing\n\n3. **Extended End Stile Width (Standard #44) and Position (Standard #28)**\n   - Pre-configure extended stile dimensions for when face frame extends past the case\n\n4. **Return End Stile Width (Standard #34)**\n   - Width for return-style end stiles\n\n5. **Construction Method Templates**\n   - Create a dedicated Construction Method named \"Double Face Frame\" or \"Face Frame Inset\"\n   - Configure all frame dimensions for the double-frame scenario\n   - Apply to specific cabinets via Assembly Level > Properties > Construction\n\n6. **Catalog-Based Approach**\n   - Build the double-frame cabinet once, configure it correctly\n   - Save to Catalog with all settings preserved\n   - Re-use by pulling from catalog (all overrides travel with it)\n\n**Recommended Approach for EFSJ:**\n- Create a dedicated \"Double Face Frame\" Construction Method\n- Set up all End Stile extended/return dimensions for your specific scenario\n- Save finished cabinets to a catalog for reuse\n- Use Break Outs within the method if only certain classes need the double frame\n\n---\n\n### Issue 3: Partition/Double Partition (One sticks out, shelf holes don't align front-to-back)\n\n**CV Settings That Control This:**\n\n1. **Partition Branch (Interior Case)**\n   - **Standard #660 (Banding Definition):** If one side is banded and the other isn't, thickness may differ, causing visual misalignment\n   - **Standard #535 (Grain):** Grain direction affects visual alignment\n   - **Standard #3 (Double Drawer Partition):** Explicitly controls whether a double partition is used for drawers -- **this is likely the setting causing the \"sticks out\" issue**\n   - **Standard #577 (Machining Face):** Controls which face gets machining; if set wrong, shelf pin holes can end up on the wrong side\n\n2. **Partition Connection Standards**\n   - **#769 (Partition-Mid Stile):** How the partition connects to the face frame mid stile\n   - **#701 (Partition-Top):** How partition connects to top\n   - **#704 (Partition-Deck):** How partition connects to deck/bottom\n   - **#745 (Partition-Shelf):** How partition connects to shelves\n   - **#747 (Partition-Fixed Shelf):** How partition connects to fixed shelves\n   - These connection standards define dado, butt, or connector joints -- mismatched connections can cause the partition to protrude\n\n3. **Line Boring Alignment**\n   - **Standard #362 (Front Holes Setback)** and **#363 (Back Holes Setback):** If these values differ, shelf holes will NOT align front-to-back on the partition\n   - **Standard #366 (Alignment for Adjustable Shelf):** Whether shelves align to system holes\n   - **Balanced Panels (Standard #364):** Equal spacing from top and bottom\n   - At Assembly Level > Properties > Boring > **Front/Rear Line Bore Setback** must be equal for aligned holes\n\n4. **Connection Manager Dado Settings**\n   - If the dado for the partition-to-shelf connection is deeper on one side, the partition appears to stick out\n   - Check Connection Manager > the connection used for Partition > Dado Width/Depth\n\n**Recommended Approach for EFSJ:**\n- Verify Standard #3 (Double Drawer Partition) matches your intent\n- Ensure Front Holes Setback (#362) = Back Holes Setback (#363) for aligned shelf holes\n- Check Partition Connection standards -- ensure symmetrical joinery on both sides\n- Verify Machining Face (#577) is set to the correct face\n\n---\n\n### Issue 4: Toe Kick with EZ Level Feet\n\n**CV Configuration:**\n\n1. **Standard #481 (Toe Kick or Legs):**\n   - Set to **\"Both\"** to have toe kicks AND legs/leveling feet\n   - Set to **\"Legs Only\"** if using ONLY leveling feet (no toe kick boards)\n\n2. **Standard #495 (Leg/Toe Kick Relationship):**\n   - **None:** Legs and toes positioned independently\n   - **Toes relative to legs:** Toe positions adjust to match leg positions\n   - **Legs relative to toes:** Leg positions adjust to match toe positions\n\n3. **Standard #498 (Leg/Toe Offset):**\n   - Controls the offset between leg and toe positions\n\n4. **Leg Recess Settings:**\n   - #482 Front Recess, #484 Back Recess, #486 Finished End Recess, #488 Unfinished End Recess, #545 Sub End Recess\n   - Each sets the **center of the leg model reference** position\n\n5. **Standard #489 (Maximum Span Between Legs):**\n   - Controls when CV adds intermediate legs for long runs\n\n6. **Standard #487 (Share Legs Between Cabinets):**\n   - Whether adjacent cabinets share corner legs\n\n7. **Assembly-Level Legs Tab:**\n   - Select from materials defined as **Caster**, **Leg**, or **Leg Leveler** types\n   - These must first be created in the Material Manager with the appropriate Material Type\n\n8. **Separate Toe Box Pattern (from Tips & Tricks):**\n   - Build a toe-kick-only cabinet (\"Kick Box\") via Hide Parts\n   - Create cabinets with no toe kick (separate Construction Method)\n   - Place Kick Box assemblies under cabinet runs\n   - Use UCS for unique modifications to the Kick Box\n   - Set Kick Box on Favorites Bar for quick access\n\n**Recommended Approach for EFSJ:**\n- In Material Manager: create \"EZ Level Foot\" as a Leg Leveler material type with correct model\n- In Construction Method: set #481 to \"Both\" (toe kicks + legs)\n- Set #495 to \"Legs relative to toes\" so legs track toe positioning\n- Configure all leg recess values to match your actual foot placement\n- Set #489 (max span) to prevent unsupported spans\n\n---\n\n### Issue 5: Auto 10' Ply When Height > 8'\n\n**What CV Provides:**\n\nCabinet Vision does NOT have a direct \"conditional material assignment\" rule built into the standard Assembly Manager. However, there are several approaches:\n\n1. **Conditions in Assembly Manager**\n   - The **Conditions** editor (up to 20 per Construction Method) can create breakouts based on assembly properties\n   - A condition could potentially reference cabinet height to trigger a different material behavior\n   - However, material assignment is in the Material Schedule, not the Construction Method\n\n2. **UCS (User Created Standards)**\n   - UCS formulas CAN evaluate assembly dimensions and conditionally modify behavior\n   - A UCS could check if `AH` (Assembly Height) > 96\" and trigger a different material assignment\n   - This requires UCS scripting expertise\n   - Path: System Level > Utilities Tab > Tools Group > User Created Standards\n\n3. **Break Out by Cabinet Class + Manual Override**\n   - Create a \"Tall 10ft\" Construction Method\n   - For any cabinet over 8', switch its Construction Method at the Assembly Level\n   - This requires manual intervention per cabinet\n\n4. **Multiple Material Schedules**\n   - Create a \"Standard\" schedule (3/4\" x 4x8 ply) and a \"10ft\" schedule (3/4\" x 4x10 ply)\n   - Switch at Job or Assembly level for tall cabinets\n\n**Recommended Approach for EFSJ:**\n- UCS is the most automated approach but requires scripting\n- In practice: create two Material Schedules (8' and 10' sheet goods) and switch per-assembly when needed\n- Consider a Condition in the Construction Method keyed to tall cabinet classes\n\n---\n\n### Issue 6: Door Overlay Changes When Modifying Doors/Drawer Fronts\n\n**Root Cause:** Door sizing is controlled differently based on Construction Style:\n- **Face Frame:** Hinge Overlays in Material Manager\n- **Frameless/32mm/Frame Overlay:** Reveals in Exterior Case Branch\n\n**Why Overlays Change:**\n\n1. **Hinge-Overlay Coupling (Face Frame)**\n   - When you change a door style, if the new door is assigned a different Hinge Schedule, the overlay values change\n   - The Hinge in the Material Manager has overlay values that directly control door sizing\n   - Changing door style at Assembly Level > Doors/Drawers may trigger a different hinge schedule\n\n2. **Reveal-Based Sizing (Frameless/Frame Overlay)**\n   - If Reveals are overridden at the Assembly Level, changing door style won't reset the reveals\n   - But if the door change triggers a rebuild, and the reveals were NOT overridden, they revert to Construction Method defaults\n\n3. **Override Persistence**\n   - If you manually adjusted overlays/reveals and then change the door, CV may treat the old overlay as an override\n   - Or the door change may \"reset\" the overlay back to default if no override existed\n   - See [Overrides System](#15-overrides-system) for how this works\n\n4. **Material Schedule Door Dependencies**\n   - The Door Material Schedule can include hinge assignments\n   - Changing door style may cascade to a different hinge with different overlay values\n\n**Recommended Approach for EFSJ:**\n- Verify which Hinge Schedule is active when door changes occur\n- Check if Hinge overlay values are correct in Material Manager for each hinge\n- Look for unintended overrides on the assembly after door changes\n- For Face Frame: ensure hinge overlay values match for all door styles used\n- For Frame Overlay: ensure Reveals are set correctly and consistently\n- If overlays shift: check Assembly Level > Doors/Drawers to see if an override was created or removed\n\n---\n\n## Appendix: Standard Number Quick Reference\n\n### Face Frame Standards\n| # | Setting |\n|---|---------|\n| 21-25 | End Stile Width (context-dependent) |\n| 26 | Frame Over Blind End |\n| 27 | Additional End Stile Width |\n| 28 | Extended End Stile Position |\n| 29 | Full End Stile Type |\n| 34 | Return End Stile Width |\n| 35-37 | Mid Stile Width (context-dependent) |\n| 44 | Extended End Stile Width |\n| 85 | Frame Connections as Part Adjustment |\n| 275 | End Stile Joint @ 45 |\n| 279 | End Stile Width @ 45 |\n| 622 | Frame Placement (in/out of overall dimension) |\n\n### Interior Case Standards\n| # | Setting |\n|---|---------|\n| 3 | Double Drawer Partition |\n| 197 | Adjustable Shelf Minus |\n| 295 | Adjustable Shelf Corner Grain |\n| 525 | Unfinished End Grain |\n| 534 | Finished End Grain |\n| 535 | Partition Grain |\n| 552 | Shelf Nosing Options |\n| 577 | Partition Machining Face |\n| 581 | Divider Machining Face |\n| 593 | Shelf Nosing |\n| 607 | Adjustable Shelf Grain Alignment |\n| 610 | Divider Grain |\n| 650 | Adjustable Shelf Banding |\n| 657 | Unfinished End Banding |\n| 658 | Finished End Banding |\n| 660 | Partition Banding |\n| 661 | Divider Banding |\n| 669 | Shelf Bull Nose Banding |\n\n### Exterior Case Standards\n| # | Setting |\n|---|---------|\n| 9 | Notch Deck for Sub-Frame |\n| 12 | Delete Deck on Drawer Bank |\n| 40 | Applied End Machining Face |\n| 55 | Scribe Reference |\n| 57-60 | Scribe values by context |\n| 61 | Unfinished End Bottom Type |\n| 104 | Applied End Placement |\n| 119 | Finished End Bottom Type |\n| 124 | Top Type |\n| 125 | Top Finished Side Orientation |\n| 126 | Top Grain Alignment |\n| 127 | Top Grain |\n| 135 | Deck Placement to Bottom Rail |\n| 136 | Deck Finished Side Orientation |\n| 137 | Deck Grain Alignment |\n| 146-149 | Top dimensions (Stretcher, Web Frame, Gusset) |\n| 152 | Top Placement to Top Rail |\n| 238-240 | Toe Kick Heights and Recesses |\n| 254-257 | Sleeper/Toe Recesses |\n| 372 | Default Finished End Type |\n| 374-377 | Return/Extended End settings |\n| 460 | Applied End Face Positions |\n| 481-489 | Leg settings |\n| 495/498 | Leg/Toe relationship |\n| 525 | Unfinished End Grain |\n| 534 | Finished End Grain |\n| 545 | Leg Sub End Recess |\n| 549 | Deck Grain |\n| 573-580 | Machining Face settings |\n| 585-586 | Placement to Case |\n| 617 | Unfinished End Face Orientation |\n| 672-679 | Banding Definitions |\n| 684 | Back Stretcher Banding |\n\n### Reveals Standards\n| # | Setting |\n|---|---------|\n| 165 | Frameless Top Drawer Front Height |\n| 298-299 | Adjacent assembly reveals |\n| 346-355 | Reveal values |\n| 454 | Next to Deeper Assembly |\n| 590 | Drawer Box Position |\n| 618-620 | Sliding Door settings |\n\n### Line Boring Standards\n| # | Setting |\n|---|---------|\n| 356 | Line Boring Style |\n| 358 | Hole Diameter |\n| 359-370 | Position/alignment settings |\n| 407 | Hole Depth |\n| 456 | Position Guides on System Holes |\n| 470 | Position Hinge/Baseplates on System Holes |\n| 623-632 | Spacing and Mid Holes |\n\n### Dado Standards (Connection Manager)\n| # | Setting |\n|---|---------|\n| 1 | Dado Depth |\n| 2 | Dado Type (Blind/Stop/Through) |\n| 3 | Qualify Blind Dado |\n| 4 | Blind Dado Tenon Width |\n| 5 | Blind Dado Pocket Width |\n| 6 | Suppress S2M Extend Dado |\n| 7 | Blind Dado Front Notch Length |\n| 8 | Rear Notch |\n| 9 | Blind Dado Rear Notch Length |\n| 10 | **Dado Width Adjustment** |\n| 11 | Dado Length Adjustment |\n| 12 | Dado Depth Adjustment |\n"}, {"id": "doors-finishes", "file": "KB_DOORS_FINISHES.md", "title": "Doors & Finishes", "blurb": "Door manager, section editor, profiles, panels, edgebanding, finishes, door matrix pricing, door recipes", "md": "# Cabinet Vision: Doors, Drawer Fronts, and Finishes Knowledge Base\n\n> Extracted from Cabinet Vision 2024 Help System. Covers the Door Manager, Door Sizing, Profiles, Panels, Material Schedules for Doors, Finishes, Textures, and Finish Types. Includes EFSJ-specific issue mapping at the end.\n\n---\n\n## Table of Contents\n\n1. [Door Manager Overview](#1-door-manager-overview)\n2. [Door Types](#2-door-types)\n3. [Creating Doors Step-by-Step](#3-creating-doors-step-by-step)\n4. [Door Section Editor](#4-door-section-editor)\n5. [Panel Types and Configuration](#5-panel-types-and-configuration)\n6. [Profiles (Inside Edge, Outside Edge, Raised Panel, Route)](#6-profiles)\n7. [Door Properties](#7-door-properties)\n8. [Door Sizing and Overlays](#8-door-sizing-and-overlays)\n9. [Door Associations (Size-Based Auto-Switching)](#9-door-associations)\n10. [Material and Profile Filters](#10-material-and-profile-filters)\n11. [Door Material Schedules](#11-door-material-schedules)\n12. [Cabinet-Level Door Selection (Job Properties)](#12-cabinet-level-door-selection)\n13. [Drawer Fronts](#13-drawer-fronts)\n14. [Finishes System](#14-finishes-system)\n15. [Finish Types (Rendering Properties)](#15-finish-types)\n16. [Textures](#16-textures)\n17. [Room Finishes (Job Level)](#17-room-finishes)\n18. [Material Manager and Materials](#18-material-manager-and-materials)\n19. [Door Matrix Pricing](#19-door-matrix-pricing)\n20. [Sample Door Recipes](#20-sample-door-recipes)\n21. [EFSJ Issue Mapping](#21-efsj-issue-mapping)\n\n---\n\n## 1. Door Manager Overview\n\n**Path:** System Level > Ribbonbar > Main Tab > Catalogs Group > Door Manager\n\nThe Door Manager is where Doors, Drawer Fronts, Panel Ends, and False Fronts are created. Material Filters and Profile Filters can also be assigned here.\n\n**Critical concept:** Doors are NOT sized in the Door Manager. Some door parts (Stiles, Rails, Panels) are configured with dimensions, but the overall finished door size is determined at the Job level by overlays/reveals.\n\n### Three Main Areas\n\n1. **Ribbonbar** -- New, Copy, Delete, Properties, Section, Catalog management\n2. **Sidebar** -- Search Pane (quick search by name/description/ID, tag search with `#TagName`) and Group Pane (unlimited groups/sub-groups, drag-and-drop organization)\n3. **Main Screen** -- Door list with right-click options (Copy, Delete, Properties)\n\n### Catalog Management\n\n- **Catalog Selector** -- Switch between multiple door catalogs\n- **New Catalog** -- Creates a new catalog\n- **Delete Catalog** -- Deletes catalog (CANNOT BE UNDONE)\n- **Catalog Properties** -- Set catalog-level construction defaults that apply to all NEW doors created within it\n\n### Catalog Properties (Construction Defaults)\n\nThese are defaults for NEW door styles only; changing them does NOT affect existing doors.\n\n| Setting | Description |\n|---------|-------------|\n| Frame Stile Width | Default frame stile width for new doors |\n| Mid Stile Width | Default mid stile width |\n| Frame Rail Width | Default frame rail width |\n| Mid Rail Width | Default mid rail width |\n| Joint Adjustment | For Mortise & Tenon doors ONLY. Set before creating the door, then reset to 0 after |\n| Mitered Frame | Whether new doors default to mitered corners |\n| Panel Type | Default panel type (None, Raised, Flat, Glass, etc.) |\n| Panel Inset | Default panel inset amount |\n| Vertical Slat Width | Center-to-center spacing for V-Slats |\n| Horizontal Slat Width | Center-to-center spacing for H-Slats |\n\n### Utilities Tab\n\n- **Generate Icons** -- Regenerates door preview icons if they appear incorrectly\n- **Assign Materials** -- Batch-assign Material Schedules to multiple doors at once (with optional costing)\n- **Assign Profiles** -- Batch-assign Profiles to multiple doors at once (with optional costing)\n- **Move Doors** -- Move doors between catalogs\n\n---\n\n## 2. Door Types\n\nWhen creating a new door, you choose one of three fundamental types:\n\n### Slab\n\nA single-piece door. Can optionally have a routed pattern on its face.\n\n- **Route Path Styles:** None, Radius Corners, Inv Radius Corners, Chamfer, and others\n- **Spacing** values define the distance from edges to the route path (Left Stile, Right Stile, Top Rail, Bottom Rail)\n- Used for: plywood doors, laminate doors, slab MDF, doors with routed designs\n\n### Multi Piece\n\nA traditional frame-and-panel door with separate stiles, rails, and panel(s).\n\n- You select the Panel Type and set Panel Inset\n- Frame Stile/Rail widths are configurable\n- Miter option available for frame joints\n- Used for: raised panel, flat panel, glass panel, cope & stick, butt joint, mortise & tenon\n\n### Template\n\nA door based on a predefined shape template with parametric controls.\n\n- **Available Templates:** Arch, Bump, Chamfer, Equal Cathedral, Flat Cathedral, Flex Arc Cathedral, Half Circle Arch, Inv Radius Corners, Radius Corners, Slope, Square\n- Template doors can be either Slab or Five Piece\n- Each template has shape parameters: Crown Height, Flat Indent, Radius, Chamfer, Rise/Run, etc.\n- **Soften Corners** option -- adds radius to corners (for RTF/Vinyl wrap to prevent tearing)\n- **Corner Radius** -- specific radius value when Soften Corners is enabled\n- **Shape Top/Bottom** -- shapes outside edge to match internal route pattern\n- **Lites** -- number and configuration of panels in the template\n\n---\n\n## 3. Creating Doors Step-by-Step\n\n### Basic Steps (All Door Types)\n\n1. Select the Category (group) where the door should be stored\n2. Click **New** in the ribbonbar\n3. Name the door and give it a Description\n4. Select the door Type (Slab, Multi Piece, or Template)\n5. Add Tags (comma or space separated) to aid in searches\n6. Select whether designing a Door or Drawer Front (sets initial sample size)\n7. Click Next\n8. Configure type-specific options (panel type, spacing, template params)\n9. Click Finish\n\n### Cope & Stick Construction Prerequisite\n\nFor any cope & stick multi-piece door, you MUST have an Inside Edge Profile that matches your door cutters BEFORE creating the door. The depth/width of the Inside Edge Profile is used by CV to size door parts correctly.\n\n### Mortise & Tenon Construction\n\n1. Go to Catalog Properties\n2. Set **Joint Adjustment** to the depth of the mortise and tenon\n3. Create the door\n4. Go BACK to Catalog Properties and set Joint Adjustment to 0\n5. Do NOT use an Inside Edge Profile with Mortise & Tenon doors (CV could double-add the adjustment)\n\n---\n\n## 4. Door Section Editor\n\n**Path:** Door Manager > Door Properties > Section (ribbonbar)\n\nAvailable for Multi Piece and Slab door types. This is where the door is actually designed.\n\n### Two Views\n\n1. **3D View** -- Graphic representation of the door that can be rotated, zoomed, rendered, exploded, and bent. Sidebar options allow selecting sample materials and profiles for preview.\n2. **Section View** -- Where the door is designed by adding/modifying Stiles, Rails, and Panels\n\n### Key Concepts\n\n- Add Stiles and Rails to divide the door into sections\n- Click on each part (Stile, Rail, Panel) to set its dimensions\n- **Enter FINISHED part sizes, not rough cut sizes** (exception: parts with an \"Extra\" field where you can add rough-cut allowance)\n- The order of adding parts determines joinery: Rails added before Stiles = Rails run long\n- Miter Corner option available by clicking off the door onto the screen\n\n### Stile & Rail Width Math (Critical for Cope & Stick)\n\nThe \"Width\" value set in Construction Defaults represents the portion of the stile/rail WITHOUT the Inside Edge Profile. The Inside Edge Profile width is ADDED to this value to get the finished width.\n\n**Example:** If your Inside Edge Profile is 3/8\" deep:\n- Set Frame Stile/Rail Width to 2-1/8\" to get a finished width of 2-1/2\" (2-1/8 + 3/8 = 2-1/2)\n- For Mid Stiles/Rails: set to 1-3/4\" because the IEP is on BOTH sides (2 x 3/8 = 3/4; 2-1/2 - 3/4 = 1-3/4)\n\n### Section Splits\n\n| Operation | Description |\n|-----------|-------------|\n| Horizontal Split | Split selected panel with a Mid Rail (creates 2 panels) |\n| Vertical Split | Split selected panel with a Mid Stile (creates 2 panels) |\n| Horizontal Multi Split | Split into N equal horizontal panels |\n| Vertical Multi Split | Split into N equal vertical panels |\n| Delete | Delete selected Stile/Rail |\n\n### Part List\n\nUse the Part List tool to verify part sizes. You can:\n- Select an Inside Edge Profile (affects part list depending on Extended setting)\n- Change door Width/Height and click Apply to test different sizes\n- Verify that all parts will cut correctly at various door sizes\n\n### Right-Click Options in Section View\n\n- On a **Stile/Mid Stile**: Edit (takes to CAM Editor)\n- On a **Rail/Mid Rail**: Edit, Remove Shape, Arch, Edit Shape (takes to Shape Editor)\n- On a **Panel**: Edit, Lock Width, Lock Height, Panel Type selector\n\n---\n\n## 5. Panel Types and Configuration\n\nSeven panel types are available:\n\n| Panel Type | Typical Use | Material Source |\n|------------|-------------|-----------------|\n| **None** | Frame-only doors (no panel, stiles and rails only) | N/A |\n| **Raised** | Solid lumber raised panels | Door Material Schedule > Raised Panel material |\n| **Flat** | Thin plywood or thin panel stock | Door Material Schedule > Flat Panel material |\n| **Glass** | Glass panels | Door Material Schedule > Glass Panel material |\n| **H Slats** | Horizontal tambour (left-right slats) | Door Material Schedule > H Slat material |\n| **V Slats** | Vertical tambour (up-down slats) | Door Material Schedule > V Slat material |\n| **Slab** | Thick plywood or thick panel stock | Door Material Schedule > Slab material |\n\n**Critical:** Selecting a panel type does TWO things:\n1. Tells CV what TYPE of panel this is\n2. Tells CV to use whatever MATERIAL is assigned to that panel type in the Door Material Schedule\n\n### Panel Properties\n\n- **Panel Inset** -- The distance the panel extends into one side of the frame (the amount that fits into the stile/rail groove)\n- **Horizontal Grain** -- Toggle panel from vertical grain (default) to horizontal grain\n- **Lock Width** / **Lock Height** -- For multi-panel doors, locks a specific panel's dimension so it stays fixed when the door grows or shrinks\n\n---\n\n## 6. Profiles\n\nThere are four types of profiles used with doors. These are set up as Profile Filters per door style.\n\n### Inside Edge Profile (IEP)\n\n**The most functionally important profile.** The shape of the inside edge cut on frame stiles and rails.\n\n> **The IEP is the STICKING profile — the cut made INTO the frame. It is NOT the applied moulding.**\n> These are two different profile types and they go in two different CV slots:\n> - **Inside Edge Profile** = the sticking (cope & stick, OR square sticking). Cut into the stile/rail. Its **Width sizes the parts.**\n> - **Applied Inside Edge Profile** = a separate moulding stuck onto the frame AFTER it is coped and stuck. Positioned by Applied X/Y Offset. Its own part on the cut list. **Does NOT size parts.** (See \"Applied Molding Parts\" below.)\n>\n> Cope & stick is one kind of sticking; **square sticking is another** — both are the IEP.\n> Loading an applied moulding into the IEP slot renders a plausible-looking door in 3D while silently inflating every stile and rail on the cut list.\n>\n> **EFSJ profile numbering:** prefix tells you which slot. **SS / OS / OV** (square / shaped / ovolo sticking) → Inside Edge Profile. **PM / HF / LV** (applied moulding, bead, half-round) → Applied Edge Profile. **ED** → Outside Edge. **PN** → Panel.\n\n- The decorative SHAPE is not as important as the DEPTH/WIDTH of the cut\n- For cope & stick construction, CV uses the IEP width to size door parts correctly\n- You CANNOT get correct door part sizes for cope & stick without a properly configured IEP\n- CV ships with sample IEPs, but you may need to create one matching your actual door cutters\n- **Applied** property determines whether the IEP affects stile/rail width (the \"Extend Part\" property)\n- IEP width is ADDED to each end of: Top Rail, Bottom Rail, Mid Rails, and Mid Stiles\n\n**If your IEP width does not match your door cutter depth, your parts list will be WRONG.**\n\n### Outside Edge Profile (OEP)\n\n- A shape cut around the outside of the door\n- Does NOT affect door part sizes\n- Edge Profile assignments per edge (Left, Right, Top, Bottom): Outside, Finger Pull, or None\n\n### Raised Panel Profile\n\n- The shape cut along the outside edges of a raised panel\n- Does NOT affect door part sizes\n- Applied to panel edges\n\n### Route Path Profile\n\n- The shape of the cutter used for routing designs into the door face\n- Used with Slab doors that have a route path and Template doors\n- Does NOT affect door part sizes\n\n### Profile Filters on Doors\n\nProfile Filters limit which profiles are available for a specific door style. When you start a new Job, selecting a door with Profile Filters will present only the filtered profiles for selection.\n\n---\n\n## 7. Door Properties\n\n**Path:** Door Manager > Select Door > Properties (double-click, ribbonbar button, or right-click)\n\n| Property | Description |\n|----------|-------------|\n| ID | Auto-generated, not editable. Useful in User Created Standards |\n| Name | Door style name |\n| Description | Door style description |\n| Tags | Keywords for search (space or comma separated) |\n| Unit Cost | Flat price per door (used with \"Use Door Catalog Pricing\" Bid Method) |\n| Cost/SqUnit | Price per square foot or meter (used with \"Use Door Catalog Pricing\" Bid Method) |\n| Oversize | Amount added to overall door size, typically for cleanup on a joiner |\n| Template settings | Style, Slab/Five-Piece, Soften Corners, Corner Radius, Shape Top/Bottom, Lites, etc. |\n| Spacing | Stile and Rail widths (Left Stile, Right Stile, Top Rail, Bottom Rail, Mid Stile, Mid Rail) |\n| Edgebanding | Per-edge setting: Door Edge Banding [D] or None [N] for Left, Right, Top, Bottom |\n| Edge Profiles | Per-edge assignment: Outside Profile, Finger Pull, or None for Left, Right, Top, Bottom |\n| Defaults | Default Material Schedule, Outside Edge Profile, Inside Edge Profile, Raised Panel Profile, Finger Pull Profile, Route Path Profile |\n\n### Edgebanding\n\nEdgebanding is only applied if:\n1. The active Material Schedule has a valid Banding Material assigned\n2. The Banding option is enabled on the Material Schedule\n3. The door's edge is set to \"D\" (Door Edge Banding) rather than \"N\" (None)\n\n---\n\n## 8. Door Sizing and Overlays\n\n**Doors are NOT sized in the Door Manager.** The overall finished door size is calculated at the Job level based on the Construction Style of the Assembly.\n\n### Face Frame Cabinets\n\n```\nDoor Size = Clear Opening of Face Frame + Door Overlay\n```\n\n- Overlay is a PROPERTY OF THE HINGE (found on the Hinge tab in Material Manager)\n- A single door covering a 20\"x20\" face frame opening with 1/2\" overlay = 21\"x21\" door\n- Drawer Fronts adopt the same overlay as the Door\n\n### Frameless / 32mm / Closet 32mm / Frame Overlay\n\n```\nDoor Size = Overall Assembly Dimension - Reveals\n```\n\n- These construction styles do NOT use overlay\n- Reveal values are entered in the Assembly Wizard\n- A 20\" assembly with 1/8\" reveals all around = 19-3/4\"x19-3/4\" door\n\n### What Controls Overlay\n\n- **Face Frame:** Hinge overlay property in Material Manager\n- **Frameless/32mm:** Reveal values in Assembly Wizard\n- Changing the hinge WILL change the overlay and therefore the door size\n- Changing the door style does NOT directly change the overlay\n\n---\n\n## 9. Door Associations\n\n**Path:** Door Properties > Associations (ribbonbar)\n\nAssociations allow doors to automatically switch construction style based on size thresholds. This is critical for production accuracy.\n\n### How It Works\n\nYou define minimum and maximum size ranges. When a door falls outside the acceptable range for its style, CV automatically substitutes an alternate door style.\n\n**Example setup:**\n- Width or Length <= 8\": Use Solid Wood Door (raised panel too small to run safely on shaper)\n- Width > 8\" and <= 24\": Use Square Raised Panel\n- Width > 24\" and <= 42\": Use Vertical Split Raised Panel\n- Length > 32\" and <= 64\": Use Square Raised Panel\n- Width > 42\" AND Length > 64\": Use Slab (plywood)\n\n### Mirrored Right Style\n\nFor situations where left and right doors should mirror each other:\n1. Create both Left and Right versions of the door\n2. Select the Left door\n3. In Associations, assign the Right door under **Mirrored Right Style**\n4. When the Left door is selected in a Job, the Mirrored Right Style is automatically used for right-hinging\n\n---\n\n## 10. Material and Profile Filters\n\n### Material Filters\n\n**Path:** Door Properties > Material Filter (ribbonbar)\n\nOptional but recommended. Limits which Material Schedules are available for a specific door style.\n\n- Move Available Materials from the left list to the right list\n- Example: A raised panel door might be limited to Alder, Ash, Birch, Cherry, Maple, Oak, Paint Grade\n- Material Cost can be viewed and edited from this screen\n\n### Profile Filters\n\n**Path:** Door Properties > Profile Filter (ribbonbar)\n\nOptional but recommended. Limits which Profiles are available for a specific door style.\n\nFour profile types can be filtered:\n1. **Inside Edge** -- limits available inside edge profiles\n2. **Outside Edge** -- limits available outside edge profiles\n3. **Raised Panel** -- limits available raised panel profiles\n4. **Route** -- limits available route path profiles\n\nProfile Cost can be viewed and edited from this screen.\n\nWhen you start a Job and select this door, only the filtered profiles will be presented for selection.\n\n---\n\n## 11. Door Material Schedules\n\n**Path:** Material Schedule Manager > Doors/Drawer Fronts type\n\nEvery Door or Drawer Front must have at least one Material Schedule assigned to it. The Material Schedule maps each door part to a specific material from the Material Manager.\n\n### Properties\n\n| Property | Description |\n|----------|-------------|\n| ID | Schedule ID number |\n| Name | Schedule name (naming convention matters -- e.g., \"Birch\" vs \"Birch Band\") |\n| Description | Schedule description |\n| Upcharge | Percentage upcharge above standard Part Catalog Price (for \"Use Part Catalog Pricing\" Bid Method) |\n| Buy Out | Enable if you buy doors rather than build them (affects Reports and Bids) |\n| Cost/Door | Flat rate per door (used with \"Use Door Catalog Pricing\" Bid Method) |\n| Cost/SqFt (SqM) | Cost multiplied by door area (used with \"Use Door Catalog Pricing\" Bid Method) |\n| Minimum Cost | Minimum door cost for this Material Schedule. Note: Total door cost = Door + Material + Profile costs. This is only the Material portion minimum |\n| Banding | Enables/disables edge banding on doors using this schedule |\n\n### Banding Control\n\nUnlike Assembly Material Schedules, Door Material Schedules have a direct Banding on/off toggle. Best practice: create duplicate schedules, one with Banding enabled, one without, and name them clearly (e.g., \"Birch\" and \"
