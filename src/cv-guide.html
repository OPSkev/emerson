n- **WoodWop** 4/5/25 -- Homag WoodWop format\n- **Building Blocks** (standard and Nest)\n- **Standard DXF** -- Generic DXF output\n- **TASK** versions 3/5 -- Thermwood TASK format\n- **CADCode** (standard and Nest)\n- **CimTech** (P2P and Nest)\n- Auto Link, Speedy Link, EnRoute, Cam 2/3, TwinCAM 32\n\n### Saw Links (selected list)\n- **Homag/Holzma** (Holzma, HPO)\n- **SCM** (Seziona, WinCut, z32, z45, Ottimo, MaestroCUT, PTX)\n- **Schelling HPO**\n- **Selco XML**\n- **Gabbiani Prima**\n- **Custom CUT File** -- User-definable cut file format\n- And many more (Altendorf, Casadei, Elcon, Fimal, Kappa, Macmazza, Martin, etc.)\n\n### Specialized Links\n- **Drill & Dowel**: Accu-Systems (2S, MTH, Universal), Omal (MTH, Lockdowel, Velox), Pillar (MTH, PLT, Lockdowel), ProEdge Lockdowel, Koch Sprint Plus, T.O.P. Albatros, Gannomat Express S1\n- **Chop Saw**: TigerStop, RazorGage, Koch Maxi 5, OMGA, Pistorius, Dimter, Grecon, Supercut\n- **Other**: Hoffmann, Anderson MLS, Voorwood, Biesse Door Machine, Homag Edgebander, Weinig French Miter, OSync\n\n---\n\n## 5. CNC Output Path & Tool Compensation\n\nThree output path types from Intelli-CAM (determined by Tool Catalog + Machine Catalog settings):\n\n### Centerline - Tool Center NO G41/G42\n- Outline path is offset from part by tool radius\n- Path is followed by center of tool\n- Tool wear requires re-outputting from S2M Center with new tool diameter\n- No machine-side compensation\n\n### Centerline - Tool Center G41/G42\n- Identical path to above\n- Triggers machine control to look up compensation values\n- Tool wear handled at machine control (enter difference, e.g., 0.02\" for a worn tool)\n- Advantage: swap bits on the fly without re-outputting\n\n### Offset - Tool Radius\n- Path follows exact part outline geometry\n- Machine control must apply ALL compensation (full tool radius)\n- Tool wear changes only comp value at control\n\n### When to Use Which\n- **No G41/G42**: Simplest, most compatible, but requires re-output for tool wear\n- **G41/G42**: Best for shops that sharpen tools frequently -- adjust at machine, not in software\n- **Tool Radius**: Full machine-side control; path shows true part geometry\n\n---\n\n## 6. Nesting (TrueShape & Block)\n\n### Nest Types\n- **Block Nesting** -- Rectangular bounding boxes for parts. Faster, less optimal yield.\n- **True Shape Nesting** -- Uses actual part geometry. Slower, significantly better yield for shaped parts.\n\n### Nest Quality Settings\nFastest > Fast > Good > Better > Best (speed vs. yield tradeoff)\n\n### Key Nesting Parameters\n\n**Outline Start Point Strategies:**\n1. **Center** -- Standard mid-point-of-edge start. Default behavior.\n2. **Perimeter** -- Innovative outside-in cutting. Each part is attached to a large uncut section when released. Superior hold-down for small parts. Often eliminates need for onion skins.\n3. **Corner** -- Leads in/out at corners instead of mid-edge. Reduces witness marks at start/end points.\n\n**Outline Sort Strategies:**\n1. **Size** -- Smallest first. Maximizes vacuum hold for remaining parts.\n2. **Position** -- Logical sequence around the sheet.\n3. **S Pattern** -- Follows an S-pattern across the sheet.\n\n**Rotation Controls:**\n- Restrict to 90-degree increments (disabling allows any angle but significantly increases processing time)\n- Rotate mirrored parts 180 degrees for operator identification\n\n**Common Line Cutting:**\n- Single pass cuts two parts. Better yield but:\n  - Only one clean edge per common cut\n  - No compensation (centerline path only)\n  - Requires sharp tools\n  - Recommended for non-essential parts / non-premium materials\n- Per-machine AND per-material settings\n\n**Offcut Generation:**\n- **None** -- No offcuts tracked\n- **Square Off Sheet** -- Additional route to square off sheet leaving one offcut\n- **Outline Offcuts** -- Locates and outline-cuts offcuts largest to smallest\n\n---\n\n## 7. 6th Face Programming (CRITICAL)\n\n**6th Face = Back Side / Flip Side / Reverse Side / Face 6**\n\n6th face programming enables machining operations on BOTH sides of a panel within a nested sheet, BEFORE cutting out individual parts.\n\n### How 6th Face Works\n\n1. **Sheet is loaded** on the CNC router, finished face down (typically)\n2. **\"A\" program runs first** -- machines the back side (6th face) operations: dados, bores, routes on the reverse side\n3. **Sheet is trimmed** -- Intelli-CAM uses the outline tool to clean up ONE long edge and ONE short edge (by half the Trim Cut value) to create clean reference edges for re-registration after flipping\n4. **Sheet is physically flipped** -- Operator flips the sheet over using the trimmed edges to align to 0/0 reference pins\n5. **\"Z\" program runs** -- Main program with all front-side operations and part outlines (identical to a normal \"N\" nest program)\n\n### Program Naming Convention\nWhen 6th face programs are output, they have one of three suffixes:\n- **N** = Nested sheet with NO corresponding 6th face program (standard single-sided)\n- **A** = Back-side (6th face) program; run BEFORE the Z program\n- **Z** = Main program with nest operations and part outlines; run AFTER flipping\n\n### Critical Settings\n\n#### Machine Catalog -- Nesting -- 6th Face Group\n- **Allow 6th Face Output** -- Master toggle to enable 6th face processing. When enabled:\n  - Secondary operations on the reverse side are machined on the sheet before front-side operations and part outlines\n  - The outline tool trims one long edge and one short edge (by half the Trim Cut value) to provide clean alignment edges after flipping\n\n- **Rotate 6th Face Trim** -- **THIS IS THE KEY ALIGNMENT SETTING.** Depending on which corner of the machine the 0/0 reference pins reside, you may need to rotate which edges get the trim cuts. This controls WHERE the trim cuts are performed on the sheet.\n\n#### Preferences -- Ordering Section\n- **Minimize 6th Face Patterns** -- When enabled, forces 6th face operations onto as FEW sheets as possible, at the expense of material yield. This reduces the number of sheets the operator must flip.\n\n#### Preferences -- Label Position\n- **Label side for 6th face** -- Controls which side of a 6th face nest the label is placed on.\n\n#### Preferences -- Miter Options (IMPORTANT RESTRICTION)\n- **2-Axis Miters are permitted on a nest but RESTRICTED from 6th face nesting.** The documentation explicitly states: \"It was determined that the miters might damage the integrity of the sheet when it needs to be flipped.\"\n- 4/5-Axis Miter operations are created on workplanes and require multi-axis tool and post support.\n\n#### Preferences -- Geometry\n- **Combine Boring to Through Boring** -- Combines front/back boring operations of same diameter/location into single through-bore. Can reduce the number of secondary (6th face) programs.\n- **Mill Operations from the Unfinished Face Where Possible** -- Machines through operations from the unfinished face.\n\n#### Part Filter -- Other Tab -- Part Face\nThree filter options for face machining:\n- **None** -- Parts with no machining on either face\n- **Single** -- Parts with machining on only ONE face\n- **Double** -- Parts with machining on BOTH faces (these are the 6th face candidates)\n\n### Version History -- 6th Face Feature Timeline\n- **Version 3.0 (2011 R1)**: 6th Face Nesting introduced as a new feature\n- **Version 4.1 (2012 R2)**: \"Minimize 6th Face Patterns\" option added\n- **Version 11**: \"Option for Whether A or Z Program Gets Labeled for 6th Face\"\n- **Version 12**: Setup Sheet Boundaries for Small and Very Small Parts (TrueShape Nesting Only)\n\n### EFSJ 6th Face Misalignment Issue -- Root Cause Analysis\n\n**Reported Problem:** When programming both sides of a board (6th face), the sheet gets trimmed on the first side. When flipped to machine the second side, dados and other features are misaligned by the exact amount the sheet was trimmed.\n\n**Documented Mechanism (from help files):**\n\nThe S2M Center's 6th face system works by:\n1. Running the \"A\" program which machines the back side AND trims one long + one short edge by **half the Trim Cut value**\n2. The operator then flips the sheet and registers the trimmed edges against the 0/0 reference pins\n\n**Potential Root Causes Based on Documentation:**\n\n1. **Rotate 6th Face Trim Mismatch**: The `Rotate 6th Face Trim` setting in Machine Catalog > Nesting > 6th Face Group controls which corner/edges get trimmed. If this does not match the physical location of the 0/0 reference pins on the EFSJ machine (Onsrud 148HD), the trimmed edges will not align to the correct reference, causing an offset equal to the trim amount.\n\n2. **Trim Cut Value Discrepancy**: The system trims by \"one half of the Trim Cut\" value. If the Trim Cut values set in Optimizer Parameters > Trim Tab do not match the actual material removed, the registration will be off.\n\n3. **Sheet Margin vs. Trim Interaction**: Sheet margins (Machine Catalog > Margin > Sheet Group) define how far from raw edges parts are placed. The 6th face trim must be coordinated with these margins. If margins differ between primary and 6th face programs, features will be offset.\n\n4. **Origin/Datum Configuration**: The Machine Catalog > Limitations Tab > Point of Origin setting, combined with Material Length is X and X/Y Positive from Origin settings, defines where the machine's coordinate system starts. After flipping, the coordinate system must correctly mirror. Incorrect settings here cause systematic offset.\n\n5. **Post Processor Flip Logic**: The Postability post processor must correctly handle the coordinate transformation when generating the A program. Since the A program runs with the sheet in one orientation but the features must align after flipping, the post must mirror X or Y coordinates appropriately.\n\n6. **Physical Registration**: Even with correct software settings, physical registration depends on:\n   - Accuracy of reference pins/stops on the machine table\n   - Whether the trimmed edges are truly clean (dulled trim tool = poor edge)\n   - Whether the operator consistently registers the correct edges to the correct pins\n\n**Investigation Checklist for EFSJ:**\n- [ ] Verify `Rotate 6th Face Trim` matches physical 0/0 pin location on Onsrud 148HD\n- [ ] Verify Trim Cut values in Optimizer Parameters match actual material removed\n- [ ] Compare Sheet Margins between primary and 6th face programs\n- [ ] Verify Point of Origin, Material Length is X, and X/Y Positive from Origin settings\n- [ ] Check post processor (Postability) for correct X/Y coordinate transformation on flip\n- [ ] Verify the trim cuts are actually using half the Trim Cut value (not full)\n- [ ] Measure actual misalignment -- if it equals trim amount, it confirms trim/registration issue\n- [ ] Test with a simple two-sided part: bore on face 1, bore on face 6, verify alignment\n\n---\n\n## 8. Optimization (Saw)\n\nSaw optimization generates cut patterns for panel saws. Separate from nesting (which is for routers).\n\n### Optimizer Parameters -- Patterns Tab\n- **Finished Face**: Down | Up | Most Operations Up\n- **First Cut**: Rip (with grain) | Cross/Y Cut (across grain) | Either\n- **Strip Sorting** -- How strip sets are ordered\n- **Part Sorting** -- How parts within strips are ordered\n- **Eliminate Z-Cuts** -- Z-Cuts are \"3rd phase\" cuts. Allowing them improves yield but costs time.\n- **Eliminate T-Cuts** -- T-Cuts break sheets apart before ripping/cross-cutting. Improves yield but costs time.\n- **Offcut/Waste Position** -- First or last in strips\n- **Quality Slider** -- Speed vs. optimization quality\n- **Yield vs. Labor** -- Yield favors less material; Labor favors fewer saw cycles\n\n> **Important:** Strip direction can change up to 6 times maximum. Z-Cuts could occur on 3rd through 8th phase. Eliminating Z-Cuts affects pattern types but NOT phase count -- set Phase Count in Machine Catalog.\n\n### Optimizer Parameters -- Restrictions Tab\n- Min/Max Strip Lengths and Widths\n- Min/Max T-Cut Lengths and Widths\n\n### Optimizer Parameters -- Trim Tab\n- Trim (Dust Cut) around each edge of sheets\n- Trim around each edge of offcuts\n\n### Optimizer Parameters -- Offcuts Tab\n- Minimum Offcut Length/Width\n- Prefer Full Sheets vs. Offcuts\n- Favor Yield vs. Fewer Bins\n- Prefer Largest vs. Smallest Offcuts\n- Only use Offcut if it doesn't create a new Offcut\n\n### Booking (Stacking)\n- Max Booking Height in Machine Catalog\n- Booking Max Sheets -- Set this to max stack count for thinnest material; S2M calculates per-material stacking from height limit\n\n---\n\n## 9. Tool Catalog & Tool Sets\n\n### Tool Properties\n- **Machine Assignment** -- Which machine(s) can use this tool (N/A = any machine)\n- **Tool ID** -- Unique auto-assigned ID; used by UCS parameters to assign specific tools\n- **Diameter** -- Used for automatic tool selection logic\n- **Work Depth** -- Working depth of the tool\n- **Allow Auto Select** -- Includes/excludes from automatic selection\n- **Down Shear / Up Shear** -- Establishes tool selection criteria\n- **Outline Tool** -- Designates tool as an outline (part cutout) tool\n\n### Tool Sets\nTool Sets assign multiple tools to a single route path with one selection. Each tool in the set has its own offset, depth, and properties.\n\n**Tool Set Properties:**\n- **Nested Part Clearance** -- Extra space between parts when this Tool Set's profile is used. Added to machine Part Spacing.\n- **Door Profile Types**: Outside Edge, Inside Edge, Raised Panel Detail, Route\n\n**Tool Set Tool Properties:**\n- **Router Bit** -- Which tool from the catalog\n- **Offset** -- Left/right offset from path\n- **Depth** -- Cut depth within the set\n- **Drop Offset** -- For under-cut bits; distance from edge before entering\n- **Cut For Glass** -- Defines glass position for glass door tool sets\n- **Reference Point**: Reference From Left | Center | Right\n\n**Operation Types within Tool Sets:**\n- **Rough** -- Standard routing with Tool Side (Clean Left/Right)\n- **Engrave** -- For engraving (use V-bit; path calculated from tool shape)\n- **Pocket** -- Pocket cutting operations\n- **Clean Up** -- Cleans corners after large-diameter pass\n- **Vertical/Horizontal Slats** -- For Shaker-style MDF doors\n- **Finish** -- Finish pass for inside radii on outside toolpaths\n- **Profile** -- Cleans inside/outside radii on profiled toolpaths\n\n**Depth Reference Options:**\n- **Fixed Depth** -- Positive value from top of material (depth stays consistent with thickness change)\n- **Material + Depth** -- Negative value from bottom of material (remaining thickness stays consistent)\n- **Operation + Depth** -- Gets depth from the defined operation\n\n### Tool Selection Logic\n- Auto-selection based on diameter match, tool type, machine assignment\n- **No Tool Found errors**: Ensure exact diameter match (including unit consistency), correct machine assignment (N/A for any machine), and valid tool availability\n- **Assign Specific Outline Tool to Material** via UCS: Use TOOLID parameter with material filter\n\n---\n\n## 10. Small Parts Handling\n\nCritical for preventing part movement during machining.\n\n### Part Size Definitions\n- **Small Parts** -- Defined by Area (sq in/mm) and Dim (width or length override)\n- **Very Small Parts** -- Smaller than small parts; different hold-down procedures\n\n### Hold-Down Methods\n\n**Lead Types (5 options):**\n1. **None** -- Simple plunge. Least favored. No cutter compensation.\n2. **Sloped** -- Most common. Less strain on bit, cleaner cut. Required for G41/G42 compensation.\n3. **Tab** -- Bridge left by partial-depth cut. Second pass removes tab. Bridge holds part during cut-free.\n4. **Onion Skin** -- First pass cuts slightly less than full depth. Thin \"skin\" anchors part. Second pass removes skin.\n5. **Return Onion Skin** -- Like Onion Skin but ALL return-onion parts get first pass before ANY get liberating second pass.\n\n### Nest Boundaries for Small Parts\n- **Exterior** -- Keeps small parts away from sheet edge\n- **Corner options** -- Keeps small parts away from specific corners\n- **Interior** (Very Small only) -- Keeps very small parts away from sheet CENTER (use with Perimeter nesting)\n\n### First Pass Offset\nWhen using Onion Skin, the first pass can cut the part oversized (rough cut) by a specified amount.\n\n---\n\n## 11. Label System (+Label / Label-IT)\n\n### Label Format\nDefines barcode formatting. Variables: `{ZO}` for Zone/Run Field, `{PR}` for Program Name.\n\n### Label Sort Order Options\n- Bottom to Top, Left to Right (and reverse)\n- Left to Right, Bottom to Top (and reverse)\n- Right to Left, Top to Bottom (and reverse)\n- Top to Bottom, Left to Right (and reverse)\n- Last Out - First In (beam saw pattern)\n- Rip - Cross Cut - 3rd Phase (table saw pattern)\n- Standard Optimized Order\n\nSort order is calculated based on Part's Origin. Part Number location indicates Part Origin.\n\n### Label Applicator Machines\nSupported manufacturers: Anderson, Biesse (standard + CIX), BSA, CNC Factory, Holzher, KDT, Komo, NewCNC, Onsrud InnoAgg, Robotic Automation, S2M Labeling, SCM (standard + Robot Cell + X Series + XCS), Weeke CON3.\n\n**Onsrud InnoAgg parameters:** PLO Folder\n\n### Image Types\n16 Color BMP, 24-bit BMP, 256 Color BMP, EMF, GIF, JPEG, Monochrome BMP, PNG, ZPL (Automatic/Condensed/Neat/Raw/Standard)\n\n### Label Origin\n9 positions for on-board label applicators: Automatic, Bottom/Center/Top Left/Center/Right\n\n### Preferences -- Label Position\n- **Rotate labels to align with sheet length** -- Labels always oriented to sheet length; operator sticks consistently, Part Graphic rotates for downstream orientation\n- **6th face label side** -- Which side of 6th face nest gets the label\n- **Label annotation size control**\n\n---\n\n## 12. Part Filtering\n\nThe Filter Parts feature controls which parts are included in machine processing.\n\n### Filter Types\n1. **New Filter** -- Ignores current selections\n2. **Add to Selected Items** -- Builds on manual selection without losing it\n3. **Filter on Previous Selection** -- Chains filters (e.g., select cabinets, then filter by material)\n4. **Remove Selected Items** -- Deselects matching items\n\n### Filter Tabs\n\n**Assemblies** -- Include/exclude by Job, Room, or Cabinet (individually or in groups)\n\n**Materials** -- Include/exclude by material name\n\n**Parts** -- Include/exclude by part type\n\n**Other** -- Three categories:\n- **Operations**: Part Shape (Shaped/Rectangular), Part Face (None/Single/Double), Horizontal Boring (With/Without/Only), Vertical Boring (With/Without/Only), Route Ops (With/Without/Only), Drill/Dowel Ops, Cut To Size Ops, Other Machine Ops\n- **Machines**: Tagged for Optimization (Yes/No), Tagged for CNC (Yes/No)\n- **Output**: Primary/Secondary/Drill-Dowel/Cut-To-Size Machine (Output to Machine / Not Output)\n\n**Saved** -- Save and manage named filter configurations\n\n---\n\n## 13. Machining Simulation\n\nClicking the Machining Simulation button takes the current Part or Pattern to the ALPHACAM Machining Simulator. **Only simulates programs generated through Intelli-CAM links.** Requires maximizing the ALPHACAM session in the Windows Taskbar.\n\n---\n\n## 14. Reports & NC Code Output\n\n### Pattern Reports\n- Standard pattern reports\n- Large Format pattern reports (2 patterns per page) -- Added in 2024\n- Pattern reports show Part Sizes and Part Names (togglable, added in 2024)\n- Font height control for Part Sizes/Names separate from Legend\n\n### Setup Reports\nConfigured in Reports sidebar area.\n\n### Part Reports\nSelected in Preferences > Reports > Part Report for Secondary Part Sheets.\n\n### Saw Optimization Reports\nOptions for including Offcuts and Gap Cuts (Grain Matching) in reports.\n\n---\n\n## 15. CNCRun.txt File Format\n\nThe CNCRun.txt file is generated per-machine (controlled by Output Summary setting) and lists all programs in the job.\n\n### Header\n```\n^Job : Job Name\n^Description : Job Description\n^Date : Monday, Jun 26 2020\n^Parts/Sheets : 1\n```\n\n### Record Format (comma-delimited)\n```\nr01p0001.dxf,Bottom(BO),304.00,889.00,19.05,3/4 2s White Melamine,5,1,0,B,0,\n```\n\n| Field # | Description |\n|---------|-------------|\n| 1 | Program Name |\n| 2 | Part Name |\n| 3 | Part Width |\n| 4 | Part Length |\n| 5 | Material Thickness |\n| 6 | Material Name |\n| 7 | Cabinet Number |\n| 8 | Part Quantity |\n| 9 | Material Grain (0=False, 1=True) |\n| 10 | Program Face (F=Front, B=Back) |\n| 11 | Material Face Dependent (0=False, 1=True) |\n| 12 | Machine Tag Code |\n| 13 | Machine Name |\n\n---\n\n## 16. PNX/SNX Database Schema\n\nPNX and SNX files are SQL backups that store all machining information for import/export.\n\n### Key Tables\n\n**Assemblies** -- Jobs, Rooms, Cabinets with Class (Base/Upper/Tall/Vanity/Sink/Split/Top) and Type (Standard/Corner/Corner 45/90/Peninsula/Lazy Susan/Pantry/End/Blind L-R/Filler)\n\n**EdgeBanding** -- Per-part banding with Edge (1-based counter-clockwise), Indicator (E=Exterior, I=Interior, D=Door), Material, Color, Thickness, EdgeIndicator (Front/Back/Top/Bottom)\n\n**Jobs** -- Full job metadata including customer info, dates (Measure, Detail, Production, Delivery, Deposit, Install, FinalPayment), Source (1=CV, 2=Kitchen Builder, 3=CabnetWare FF, 4=CabnetWare 32mm)\n\n**Materials** -- Sheet material definitions with ID, Name, Width, Length, Quantity, source tracking\n\n---\n\n## 17. Output Data File (3rd Party)\n\nAccessed from Room Level > Utilities Tab. Outputs part information to 3rd party applications.\n\n### Output Tabs\n1. **PNL File** -- Panel file with optional Room Number substitution for Cabinet Number\n2. **CUT File** -- Cut file with material type selection, grain setting, banding info, 32-field limit option\n3. **Material Usage** -- Populates matsum.mdb with material usage data from current job\n4. **DoorCIM** -- Door style lists with gaps and sizing adjustments, filterable by door type\n5. **Ottimo** -- SCM Ottimo format output with per-material file creation option\n6. **Custom** -- User-definable output format with configurable delimiter, text qualifier, units, precision, header, field selection\n\n### Custom Output Configuration\n- Fixed Width or Delimited\n- Text Qualifiers, Boolean Formats, Date Formats\n- Unit precision control (metric/imperial with factor of 10 option)\n- Extensive field list from Cabinet Vision data model\n\n---\n\n## 18. Databases & File Structure\n\n### Database Migration History\n- Pre-2022: .mdb (MS Access) format\n- 2022: .accdb (MS Access 2007+) format, 64-bit upgrade\n- 2024: Machine/Tool/Material/Offcut/Part Library data moved to CVData.mdf (SQL LocalDB). PSNC-xx.accdb migrated to .mdf.\n\n### Key Database Files\n- **CVData.mdf** -- Central data store (machines, tools, materials, offcuts, part library)\n- **PSNC.mdf** (formerly PSNC.accdb/mdb) -- Job-specific machining data\n- **PSNC-AC.accdb** -- ALPHACAM integration data\n- **PSNC-CV.accdb** -- Cabinet Vision integration data\n- **PSNC-CW.accdb** -- CabnetWare integration data\n- **PSNC-NC.accdb** -- NC output data\n- **PSNCLIB.accdb** -- Part library data\n- **matsum.mdb** -- Material usage summary for reporting\n\n### Run Number System\n- Stored in DBINFO table > RunCounter field in PSNC database\n- Incremented on each optimize or CNC export\n- Divided by Run Number Range; remainder added to minimum range\n- Example: RunCounter=723, Range=500-600 (100 range), 723/100=remainder 23, Run#=523\n- Can be overridden at optimize/export time; next run reverts to normal calculation\n\n---\n\n## 19. Preferences & Global Settings\n\n### CNC Programs\n- Run Number Format: 3 Digit Numeric (000-999), Alpha-Numeric (R00-RZZ, 1296 values), Standard (R00-R99, 100 values)\n- Run Number Range: Per-user assignment (e.g., Jeff=0-99, Sally=100-199)\n\n### Geometry (Critical Settings)\n- **Extend Dado Lengths by Tool Diameter** -- Extends rectangular dadoes by tool diameter\n- **Extend Single Pass Dado Lengths by Tool Diameter** -- Same for single-pass dadoes\n- **Combine Edge Operations with Part Outline** -- Routes that cut through part and touch edge combined into single outline cut\n- **Combine Boring to Through Boring** -- Front+Back bores of same diameter/location combined\n- **Mill Operations from Unfinished Face Where Possible** -- Through operations machined from unfinished face\n- **Only Route Outline of Through Holes** -- Warning: can produce airborne off-fall as tool leads out\n- **Ignore Operations Outside Part's Nest Boundary** -- Only machines operations within part outline\n- **Close Grain Match Gaps Larger Than** -- Controls gap handling in grain matching (0 or Kerf x 2 typical)\n- **Pre-Mill Edgebanding** -- Max or Fixed values for pre-mill station trim amount. Dynamically changes part sizes. Only valid for straight L/R/T/B edges that can be fed through bander. Arcs and edges adjacent to radii excluded.\n- **Soft Corner Radius** -- For MDF DoorMaker doors (max 1/4\" / 6.35mm)\n\n### CNC Tab\n- **Allow Invalid Pre-Assigned Tools to be Substituted** -- Fail-safe when a pre-assigned ToolID is invalid; falls back to auto-select\n\n### Ordering\n- **By Cabinet** -- Each sheet restricted to parts from one cabinet. Or overlap with controlled count.\n- **Minimize 6th Face Patterns** -- Forces 6th face ops to fewer sheets (sacrifices yield)\n- **Operation Processing Order** -- Drag to reorder which operation types are processed first\n\n### Miter Options\n- V-Bit tool matching for miters\n- Allow miters on concave (unsafe) edges (e.g., toe notch inside assembly)\n- **2-Axis Miters restricted from 6th face nesting** (damages sheet integrity for flipping)\n- 4/5-Axis Miters require workplanes and multi-axis tool/post support\n\n### Paperless Traveler (2024.3+)\n- Hexagon Customer ID and CV PT Token\n- Work Center Manager with report assignment\n- Assembly Sheet configuration per work center\n\n### Measurement Units\n- S2M stores everything as double-precision inches internally\n- Display units are user-selectable (Imperial/Metric) with precision options\n- Example: 56mm stored as 2.20472440944881\"\n\n---\n\n## 20. CNC FAQs & Troubleshooting\n\n### \"No Tool Found for dado or bore\" Error\n\n**For Line Boring:**\n1. Ensure Tool Catalog drill diameter EXACTLY matches operation diameter\n2. Match units (if operation in mm, tool must be in mm)\n3. Verify tool is assigned to the correct machine (or N/A for any)\n4. Ensure a valid tool exists for the operation type\n\n**For Dados:**\n1. Ensure dado width is NOT smaller than smallest flat router bit diameter\n2. Verify tool machine assignment\n3. Ensure valid tool exists\n\n### Assigning Specific Outline Tool to Material\nUse a UCS (User Created Standard):\n```\n;Make the 3/8 Compression the Unfinished Back Outline Tool\nFor Each UB Part\n  If _M:MatID = 123 Then\n    TOOLID = 13\n  End If\n```\nGet Tool ID from grayed-out field in Tool Catalog. Get Material ID from Material Manager.\n\n### Adding a Cutout to a Cabinet Part\n1. Take Assembly to Assembly Level\n2. Ortho Plan View > Right-click part > Edit\n3. Reports View > New Operation > Add \"Route\" at desired size\n4. Select face in sidebar, right-click Edit or double-click the Route\n5. Shape the route as needed using the Shape Editor\n\n### Saw Booking (Stacking) Problems\nSet Max Sheets to maximum stack count for thinnest material. Leave Max Booking Height as-is. S2M Center calculates per-material stacking based on height limit.\n\n---\n\n## 21. Version History (CNC-Relevant Features)\n\n### 2024\n- Show Part Sizes/Names on Patterns\n- Database migration: Machine/Tool/Material/Offcut/Part Library to CVData.mdf\n- PSNC databases migrated from ACCDB to SQL LocalDB (MDF)\n- ALPHACAM multi-drill support options\n- Comment characters for G-code output\n- Hover Tool Comp on Arc\n- Saw link origin controls (Holzma, SCM Ottimo, SCM PTX)\n- Selco XML improvements\n- Outline Offcuts (largest to smallest) improvements\n- Large Format pattern reports\n- Paperless Traveller integration\n- Part Router Label Format and Zone information\n\n### 2023\n- Square Off Nest toolpath visible on patterns\n- Saw Optimization: Finished Face Up/Down option\n- Trim Cuts for Offcuts\n- Parts Not Optimized system report\n- Tool work depth minimum\n- QR code in +Label\n- SCM PTX saw link\n\n### 2022\n- 64-bit upgrade (S2M Center and IntelliCAM/ALPHACAM engine)\n- Database format: .mdb to .accdb migration\n- BSA Label Applicator, Alpha Beam Saw, BeamBoard, Barbaric Material Handler\n\n### Version 12\n- New Nest Rotation options\n- Setup Sheet Boundaries for Small/Very Small Parts (TrueShape)\n\n### Version 11\n- Redesigned Machine Catalog and Tool Catalog\n- Mix different drill diameters in multi-drill drops\n- **Option for Whether A or Z Program Gets Labeled for 6th Face**\n- Three sorting options for Outline Cut Order\n- Profile Operation Type in Tool Sets\n\n### Version 4.1 (2012 R2)\n- **Minimize 6th Face Patterns** option\n- Setup Sheet Boundaries for Small/Very Small Parts (TrueShape)\n- Sloped Arc Leads for Pockets\n- Logic to identify/machine single bore when multiples share same location\n\n### Version 4.0\n- Ignore Operations Outside Part's Nest Boundary\n\n### Version 3.0 (2011 R1)\n- **6th Face Nesting** (initial introduction)\n- Common Line Cutting\n- True Shape Nesting Engine (completely new)\n- Flip Part Over in pattern view\n- Pre-Mill Edgebanding allowances\n- New Drill Optimization for older machines\n- Rough Cut for Onion Skins\n\n### Version 2.2\n- Onion Skin and Tab improvements\n- Small Parts handling refinements\n\n---\n\n## 22. EFSJ Issue Mapping\n\n### CRITICAL: 6th Face Programming Misalignment\n\n**Issue:** When programming both sides of a board (6th face), the sheet gets trimmed on the first side. When flipped to machine the second side, dados and other features are misaligned by the exact amount the sheet was trimmed. Shop floor is actively getting bad cuts.\n\n**Severity:** P0 -- Production impacting, causing scrap and rework.\n\n**Relevant Settings to Investigate (in priority order):**\n\n1. **Rotate 6th Face Trim** (Machine Catalog > Sheet Router > Nesting > 6th Face Group)\n   - Must match physical 0/0 reference pin location on Onsrud 148HD\n   - Wrong setting = trim on wrong edges = flip misaligns by trim amount\n\n2. **Trim Cut Values** (Optimizer Parameters > Trim Tab)\n   - Sheet edge trim values must match actual material removed\n   - 6th face trims by HALF the Trim Cut value on one long + one short edge\n   - If actual cut differs from programmed value, offset occurs\n\n3. **Post Processor Coordinate Transformation** (Postability .pst file)\n   - A-program coordinates must correctly account for the flip transformation\n   - The coordinate system mirrors on one axis when sheet is flipped\n   - Reference: `docs/specs/cnc-post-processor/` for EFSJ post analysis\n\n4. **Machine Origin Settings** (Machine Catalog > Limitations Tab)\n   - Point of Origin\n   - Material Length is X (TRUE/FALSE)\n   - X Positive from Origin / Y Positive from Origin\n   - These define coordinate system that must be consistent pre/post flip\n\n5. **Physical Machine Setup**\n   - 0/0 reference pin location and condition\n   - Spoil board flatness (warped = inconsistent flip registration)\n   - Operator technique consistency\n\n**Quick Test Protocol:**\n1. Create a simple test part: 8mm bore on Face 1, 8mm bore on Face 6, same X/Y position\n2. Output with 6th face enabled\n3. Run A program, flip, run Z program\n4. Measure bore alignment -- if offset = trim amount, confirm Rotate 6th Face Trim or trim value issue\n5. If offset = constant but != trim amount, suspect origin/post processor issue\n\n**References:**\n- S2M Help > Machine Catalog > Sheet Router > Nesting > 6th Face Group\n- S2M Help > Preferences > Ordering > Minimize 6th Face Patterns\n- S2M Help > Preferences > Miter Options (2-axis restriction on 6th face)\n- S2M Help > Preferences > Geometry > Combine Boring to Through Boring\n- CNC Post Processor analysis: `docs/specs/cnc-post-processor/`\n"}, {"id": "system-database", "file": "KB_SYSTEM_DATABASE.md", "title": "System & Database", "blurb": "UCS (smart parts), parameters, databases, network/multi-user, licensing, catalog editor", "md": "# Cabinet Vision 2024 — System Administration, Databases & Automation\n\n> Extracted from Cabinet Vision 2024 Help System (cv-main, cv-ce, cv-cr modules).\n> Covers: database architecture, User Created Standards (UCS), settings transfer, network setup, parametric editing, Catalog Editor, Custom Reports, and the Section/Shape Editors.\n\n---\n\n## Table of Contents\n\n1. [System Architecture & Data Flow](#1-system-architecture--data-flow)\n2. [Database Architecture](#2-database-architecture)\n3. [File Locations & What Lives Where](#3-file-locations--what-lives-where)\n4. [Backup & Restore](#4-backup--restore)\n5. [Transferring Standards Between Users](#5-transferring-standards-between-users)\n6. [Setup Package Utility](#6-setup-package-utility)\n7. [Network & Multi-User Setup](#7-network--multi-user-setup)\n8. [Licensing](#8-licensing)\n9. [User Created Standards (UCS)](#9-user-created-standards-ucs)\n10. [UCS JavaScript (UCS:JS)](#10-ucs-javascript-ucsjs)\n11. [UCS Functions, Operators & Parameters](#11-ucs-functions-operators--parameters)\n12. [System Parameters Reference](#12-system-parameters-reference)\n13. [Parametric Editing & Intelligence Workshop](#13-parametric-editing--intelligence-workshop)\n14. [Section Editor](#14-section-editor)\n15. [Shape Editor & Constraints](#15-shape-editor--constraints)\n16. [Catalog Editor (Custom Entry)](#16-catalog-editor-custom-entry)\n17. [Custom Reports (xRender)](#17-custom-reports-xrender)\n18. [Preferences & System Defaults](#18-preferences--system-defaults)\n19. [EFSJ Issue Mapping](#19-efsj-issue-mapping)\n\n---\n\n## 1. System Architecture & Data Flow\n\n### How It All Comes Together\n\nCabinet Vision operates in a **hierarchical level system**:\n\n```\nSystem Level (global defaults)\n  └── Job Level (copied from System at job creation)\n       └── Room Level\n            └── Assembly Level\n                 └── Part Level\n                      └── Operation Level\n```\n\n**Key rules:**\n- When starting a Job, CV copies System Files into the Job. Changes at any Job level do NOT affect System Level unless you explicitly use \"Set As System Defaults.\"\n- Changes in one Job do not affect other Jobs. Changes in one Room do not affect other Rooms.\n- CV looks for instructions starting at the **lowest level** and works UP. When it finds what it needs, it stops looking higher.\n- If you change doors at the Assembly level, then change doors at the Room level, all assemblies use the Room-level doors EXCEPT the one already changed at the Assembly level.\n\n### Set As System Defaults\n\n**Menu path:** File > System Properties > \"Set As System Defaults\" button\n\nStores current settings (heights, depths, cabinet class values) as defaults for all future Jobs. Once you save a Job Template, this button disappears — templates replace it.\n\nSystem Default settings are stored in the **Windows Registry**.\n\n---\n\n## 2. Database Architecture\n\nCabinet Vision uses **SQL Server databases** (`.mdf` files) and **Access databases** (`.accdb` files). Understanding what each stores is critical for troubleshooting, transfers, and multi-user setups.\n\n### CVData.mdf — The Master Database\n\n**Location:** `C:\\ProgramData\\Hexagon\\CABINET VISION\\Common 2024\\Database\\`\n\nThis is the PRIMARY database. It stores ALL of the following:\n\n| Data Category | Key Tables |\n|---|---|\n| **Construction Methods** | Assembly construction parameters, drawer construction, rollout construction, top construction |\n| **Materials** | Material definitions, Material Schedules, Finishes, Finish Types, Textures |\n| **Doors** | Door catalog, profiles, door styles, door mappings |\n| **Parts** | Parts catalog, part definitions |\n| **User Created Standards** | All UCS code, UCS settings, UCS libraries |\n| **Intelli-Joints** | Joint definitions and associations |\n| **Object Catalogs** | Assembly catalogs, assembly definitions, pricing data |\n| **CAD Symbols & Drawings** | Drawing templates, title blocks, CAD symbols |\n| **CNC Data** | Tool catalogs, Machine catalogs |\n| **Connections** | Connection definitions |\n\n**Critical tables in CVData.mdf:**\n\n- **Assembly** — Stores catalog objects (ID, name, dimensions, class, type, hinge direction, auto-fill flag, weight, price, tags, shape)\n- **AssemblyCatalog** — Catalog definitions (name, description, modular increment, contributor)\n- **AssemblyCatalogDoorStyle** — Links door styles to catalogs with price labels\n- **AssemblyCatalogDoorStyleDoorMap** — Maps specific doors to styles with upcharges\n- **Material** — Material definitions with all properties\n- **MaterialSchedule** — Material schedule linkages\n- **Door** — Door definitions\n- **Profile** — Profile shapes\n- **UCS** — User Created Standards code and settings\n- **IntelliJoint** — Joint definitions\n- **Connection** — Part connection definitions\n\nEvery record has `rGUID` (globally unique identifier) and `LastUpdate` timestamp.\n\n### Report.mdf — Reports & Bid Data\n\n**Location:** `C:\\ProgramData\\Hexagon\\CABINET VISION\\CV 2024\\Database\\`\n\nContains Report Groups, Bid Methods/Rate Tables, and cut list/summary data. **Most data is TEMPORARY** — when Bid Center or Report Center is opened, tables are flushed and re-populated.\n\n**Key tables:**\n\n| Table | Purpose |\n|---|---|\n| **Accessories** | Accessories used in current job (ID, cabinet reference, price, quantity, room, labor minutes) |\n| **Bid Methods** | Rate table definitions (name, description, icon, applies-to flags) |\n| **Bid Setup** | Bid line items per job (description, price, method, markup, tax, group, subgroup) |\n| **BidReports** | Report definitions (name, description, system flag, printer info) |\n| **Cabinets** | All cabinets in current job (dimensions, room, catalog, door style, construction method) |\n| **Material** | Material summary for current job (name, quantities, dimensions, costs, waste factors) |\n| **Parts** | Part cut list data (material, dimensions, edgebanding, grain direction, CNC operations) |\n| **Rooms** | Room definitions (name, dimensions) |\n| **BidReportGroups** | Report grouping |\n| **Hardware** | Hardware items used in job |\n\n### BidData.accdb — Job-Specific Pricing\n\n**Location:** Stored within each job file\n\nContains pricing data for the current job:\n\n| Table | Purpose |\n|---|---|\n| **PriceData** | Price data by type: 1=Bid Data, 2=Labor, 3=Labor Worksheet, 4=Per Room RateTable, 5=Per Room Add-Ons |\n| **PriceList** | Per-item pricing: BasePrice, ListPrice (base+upcharges), CostPrice (list*discount), SellPrice (cost+additional), TaxedPrice |\n\n### ManageIT.accdb — xCRM Data\n\n**Location:** `C:\\ProgramData\\Hexagon\\CABINET VISION\\CV 2024\\Repository\\`\n\nStores the xCRM multiplier data:\n\n| Table | Purpose |\n|---|---|\n| **Accounts** | Customer/Vendor/Contractor/User/Project records with category flags (1-5) |\n| **Contacts** | Contact details per account |\n| **Jobs** | Job records with checkout status (1=New, 2=Checked-out, 3=Checked-in) |\n| **Job Versions** | Version history for jobs (date, comment, price) |\n| **Tasks** | Task assignments per account |\n| **Properties/DefaultProperties** | Custom properties per record (Text/Currency/Integer/Single/Measure/Yes-No/List/Filename) |\n\n### MatSum.mdf — Material Summary\n\n**Location:** `C:\\ProgramData\\Hexagon\\CABINET VISION\\CV 2024\\Database\\`\n\nStores material summary information for the last job taken to Report or Bid Center.\n\n---\n\n## 3. File Locations & What Lives Where\n\n| File | Location | Purpose |\n|---|---|---|\n| `CVData.mdf` | `C:\\ProgramData\\Hexagon\\CABINET VISION\\Common 2024\\Database\\` | ALL Construction Methods, Materials, Schedules, UCS, Intelli-Joints, Catalogs, Doors, CNC data |\n| `Report.mdf` | `C:\\ProgramData\\Hexagon\\CABINET VISION\\CV 2024\\Database\\` | Report Groups and Bid Rate Tables |\n| `ManageIT.accdb` | `C:\\ProgramData\\Hexagon\\CABINET VISION\\CV 2024\\Repository\\` | xCRM customer/vendor data |\n| `Default.dat` | `C:\\ProgramData\\Hexagon\\CABINET VISION\\CV 2024\\` | Layer Schedules and Dimension Styles |\n| `DefaultCLST.dat` | `C:\\ProgramData\\Hexagon\\CABINET VISION\\CV 2024\\` | Layer Schedules for Closet Module |\n| `.cfg files` | `C:\\ProgramData\\Hexagon\\CABINET VISION\\CV 2024\\Database\\` | Job Property schemes |\n| `.cvj files` | `C:\\Users\\Public\\Documents\\CABINET VISION\\CV 2024\\` | Job files (can be stored anywhere) |\n| `.jpg/.bmp files` | `C:\\ProgramData\\Hexagon\\CABINET VISION\\CV 2024\\Database\\Graphics\\` | Custom imported textures |\n| `BidData.accdb` | Within job file | Per-job bid/pricing data |\n| `Prices.mdf` | `C:\\ProgramData\\Hexagon\\CABINET VISION\\CV 2024\\Database\\` | Simple Price Table |\n\n### The \"Common\" vs \"CV\" Directory Split\n\n- **`Common 2024\\`** — Shared data (CVData.mdf). On a network, this can be on the server.\n- **`CV 2024\\`** — Per-installation data (Reports, Repository, layer files, config).\n\n---\n\n## 4. Backup & Restore\n\n### Backup Utility\n\n**Menu path:** Utilities Tab > Backup Utility\n\n**Items that can be backed up:**\n\n| Item | Database/File | Notes |\n|---|---|---|\n| Construction Methods | CVData.mdf | Includes Cabinet/Drawer Construction Methods, UCS, Intelli-Joints |\n| Part/Material/Door Catalogs | CVData.mdf | Materials, Material Schedules, Doors, Parts. Auto-includes user textures |\n| Object Catalogs | CVData.mdf | All Object/Assembly Catalogs |\n| Drawings | CVData.mdf | CAD Symbols, Title Blocks |\n| Report Database | Report.mdf | Reports, Report Groups, Bid Rate Tables |\n| CNC Database | CVData.mdf | Tool and Machine catalogs |\n| Posts | Post files | All CNC post processor files |\n| System Parameters | Windows Registry | System-level parameter settings |\n| Material Summary | MatSum.mdf | Last job's material summary |\n| Prices.mdf | Prices.mdf | Simple Price Table |\n| .CFG Files | .cfg files | Job Schemes |\n| xCRM Data | ManageIT.accdb | Customer/vendor database |\n| Default.dat/DefaultCLST.dat | .dat files | Layer/dimension settings |\n| BidData.mdf | BidData file | Bid data |\n| All Graphics | Graphics folder | All graphic files |\n| Assigned Materials Textures | Graphics folder | Only textures assigned to materials |\n\n**Toolbar options:**\n- Save Backup — Creates backup based on Include list\n- Email Backup — Emails an existing backup\n- Zip Backup — Creates backup directly to zip file\n- Delete Backup — Remove old backups to free space\n- Settings — Configure automatic deletion and backup destination\n\n**Backup location:** `C:\\ProgramData\\Hexagon\\CABINET VISION\\Common 2024\\Automatic Backups\\` (folder named with date/time)\n\n**Command-line switches for automated backup:**\n```\nCVBackup.exe /g     # Suppress GUI (silent, uses last settings)\nCVBackup.exe /z     # Create zip file\nCVBackup.exe /e     # Create email with attachment\nCVBackup.exe /d     # Delete backups after email\nCVBackup.exe /p     # Suppress over-limit prompt\nCVBackup.exe /r     # Make files read-only\nCVBackup.exe /g /p  # Silent backup, suppress prompts\n```\n\n### Restore\n\n**Menu path:** Windows Start > CABINET VISION 2024 > Restore CV 2024 Settings\n\n1. Close CABINET VISION first\n2. Select the backup folder (left pane)\n3. Check which files to restore (right pane)\n4. Click OK — runs appropriate update routines automatically\n\n---\n\n## 5. Transferring Standards Between Users\n\n### Complete Standards Transfer Procedure\n\n**Step 1:** Open Backup Utility (Utilities Tab > Backup Utility)\n\n**Step 2:** Include at minimum the standard items (Construction Methods, Part/Material/Door Catalogs, Object Catalogs, etc.). Click Save.\n\n**Step 3:** This creates a dated folder in `Automatic Backups\\` containing individual files + `backup.zip`.\n\n**Step 4:** Transfer the backup folder to the target machine:\n- Same computer: Copy from old version's `Automatic Backups\\` to `C:\\ProgramData\\Hexagon\\CABINET VISION\\Common 2024\\Automatic Backups\\`\n- Different computer: Copy to USB or network share, then paste to target path\n\n**Step 5:** On target machine, close CV, run \"Restore CV 2024 Settings\" from Start Menu.\n\n**Step 6:** Select the transferred folder, check files to restore, click OK.\n\n### Post-Transfer Checklist\n\n1. **Door Manager:** Open CV > Door Manager > Utilities > \"Generate Icons\" to update door icons\n2. **S2M Center:** Re-select Primary/Secondary machines, create new Output Directory, re-select Post paths, re-enter Post codes\n3. **Test thoroughly:** Older UCS may not work or may no longer be needed in the new version. Construction Methods need review for new/updated routines.\n\n### Specific File Transfers\n\n| What | File | Location | Transfer Method |\n|---|---|---|---|\n| Layer Schedules | `Default.dat` | `CV 2024\\` | Direct file copy |\n| Title Blocks | Via Setup Package | N/A | Use Setup Package Utility |\n| Job Files | `.cvj` files | `CV 2024\\` job folder | Direct file copy (forward-only: edited in 2024 = can't use in older) |\n\n**WARNING:** Jobs edited in Version 2024 can NO LONGER be used in earlier versions. Always work on copies.\n\n---\n\n## 6. Setup Package Utility\n\n**Menu path:** Utilities Tab > Setup Package\n\nThe Setup Package is the **preferred method** for transferring specific items between CV installations. It preserves unique identifiers — truly plug-and-play.\n\n### What Can Be Packaged\n\nBid Reports, Catalogs, Connections, Construction Methods, Door Catalogs, Doors (auto-includes Profiles, Material Schedules), Drawer Boxes (auto-includes Material Schedule), Drawings, Finish Types, Finishes, Intelli-Joints, Labels, Machines, Material Schedules (auto-includes Materials), Materials (auto-includes Finishes, Textures), Parameters, Parts, Profiles, Rate Tables, Reports, Roll Outs, S2M Reports, Textures, Tools (auto-includes all Tools in set), Top Construction Methods, User Created Standards (auto-includes referenced Intelli-Joints, Materials, Finishes, Schedules), Vendors.\n\n### Creating a Package\n\n1. Utilities Tab > Setup Package\n2. Select items from left-side category list\n3. Click \"Add Items To Package\" (use Ctrl+Click or Shift+Click for multi-select)\n4. Click \"Save Current Package\" toolbar button\n5. Fill in License Description and contact info\n6. For Object Catalogs, choose license type:\n   - **None** — Normal catalog\n   - **Protected** — Read-only catalog (can optionally hide cutlist)\n   - **Distributed** — Self-contained, read-only catalog for dealers (no database dependencies)\n7. Save to location, optionally email via Outlook\n\n### Importing a Package\n\n1. Utilities Tab > Setup Package\n2. Click \"Open An Existing Package\" toolbar button\n3. Select the package file\n4. Click Import tab\n5. Optional: Set a prefix for imported item names (Add Prefix button)\n6. **Choose Overwrite behavior:**\n   - **All Matches - Overwrite** — Package contents replace existing items\n   - **All Matches - Use Existing** — Keep your items, ignore package duplicates\n   - **Child Matches - Overwrite** — Replace children of matching items only\n   - **Child Matches - Use Existing** — Keep existing children\n   - **Toggle Overwrite** — Select individually per item\n7. Click \"Import Package\"\n\n### Uninstalling a Package\n\n1. Utilities Tab > Setup Package\n2. Click \"Show History of Imports\" toolbar button\n3. Select package > Delete\n\n---\n\n## 7. Network & Multi-User Setup\n\n### Briefcase (Disconnected Workstation)\n\n**Menu path:** Utilities Tab > Briefcase\n\nThe Briefcase feature allows a network workstation to **disconnect from the server** with a copy of the network databases for offline work. When reconnected, changes sync back.\n\n- Briefcase disabled icon = connected to network data-set\n- Briefcase enabled icon = disconnected, working on local copy\n- Status bar shows \"Briefcase\" mode indicator\n- You still need to commute your network license separately\n- Process time depends on data-set size and network speed\n\n### Network Administrator\n\n**Menu path:** Windows Start > CABINET VISION 2024 > Network Administrator\n\n#### Users Tab\n- Create users with granular access rights\n- Rights control access to: CV Assembly Wizard, Backup/Restore, Bid Center, Cabinet Level, Connections, Custom Catalogs, Door Catalog, Drawer Catalog, Drawing Templates, Intelli-Joint Catalog, Material Catalog, Material Schedules, Parameters, Part Catalog, Part Level, Profile Catalog, Report Center, Section Editor, Stock Catalogs, Top Wizard, UCS, S2M CENTER (Machine Catalog, Material Catalog, Optimizer, Output NC, Tool Catalog)\n- Access levels per area: None, View, Edit\n- **Best practice:** Match CV username to Windows login name for auto-selection\n\n#### Status Tab\n- Shows which users are currently logged in\n- **Unlock Job** button — unlocks jobs that became locked after a system crash\n- **Lockout All Users** — deny all access during maintenance\n\n### Network Database Architecture\n\n- **Shared database** (`CVData.mdf`) lives on the server in `Common 2024\\Database\\`\n- Workstations point to the server's database location\n- `Report.mdf` and user-specific files remain local per workstation\n- `.cvj` files can be stored on a shared network location\n\n---\n\n## 8. Licensing\n\n### License Types\n\n- **Standalone** — Single PC, direct license\n- **Network** — Server-based licensing via Sentinel RMS License Server\n\n### Network License Setup\n\n#### Server Setup\n1. Sentinel RMS License Server installed automatically with CV Network Installation\n2. Open License Manager (CV Splash Screen > Utilities Tab)\n3. Server menu > Search Network to find Sentinel RMS servers\n4. Select server > Change Active Server\n5. Install License button:\n   - Option A: Enter Servercode > \"Request License File\" (Internet)\n   - Option B: Enter Servercode > \"Use License File\" > browse to `.one`, `.clss`, or `.clsn` file\n\n#### Workstation Setup\n1. Install workstation via Network Install\n2. Open License Manager\n3. Server menu > Search Network\n4. Select server > Change Active Server\n5. Click individual module licenses to select/deselect them\n6. Use License Profiles for automated selection at startup\n\n### Commuting Licenses (Offline Work)\n\n1. License Manager > Right-click server > Commute Configured Licenses\n2. Set number of days (max 30)\n3. Click Commute\n4. Change to Commuter as active server\n5. **License is unavailable to others until returned or expiry**\n\n### License Profiles\n\n- Enable \"Use License Profiles\" in License Manager\n- Set Profiles Location directory\n- Enable \"Ask For Profile On Startup\"\n- Save/Save As/Delete profiles with different license combinations\n\n### Administrator Mode\n\n- Controls access to install, update, revoke, and commute functions\n- Tools menu > Administrator Mode (toggle on/off)\n- Set password via Change Password dialog\n- Can optionally prevent users from commuting licenses\n\n---\n\n## 9. User Created Standards (UCS)\n\n### Overview\n\nUCS are custom macros that modify, add, or delete parts/operations in assemblies automatically. They are the primary automation mechanism in Cabinet Vision.\n\n**Menu path:** Utilities Tab > User Created Standards\n\n### UCS Types\n\n| Type | Purpose | Example |\n|---|---|---|\n| **Add (Link) A Part** | Add a new part/operation linked to an existing part | Add 4 shelf clips to each adjustable shelf |\n| **Modify A Part** | Change properties of an existing part | Set shelf depth to 12\" in sink base cabinets |\n| **Delete A Part** | Remove a part/operation from assemblies | Delete tops on sink base cabinets |\n\n### UCS Macro Types\n\n| Type | Icon | Description |\n|---|---|---|\n| **UCS:M** | Standard icon | Classic UCS macro language (native CV) |\n| **UCS:JS** | JS icon | JavaScript UCS — more powerful, supports debugging with VS Code |\n\n### UCS Manager Interface\n\n**Columns:**\n- **Type** — UCS:M or UCS:JS\n- **Order** — Processing priority (use Up/Down buttons to change)\n- **Name** — UCS name (click to rename)\n- **Description** — From first remark line in code\n- **Part** — Primary part selected at creation\n- **Pre-Build** — Whether to apply before or after assembly build\n- **Enabled** — Active/inactive toggle\n\n**Libraries Tab:**\n- For UCS:JS, create shared function libraries as JavaScript classes\n- Library name becomes `_libraryname` (lowercase, underscore prefix) in code\n- Example: Library \"Math\" with `area(w,l)` method → `_math.area(width, length)` in UCS\n\n### Pre-Build Toggle\n\n- **OFF (default):** UCS runs AFTER the assembly is built by Construction Method\n- **ON:** UCS runs BEFORE the assembly is built\n\n**When to use Pre-Build ON:** For parameters that affect HOW the assembly is built (BKTYPE, ESHAPL, ESHAPR, ETL, ETR). These require a rebuild to take effect.\n\n**When Pre-Build is NOT needed:** Parameters like DX, DY, DZ, X, Y, Z that change size/position immediately.\n\n**Test approach:** Try with Pre-Build OFF first. If results only appear after Room Rebuild, try Pre-Build ON.\n\n### UCS Wizard\n\nThe Wizard guides creation of basic UCS through step-by-step tabs:\n\n1. **General Tab** — Name, Type (Add/Modify/Delete), Part selection, Macro Type (UCS:M or JavaScript)\n2. **Link To Tab** (Add only) — Which part to link the new part to\n3. **Assembly Class Tab** — Filter by class (Base, Upper, Tall, Vanity, etc.)\n4. **Assembly Properties Tab** — Filter by assembly name pattern (wildcards: `SB*`, `SP*`)\n5. **End Type Tab** — Filter by cabinet end types\n6. **Construction Methods Tab** — Filter by construction method\n7. **Conditions Tab** — Part-specific conditions with 6 comparators\n8. **Values/Properties Tab** — Set values or parameters\n\n### UCS Editor (Code View)\n\n**Menu path:** UCS window > Code button (or right-click > Open)\n\nFeatures:\n- **Intelli-sense** — Auto-complete with parameter list and descriptions\n- **Collapsible nodes** in gutter for easier navigation\n- **Monikers** for quick database lookups:\n  - `MaterialID(`, `AsmConstID(`, `DoorStyleID(`, `TopConstID(`\n  - `DrawerConstID(`, `RollOutConstID(`, `IJointID(`\n  - `AsmScheduleID(`, `SlideRailScheduleID(`, `TopScheduleID(`\n  - `DrawerScheduleID(`, `RollOutScheduleID(`, `ColorScheduleID(`\n  - `RoomScheduleID(`, `DoorScheduleID(`, `PullScheduleID(`\n  - `HingeScheduleID(`, `GuideScheduleID(`, `MoldingScheduleID(`\n  - `WireBasketScheduleID(`, `ClosetRodScheduleID(`\n  - `FinishID(`, `TextureID(`\n\n**Keyboard shortcuts:** Cut line (Ctrl+Y), Go to end (Ctrl+End), Go to start (Ctrl+Home), Go to line (Ctrl+G), Toggle whitespace (Ctrl+Shift+W)\n\n### The Basic 9 Parameters\n\nEvery CV object has these fundamental parameters:\n\n| Parameter | Meaning | Notes |\n|---|---|---|\n| **X** | Position left(-)/right(+) | Relative to wall start |\n| **Y** | Position down(-)/up(+) | Relative to wall start |\n| **Z** | Position back(-)/forward(+) | Relative to wall start |\n| **DX** | Width | Part width / Assembly width / Wall width |\n| **DY** | Length/Height | Part length / Assembly height / Wall height |\n| **DZ** | Thickness/Depth | Part thickness / Assembly depth / Wall depth |\n| **AX** | X-axis rotation | Right-hand rule |\n| **AY** | Y-axis rotation | Right-hand rule |\n| **AZ** | Z-axis rotation | Right-hand rule |\n\n### UCS Evaluation Order\n\nCV follows this sequence to generate an assembly:\n\n1. Assembly generated per Construction Method; Connections created between parts\n2. **UCS processed** for Assembly, its Parts, and Connections\n3. Parts generated\n4. Parts relocated\n5. Connector creates Operations\n6. **UCS processed** for connection-generated objects\n7. Connection-generated objects built\n8. Connection-generated objects relocated\n\n**Within UCS processing:** Standards evaluated in their list order (UCS #1 for current assembly, then UCS #2, etc.). Each UCS processes in Object Tree order — children of higher branches have higher priority than parents of lower branches.\n\n### For Each Statement (UCS:M)\n\nThe \"For Each\" defines WHICH objects the UCS applies to:\n\n```\nFor Each CAB Assembly           ; All cabinet assemblies\nFor Each AS|FS Part             ; Adjustable Shelf or Fixed Shelf parts\nFor Each RF Part                ; Right Front parts\nFor Each DWR_OPEN|DOR_OPEN Part ; Drawer openings or door openings\nFor Each MS Part                ; Mid Stile parts\nFor Each LF|RF Part             ; Left Front or Right Front parts\n```\n\nUse pipe `|` to specify multiple targets. The `this` object substitutes for the current For Each target.\n\n### Public Variables\n\n```\nPublic VariableName = DefaultValue ;Description\nPublic BSpacing = imp(32) ;Bore spacing\nPublic Oversized := DX > 40 ;When is cabinet oversized?\n```\n\n- Declared on single lines at top of UCS\n- Exposed in the property list sidebar when UCS is selected\n- Can be edited without modifying code\n- Once modified via property list, that value persists (database flag set)\n\n### UCS Code Examples\n\n**Modify shelf depth in sink base:**\n```\n;Shelf Depth in Sink Base Cabinet\nFor Each FS Part\nIf Cab.Type = ASM_TYPE_SINK Then\n  DY = 12\nEnd If\n```\n\n**Delete tops on sink base cabinets:**\n```\n;Deletes Tops on Sink Base Cabinets\nFor Each TOP Part\nIf Cab.Name = 'SB*' Then\n  QTY <int> = 0\nEnd If\n```\n\n**Add 4 shelf clips to adjustable shelves:**\n```\n;Add Shelf Clips\nFor Each AS Part\nDim CLIP as New Part\nCLIP.Name = 'Shelf Clip'\nCLIP.QTY = 4\nCLIP.DX = 0.125\nCLIP.DY = 0.125\n```\n\n**Change back type based on wall depth:**\n```\n;Deletes Finished Back on Cabinets at Peninsula Walls\nFor Each Cab Assembly\nIf ::DZ < Imp(.5) Then\n  BKTYPE = 0\nEnd If\n```\n\n**Add non-graphic accessory:**\n```\n;Adds a Non-Graphic Accessory to a Cabinet\nFor Each CAB Assembly\nDim Addon as New NGAcsry\nAddon.Visible = False\nAddon.Name = 'Non-graphic Accessory'\nAddon.PRICE = 5\nAddon.Weight = 20\nAddon.DX = 10\nAddon.DY = 15\nAddon.DZ = 6\nAddon.Upchg = 5\nAddon.Labor = 45\n```\n\n**Add line and arc route operations:**\n```\n;Adds a Line Operation\nFor Each RF Part\nDim LIN as New Line\nLIN._FACEWP = 1\nLIN.Visible <bool> = True\nLIN.DX = 0\nLIN.DY = 10\nLIN.DZ = 0.25\nLIN.X = 5\nLIN.Y = 5\nLIN.Z = 0\nLIN._RCUT = 2\nLIN.TOOLID = 5\n```\n\n---\n\n## 10. UCS JavaScript (UCS:JS)\n\n### Key Differences from UCS:M\n\n| Aspect | UCS:M | UCS:JS |\n|---|---|---|\n| **For Each** | Defined in code | Defined as UCS property (via \"Add Apply Conditions\") |\n| **Objects** | Implicit (`DX = 5`) | Explicit (`_this.DX = 5` or `_this.SetParameter('DX', 5)`) |\n| **Variables** | All become object parameters | Standard JS `var` — NOT parameters unless explicitly set |\n| **Public Variables** | Defined in code | Defined in UCS Manager UI |\n| **Case sensitivity** | Case insensitive | Case SENSITIVE (JavaScript rules) |\n| **Functions** | Not supported | Full JS functions supported |\n| **Data structures** | None | Full JS (Map, Array, objects, etc.) |\n| **Libraries** | Code duplication | Shared JS class libraries |\n| **Debugging** | None | VS Code debugging (via Debug UCS button in Utilities Tab) |\n\n### Object References\n\n- `_this` — The current \"For Each\" object being processed\n- `_cab` — The current assembly (cabinet)\n- Properties like `.DX`, `.DY`, `.DZ`, `.NAME`, `.TYPE`, `.CLASS` are shorthand for common parameters\n\n### JavaScript Object Model (CVAsmManaged)\n\n**Properties:**\n```javascript\n_this.NAME    // VAL_TEXT\n_this.DESC    // VAL_TEXT\n_this.CLASS   // VAL_INTEGER (ASM_CLASS_BASE, ASM_CLASS_UPPER, etc.)\n_this.TYPE    // VAL_INTEGER (ASM_TYPE_STANDARD, ASM_TYPE_SINK, etc.)\n_this.X, _this.Y, _this.Z      // VAL_MEASUREMENT\n_this.DX, _this.DY, _this.DZ   // VAL_MEASUREMENT\n_this.AX, _this.AY, _this.AZ   // VAL_DEGREES\n_this.QTY     // VAL_INTEGER\n_this.VISIBLE // VAL_BOOL\n```\n\n**Key Methods:**\n\n| Method | Purpose |\n|---|---|\n| `CreateChild(type, name, [desc])` | Create child object (OBJ_PART, OBJ_DOOR, OBJ_OPERATION, etc.) |\n| `Evaluate(equation)` | Evaluate CV equation: `_this.Evaluate('DX * DY * DZ')` |\n| `EvaluateCondition(condition)` | Evaluate CV condition: `_this.EvaluateCondition('DY > 5')` |\n| `FindAssembly(path)` | Locate assembly by CV object path: `_this.FindAssembly(':AS@3')` |\n| `GetParameterValue(name)` | Get parameter value |\n| `SetParameter(name, value, [type])` | Set parameter value |\n| `HasParameter(name)` | Check if parameter exists |\n| `GetFirstChild()` | Get first child in object tree |\n| `GetNextSibling()` | Get next sibling in object tree |\n| `GetParent()` | Get parent object |\n| `QueryID(type, name)` | Query database ID for resource (construction, schedule, material, etc.) |\n| `RemoveParameter(name)` | Remove parameter from object |\n| `ReplacePart(librarypart)` | Replace with library part: `_this.ReplacePart('Custom Cabinets\\\\Special End')` |\n| `CreateChoiceList(name, list, type)` | Create choice list: `'Medium=50|Big=99|Small=1'` |\n| `ModifyParameter(name, action, value)` | Modify parameter style/description |\n| `FormatText(format)` | Format text with parameter substitution: `_this.FormatText('WIDTH{DX}')` |\n\n**Object Type Constants:** `OBJ_ASSEMBLY`, `OBJ_OPENING`, `OBJ_PART`, `OBJ_DOOR`, `OBJ_DRWFRONT`, `OBJ_MOLDING`, `OBJ_NGACSRY`, `OBJ_HARDWARE`, `OBJ_PULL`, `OBJ_GUIDE`, `OBJ_HINGE`, `OBJ_HINGEPLATE`, `OBJ_OPERATION`, `OBJ_HOLE`, `OBJ_DADO`, `OBJ_LINEBORE`, `OBJ_ROUTE`, `OBJ_LINE`, `OBJ_ARC`\n\n**Assembly Class Constants:** `ASM_CLASS_BASE`, `ASM_CLASS_UPPER`, `ASM_CLASS_TALL`, `ASM_CLASS_VANITY`, `ASM_CLASS_APPL`, `ASM_CLASS_ACSRY`, `ASM_CLASS_TOP`, `ASM_CLASS_MOLDING`, `ASM_CLASS_CLOSET`, etc.\n\n**Assembly Type Constants:** `ASM_TYPE_STANDARD`, `ASM_TYPE_BLINDR`, `ASM_TYPE_BLINDL`, `ASM_TYPE_CORNER45`, `ASM_TYPE_CORNER90`, `ASM_TYPE_FILLER`, `ASM_TYPE_SINK`, `ASM_TYPE_RANGE`, `ASM_TYPE_COOKTOP`, `ASM_TYPE_DISHWASHER`, etc.\n\n**End Type Constants:** `ASM_END_FINISHED`, `ASM_END_UNFINISHED`, `ASM_END_EXTENDED`, `ASM_END_RETURN`, `ASM_END_APPL_FE`, `ASM_END_APPL_DOOR`, `ASM_END_PANELIZED`, `ASM_END_CLIPPED`, `ASM_END_RADIUSED`, `ASM_END_ANGLED`\n\n**QueryID Type Constants:** `ID_ASSEMBLYCONSTRUCTION`, `ID_MATERIAL`, `ID_FINISH`, `ID_TEXTURE`, `ID_DOORSCHEDULE`, `ID_DRAWERCONSTRUCTION`, `ID_IJOINT`, `ID_CONNECTION`, etc.\n\n### Global JavaScript Functions\n\n```javascript\nalert(message)           // Display message box\nImperial(value)          // Convert to imperial (value / 25.4)\nMetric(value)            // Convert to metric (value * 25.4)\n\n// _cvMath API — safe floating-point comparisons (epsilon = 1.19e-04)\n_cvMath.isEQ(v1, v2)     // Equal within tolerance\n_cvMath.isGT(v1, v2)     // Greater than\n_cvMath.isGTE(v1, v2)    // Greater than or equal\n_cvMath.isLT(v1, v2)     // Less than\n_cvMath.isLTE(v1, v2)    // Less than or equal\n_cvMath.isZero(v)        // Equal to zero\n```\n\n### UCS:JS Example — Material Switching by Dimension\n\n```javascript\n// Switch adjustable shelf material based on cabinet width\nif (_cab.GetParameterValue('CONSTID') == _this.QueryID(ID_ASSEMBLYCONSTRUCTION, 'Frameless')) {\n  if (_cab.DX >= 25) {\n    if (_cab.TYPE == ASM_TYPE_STANDARD) {\n      _this.DY += 10;\n    }\n  }\n}\n```\n\n### Converting UCS:M to UCS:JS\n\n- Select UCS:M in list\n- Click \"Convert to JS\" button\n- Original UCS:M is kept as backup\n- \"Restore UCS\" button reverts to original UCS:M (WARNING: UCS:JS is lost)\n\n### JavaScript Libraries\n\nLibraries provide shared functions across multiple UCS:JS scripts:\n\n```javascript\n// Library \"Geometry\" defined in CV — available as _geometry in scripts\nclass Geometry {\n  area(width, length) {\n    return width * length;\n  }\n  volume(width, length, depth) {\n    return width * length * depth;\n  }\n}\n\n// Usage in any UCS:JS:\nvar w = _this.GetParameterValue('DX');\nvar l = _this.GetParameterValue('DY');\nvar d = _this.GetParameterValue('DZ');\n_this.SetParameter('MYAREA', _geometry.area(w, l));\n_this.SetParameter('MYVOLUME', _geometry.volume(w, l, d));\n```\n\n---\n\n## 11. UCS Functions, Operators & Parameters\n\n### Computation Operators\n\n| Operator | Description | Example |\n|---|---|---|\n| `-` | Unary/Binary Minus | `-X` or `X - Y` |\n| `+` | Unary/Binary Plus | `+X` or `X + Y` |\n| `*` | Multiplication | `X = X * 2` |\n| `/` | Division | `X = DX / 2` |\n| `%` | Modulus | `X = Y % Z` |\n| `^` | Exponential | `X = Y ^ Z` |\n\n### Comparison Operators\n\n| Operator | Description |\n|---|---|\n| `!` | Logical NOT |\n| `<`, `>` | Less than, Greater than |\n| `<=`, `>=` | Less/Greater than or equal |\n| `==` | Equivalence (required in IF statements) |\n| `!=` | Inequality |\n| `&` | Logical AND |\n| `\\|` | Logical OR |\n| `null` | Check for null/parameter existence |\n\n### Assignment Operators\n\n| Operator | Description | Example |\n|---|---|---|\n| `=` | Assign equation | `X = 2 + 2` (stores the equation) |\n| `:=` | Compute Now | `X := 2 + 2` (stores 4, evaluated immediately) |\n| `+=` | Adjust Add | `DX += 2` |\n| `-=` | Adjust Subtract | `DX -= 2` |\n| `*=` | Adjust Multiply | `DX *= 2` |\n| `/=` | Adjust Divide | `DX /= 2` |\n| `Delete` | Remove parameter | `Delete DX` |\n\n### Mathematical Functions\n\n| Function | Description |\n|---|---|\n| `Abs(X)` | Absolute value |\n| `Int(X)` | Integer portion |\n| `Trunc(X, N)` | Truncate to N decimal places |\n| `Round(X, N)` | Round to N decimal places |\n| `Imp(X)` | Convert to Imperial (mm to inches: X/25.4) |\n| `Met(X)` | Convert to Metric (inches to mm: X*25.4) |\n| `Min(X, Y)` | Minimum of X and Y |\n| `Max(X, Y)` | Maximum of X and Y |\n| `Sqr(X)` | Square root |\n| `Sgn(X)` | Sign (-1, 0, or 1) |\n\n### Trigonometric Functions\n\n| Function | Description |\n|---|---|\n| `Sin(X)`, `Cos(X)`, `Tan(X)` | Standard trig (degrees) |\n| `ASin(X)`, `ACos(X)`, `ATan(X)` | Inverse trig |\n| `ATan2(Y, X)` | Two-argument arctangent |\n\n### Value Type Definitions\n\n| Type | Syntax | Description |\n|---|---|---|\n| `<crncy>` | Currency | Money values |\n| `<meas>` | Measurement | Default type; auto-converts Imperial/Metric |\n| `<deg>` | Degrees | Angle values |\n| `<int>` | Integer | Whole numbers |\n| `<bool>` | Boolean | True (1) / False (0) |\n| `<dec>` | Decimal | Exact numeric |\n| `<text>` | Text | String values |\n\n### Text Building\n\n```\nNAME = w{DX}h{DY}d{DZ}            ; e.g., \"w24h30d12\"\nPARTMAT = {material name of mat}   ; Material name lookup\n```\n\n### The \"this\" Object\n\n`this` substitutes for the For Each target, allowing a single code block to handle multiple object types:\n\n```\n;Using the THIS Object\nFor Each DWR_OPEN|DOR_OPEN Part\nIf this.DOR.S_DSLAB.DX > 5 Then\n  Do It All\nEnd if\n```\n\n### Material Parameters\n\nAccess material properties on parts using the `_M:` prefix:\n```\n_M:DZ          ; Material thickness\n_M:TRIM        ; Banding length trim\n_M:DEPTH       ; Wire basket depth\n_M:WIDTH       ; Wire basket width\n_M:RT          ; Board stock rough thickness\n_M:SC          ; Guide side clearance\n_M:CNCOPT      ; CNC optimizable (0/1)\n_M:CNCGD       ; CNC grain dependency (0/1)\n_M:CNCDL       ; CNC drop length\n_M:CNCDW       ; CNC drop width\n```\n\n---\n\n## 12. System Parameters Reference\n\nCabinet Vision has hundreds of system parameters. Key categories:\n\n### Assembly Parameters\n- `_BD`, `_WD`, `_TD` — Default depths (Base, Wall, Tall)\n- `_BH`, `_WH`, `_TH` — Default heights\n- `BKTYPE` — Back type (0=unfinished, 1=finished)\n- `CONSTID` — Construction method ID\n- `ESHAPL`, `ESHAPR` — End shape left/right (2=to floor)\n- `ETL`, `ETR` — End type left/right\n\n### Part Parameters\n- `_FACEWP` — Face work plane (1=front, 2=back, 3=top, 4=bottom, 5=left, 6=right)\n- `_RCUT` — Route cut type\n- `TOOLID` — Operation tool ID\n- `IJNT` — Intelli-Joint ID\n- `BAND` — Part banding definition\n- `_CONNID` — Connection ID\n- `_EDGWP` — Edge work plane\n\n### Job/Room Parameters\n- `_3DHDIR`, `_3DVDIR` — 3D view directions\n- `_3DIST` — 3D viewing distance\n- `_AI` — Wall angle from previous wall\n- `_BBPRF` — Baseboard molding profile\n- `_APPRF` — Applied molding profile\n\n### Custom Parameters (Utilities Tab > Parameters)\n\nUser-defined parameters with:\n- **Prompt** — User-friendly display name\n- **Parameter** — Internal name (recommended prefix: `U_`)\n- **Value** — Default value (supports choice lists: `Opt 2=2|Opt 1=1|Opt 3=3`)\n- **Type** — Measurement, Degrees, Integer, Boolean, Decimal, Text\n- **Class** — Job, Room, Cabinets, Base Cabinet, Wall Cabinet, Tall, Vanity, Closets\n- **Style** — Attribute (shows on Attributes tab) or Note (shows on Notes tab)\n\nParameters appear in the sidebar and on the Attributes/Notes tabs at their assigned class level. Choice lists can be added via UCS:\n\n```\n;Add a choice list through a UCS\nFor Each LF|RF Part\nIf _UCSLST = null Then\n  _UCSLST <int> = '<lst>Val 2=2|Val 1=1|Val 3=3'\n  _UCSLST <style> = 1\n  _UCSLST <desc> = 'UCS'\nEnd If\n```\n\n---\n\n## 13. Parametric Editing & Intelligence Workshop\n\n### Concept\n\nParametric editing (the \"Intelligence Workshop\") teaches how to write formulas for object intelligence — making parts respond automatically to changes in cabinet dimensions.\n\n### Formula Writing Principles\n\n1. **Find the reference point** of your part (view from Face ortho and Side view)\n2. **Avoid referencing ends directly** — there are 10 end types, requiring 10 formulas. Instead, reference parts that already move correctly (decks, nailers, stretchers).\n3. **Choose a \"sibling\" part** that has the value you need and changes the way you want.\n4. **Use the Object Tree** to navigate part paths like `:AS@3` (Assembly, 3rd child)\n\n### The 3 Position Axes\n\n| Formula Target | Movement | When to Write |\n|---|---|---|\n| **X (Left/Right)** | Part moves left or right | When end thickness changes |\n| **Y (Up/Down)** | Part moves up or down | When cabinet height changes |\n| **Z (Front/Back)** | Part moves front or back | When cabinet depth changes |\n\n### The 3 Dimension Axes\n\n| Formula Target | Dimension | When to Write |\n|---|---|---|\n| **DX (Width)** | Part width | When cabinet width changes |\n| **DY (Length/Height)** | Part length | When cabinet height changes |\n| **DZ (Thickness/Depth)** | Part thickness | When material changes |\n\n### Troubleshooting Error Messages\n\n- Most errors from incorrect part path references\n- Use the Object Tree to verify paths exist\n- Check that referenced parts actually exist in all construction method configurations\n\n---\n\n## 14. Section Editor\n\n### Overview\n\nThe Section Editor allows reconfiguring assembly faces (doors, drawers, false fronts, openings, panels) while retaining parametric logic.\n\n**Access:** Section View tab > Section Face option\n\n### Tools\n\n| Tool | Description |\n|---|---|\n| Split Horiz. | Single horizontal division |\n| Split Vert. | Single vertical division |\n| Split Multi Horiz. | Multiple horizontal divisions |\n| Split Multi Vert. | Multiple vertical divisions |\n\n### Key Concepts\n\n- **Order matters:** The FIRST split determines which parts are long axis. Horizontal first = horizontal is long axis, then vertical splits create subdivisions.\n- **Highlight the active area** — shaded region shows what will be split.\n- Assemblies can be saved to Library and reused.\n- Editing retains logic for response to dimension changes.\n- Section editing is at the Assembly level — changes don't affect other assemblies.\n\n### Face vs. Interior Editing\n\n- **Face editing:** Modifies the visible face (doors, drawers, panels)\n- **Interior editing:** Modifies internal structure (shelves, partitions, dividers)\n- **Face/Section/Case Logic Transfer:** Settings transfer between face editing and section/case views\n\n---\n\n## 15. Shape Editor & Constraints\n\n### Constraints System\n\nThe Shape Editor uses geometric constraints to make shapes respond to parameter changes:\n\n| Constraint | Description |\n|---|---|\n| **Fix** | Locks a point/entity in place |\n| **Horizontal** | Forces a line horizontal |\n| **Vertical** | Forces a line vertical |\n| **Perpendicular** | Forces two lines perpendicular |\n| **Parallel** | Forces two lines parallel |\n| **Tangent** | Forces tangency between entities |\n| **Coincident** | Forces two points to same location |\n| **Concentric** | Forces circles/arcs to share center |\n| **Equal** | Forces two entities to same size |\n| **Symmetric** | Forces symmetry about an axis |\n| **Collinear** | Forces two lines on same infinite line |\n\n### Automatic Constraints\n\nCV automatically applies constraints based on geometry:\n- Lines drawn horizontally get Horizontal constraint\n- Lines drawn vertically get Vertical constraint\n- Lines meeting at a point get Coincident constraint\n- Lines at right angles get Perpendicular constraint\n\n### Constraint Tutorial\n\nThe Shape Editor tutorial walks through creating constrained shapes that respond to dimension parameters, maintaining proportions and relationships as the cabinet resizes.\n\n---\n\n## 16. Catalog Editor (Custom Entry)\n\n### Overview\n\n**Access:** Windows Start > CABINET VISION 2024 > Catalog Editor for CV 2024\n\nThe Catalog Editor creates and maintains Object Catalogs. It has an add-on license for full functionality; without it, activities are limited.\n\n### Views\n\n| View | Purpose |\n|---|---|\n| **Explorer View** | Browse, copy, paste, delete, rename objects in catalog tree |\n| **Options View** | Define option types, options, and option effects |\n| **Doors View** | Link door styles to catalog objects |\n| **Reports View** | Print catalog reports (Door Styles, Line Pricing, Options, Variables) |\n\n### End-to-End Catalog Creation Process\n\n1. **Catalog Header Setup** — Set Internal Name, Description, Modular=Yes, Door Database name, Mix Styles setting, Standard Dimensions, Two Pull Width\n2. **Price Labels** — Create price categories (single base price or per-door-style categories)\n3. **Door Styles** — Link manufacturing door names to retail style names\n4. **Options** — Create option types (Job/Room level and Assembly level) with available choices\n5. **Option Effects** — Link options to Construction, Materials, Hardware, Finish, Modifications, UCS\n6. **Pricing** — Set up Stock Pricing formulas with Variables, Options, Totals, and Lines\n\n### Modular Mode\n\nWhen Modular=Yes:\n- CV looks to Catalog Editor FIRST for construction, material, pricing info\n- Falls back to Job/Room Properties if not found in catalog\n- Price Labels control which pricing category is used per door style\n\n### Stock Pricing System\n\nThree default variables:\n- **Discount List Price** — Percentage off total list price → selling price\n- **MFG Multiplier** — Percentage of list price → dealer cost\n- **Upcharge Dealer Cost** — Percentage of dealer cost → selling price\n\nFormula system:\n- Lines can reference Variables (`<V:name>`), Totals (`<T:name>`), and other Lines (`<L:name>`)\n- Price Per toggle: \"Cab\" (per cabinet) vs \"Job\" (once per job)\n- Show/Hide toggle for report visibility\n- 255-character formula limit\n- Formulas calculate in written order (no parentheses — use multiple lines)\n\n### UCS as Catalog Options\n\nUCS can be triggered by catalog options:\n1. Create the UCS normally (e.g., \"Delete Mid Stile\")\n2. In Catalog Editor Options View, create an option\n3. Double-click option > UCS tab > select the UCS, set value to 1\n4. When option is selected in CV, a `_UCSN` parameter is added to the cabinet\n5. Add `If _UCSN = 1 Then` to the UCS code to make it conditional\n\n### Pricing Tools\n\n- **Export Prices** — Exports to CSV for editing in Excel\n- **Import Prices** — Imports updated CSV back\n- **Update Prices** — Wizard for bulk percentage or dollar amount updates (all categories or per-category)\n- **Simple Pricing Table** — Per-item pricing with $/Item, $/Inch h, $/Inch w, $/Sqft (w*h, w*d, h*d)\n\n---\n\n## 17. Custom Reports (xRender)\n\nThe `cv-cr` module is actually xRender — CV's rendering application for creating photorealistic renders from CV scenes.\n\n### Features\n- Opens `.CVR` render files from CV\n- Camera controls: Rotate, Move, Birdseye, Walk Through playback\n- Lighting: Edit individual lights, ambient/sun control\n- Export: PNG, and through standard Save/Save As\n- Post-processing: Tone mapping (Photographic/Neutral/Exposure/Exponential), Exposure, Gamma, White Balance, Brightness, Contrast, HSL\n\n### Report Export Formats (from Catalog Editor Reports View)\n\nReports can be exported to:\n- Adobe PDF, XHTML/CSS, Multi-Mime HTML\n- Microsoft Excel, Word, XPS\n- Rich Text Format (RTF)\n- Images: TIFF, PNG, JPEG, Bitmap, Metafile (EMF)\n- HTML, HTML jQuery Mobile\n- Text: CSV, Layout\n- XML\n\n---\n\n## 18. Preferences & System Defaults\n\n### Preferences\n\n**Menu path:** File > Preferences (or System Properties)\n\n#### User Tab\nCompany information for reports and CAD notes.\n\n#### Measurement Units Tab\n- CV stores EVERYTHING internally as Imperial (inches) as a double integer (15 decimal places)\n- Display settings are purely cosmetic — 56mm is always stored as `2.20472440944881`\n- Options: Inches (fractional or decimal), Millimeters, Angle precision (0-3 decimal places)\n- \"Trim trailing decimal zeros\" option\n- \"Allow unit-switch button on Status Bar\" option\n\n#### General Tab\n- **Undo/Redo stack** — Recommended: ~5 (higher values consume RAM)\n- **Auto-Save** — Recommended: 10-20 minutes (1 minute causes performance issues with large jobs)\n- Auto-save creates `.asv` files alongside `.cvj` files\n- Named `Untitled.asv` if job was never saved\n\n**Auto-Save Architecture:**\n1. Timer starts when job opens or is created\n2. At time limit, `.asv` file created in same directory as `.cvj`\n3. Timer resets\n4. When user saves `.cvj`, `.asv` is deleted, timer resets\n\n---\n\n## 19. EFSJ Issue Mapping\n\n### Issue 1: Settings Sync Between Users — Import ADDS Instead of OVERWRITING\n\n**Root Cause:** When using the Setup Package Import, the default behavior depends on the Overwrite option selected.\n\n**Solution — Clean Overwrite:**\n\n1. **Use Setup Package** (not raw file copy): Utilities Tab > Setup Package\n2. When importing, select **\"All Matches - Overwrite\"** — this replaces ALL existing items with package contents\n3. For finishes specifically, select **\"Child Matches - Overwrite\"** to replace children of matching items\n\n**Preserving Saved Library Items (Cabinets):**\n- Object Catalogs are a SEPARATE backup item from Construction Methods/Materials\n- When importing with \"All Matches - Overwrite,\" ONLY export/import the specific categories needed (e.g., Construction Methods + Materials + Finishes), leaving Object Catalogs out of the package\n- Alternatively, use **\"Toggle Overwrite\"** mode to select exactly which items to overwrite and which to keep\n\n**The Briefcase approach (for ongoing sync):**\n- For network users, Briefcase handles sync automatically — changes made offline merge back to the server database\n- This is the cleanest ongoing sync because it operates on the shared `CVData.mdf`\n\n**Recommended EFSJ procedure:**\n1. Master user creates a Setup Package with Construction Methods + Part/Material/Door Catalogs\n2. Target user imports with \"All Matches - Overwrite\" for a clean sync\n3. Target user's personal Object Catalogs (saved cabinets) are NOT affected because they weren't in the package\n4. After import, run \"Generate Icons\" in Door Manager\n\n### Issue 2: UCS Capabilities — Auto-Switching Materials Based on Dimensions\n\n**Yes, UCS
